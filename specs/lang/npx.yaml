version: '20261013'
description: "Run a command from a local or remote npm package"
flags:
  --package: {value: any, description: package to install before running}
  -p: {value: any, description: package to install before running}
  -c: {value: any, description: shell command to run}
  --call: {value: any, description: shell command to run}
  -y: {description: install without asking}
  --yes: {description: install without asking}
  --no: {description: refuse to install missing packages}
  -w:
    value:
      exec: node -e 'let d=process.cwd(),p=require("path");try{for(const w of require(p.join(d,"package.json")).workspaces||[])console.log(w)}catch(e){}'
    description: run in this workspace
  --workspace:
    value:
      exec: node -e 'let d=process.cwd(),p=require("path");try{for(const w of require(p.join(d,"package.json")).workspaces||[])console.log(w)}catch(e){}'
    description: run in this workspace
  --workspaces: {description: run in all workspaces}
  --include-workspace-root: {description: also run in the root project}
args:
  exec: d=$PWD; while :; do [ -d "$d/node_modules/.bin" ] && ls "$d/node_modules/.bin"; [ "$d" = / ] && break; d=$(dirname "$d"); done
snippets:
  - key: t
    mark: pin
    command: 'npx tsc --noEmit'
    description: 'type-check the project'
  - key: p
    mark: pin
    command: 'npx prettier --write .'
    description: 'format all files'
  - key: e
    command: 'npx eslint .'
    description: 'lint the project'
  - key: c
    command: 'npx create-vite@latest'
    description: 'scaffold a Vite app'
  - key: s
    command: 'npx serve .'
    description: 'serve the current dir over HTTP'
  - key: y
    command: 'npx -y '
    description: 'run without the install prompt'
  - key: u
    command: 'npx npm-check-updates -u'
    description: 'bump package.json versions'

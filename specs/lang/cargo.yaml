version: '20261015'
description: Rust package manager
flags:
  --help: {aliases: [-h], description: "Show help"}
  --version: {aliases: [-V], description: "Show version"}
  --verbose: {aliases: [-v], description: "Use verbose output", show: always}
  --quiet: {aliases: [-q], description: "Do not print cargo log messages"}
  --color: {value: any, description: "Coloring: auto, always, never"}
  --frozen: {description: "Require Cargo.lock and cache are up to date"}
  --locked: {description: "Require Cargo.lock is up to date", show: always}
  --offline: {description: "Run without accessing the network"}
  -Z: {value: any, description: "Unstable (nightly-only) flags to Cargo"}
commands:
  build:
    description: Compile the current package
    aliases: [b]
    flags:
      --package: {aliases: [-p], value: {exec: "cargo metadata --no-deps --format-version=1 2>/dev/null | python3 -c \"import json,sys;[print(p['name']) for p in json.load(sys.stdin)['packages']]\""}, description: "Package to build"}
      --bin: {value: {exec: "cargo metadata --no-deps --format-version=1 2>/dev/null | python3 -c \"import json,sys;[print(t['name']) for p in json.load(sys.stdin)['packages'] for t in p['targets'] if 'bin' in t['kind']]\""}, description: "Build only the specified binary"}
      --lib: {description: "Build only this package's library"}
      --example: {value: {exec: "cargo metadata --no-deps --format-version=1 2>/dev/null | python3 -c \"import json,sys;[print(t['name']) for p in json.load(sys.stdin)['packages'] for t in p['targets'] if 'example' in t['kind']]\""}, description: "Build only the specified example"}
      --test: {value: {exec: "cargo metadata --no-deps --format-version=1 2>/dev/null | python3 -c \"import json,sys;[print(t['name']) for p in json.load(sys.stdin)['packages'] for t in p['targets'] if 'test' in t['kind']]\""}, description: "Build only the specified test target"}
      --bench: {value: {exec: "cargo metadata --no-deps --format-version=1 2>/dev/null | python3 -c \"import json,sys;[print(t['name']) for p in json.load(sys.stdin)['packages'] for t in p['targets'] if 'bench' in t['kind']]\""}, description: "Build only the specified bench target"}
      --release: {aliases: [-r], description: "Build artifacts in release mode"}
      --debug: {description: "Build artifacts in debug mode"}
      --features: {value: any, description: "Space or comma separated list of features to activate"}
      --all-features: {description: "Activate all available features"}
      --no-default-features: {description: "Do not activate the default features"}
      --jobs: {aliases: [-j], value: any, description: "Number of parallel jobs"}
      --target: {value: any, description: "Build for the target triple"}
      --target-dir: {value: dir, description: "Directory for all generated artifacts"}
      --verbose: {aliases: [-v], description: "Use verbose output"}
      --quiet: {aliases: [-q], description: "Do not print cargo log messages"}
      --color: {value: any, description: "Coloring: auto, always, never"}
      -Z: {value: any, description: "Unstable (nightly-only) flags to Cargo"}
      --frozen: {description: "Require Cargo.lock and cache are up to date"}
      --locked: {description: "Require Cargo.lock is up to date"}
      --offline: {description: "Run without accessing the network"}
      --manifest-path: {value: file, description: "Path to Cargo.toml"}
  check:
    description: Check the current package for errors
    aliases: [c]
    flags:
      --package: {aliases: [-p], value: {exec: "cargo metadata --no-deps --format-version=1 2>/dev/null | python3 -c \"import json,sys;[print(p['name']) for p in json.load(sys.stdin)['packages']]\""}, description: "Package to check"}
      --bin: {value: {exec: "cargo metadata --no-deps --format-version=1 2>/dev/null | python3 -c \"import json,sys;[print(t['name']) for p in json.load(sys.stdin)['packages'] for t in p['targets'] if 'bin' in t['kind']]\""}, description: "Check only the specified binary"}
      --lib: {description: "Check only this package's library"}
      --example: {value: {exec: "cargo metadata --no-deps --format-version=1 2>/dev/null | python3 -c \"import json,sys;[print(t['name']) for p in json.load(sys.stdin)['packages'] for t in p['targets'] if 'example' in t['kind']]\""}, description: "Check only the specified example"}
      --test: {value: {exec: "cargo metadata --no-deps --format-version=1 2>/dev/null | python3 -c \"import json,sys;[print(t['name']) for p in json.load(sys.stdin)['packages'] for t in p['targets'] if 'test' in t['kind']]\""}, description: "Check only the specified test target"}
      --bench: {value: {exec: "cargo metadata --no-deps --format-version=1 2>/dev/null | python3 -c \"import json,sys;[print(t['name']) for p in json.load(sys.stdin)['packages'] for t in p['targets'] if 'bench' in t['kind']]\""}, description: "Check only the specified bench target"}
      --release: {aliases: [-r], description: "Check artifacts in release mode"}
      --features: {value: any, description: "Space or comma separated list of features to activate"}
      --all-features: {description: "Activate all available features"}
      --no-default-features: {description: "Do not activate the default features"}
      --jobs: {aliases: [-j], value: any, description: "Number of parallel jobs"}
      --target: {value: any, description: "Check for the target triple"}
      --target-dir: {value: dir, description: "Directory for all generated artifacts"}
      --verbose: {aliases: [-v], description: "Use verbose output"}
      --quiet: {aliases: [-q], description: "Do not print cargo log messages"}
      --color: {value: any, description: "Coloring: auto, always, never"}
      --frozen: {description: "Require Cargo.lock and cache are up to date"}
      --locked: {description: "Require Cargo.lock is up to date"}
      --offline: {description: "Run without accessing the network"}
      --manifest-path: {value: file, description: "Path to Cargo.toml"}
  run:
    description: Run a binary or example of the local package
    aliases: [r]
    flags:
      --package: {aliases: [-p], value: {exec: "cargo metadata --no-deps --format-version=1 2>/dev/null | python3 -c \"import json,sys;[print(p['name']) for p in json.load(sys.stdin)['packages']]\""}, description: "Package to run"}
      --bin: {value: {exec: "cargo metadata --no-deps --format-version=1 2>/dev/null | python3 -c \"import json,sys;[print(t['name']) for p in json.load(sys.stdin)['packages'] for t in p['targets'] if 'bin' in t['kind']]\""}, description: "Name of the bin target to run"}
      --example: {value: {exec: "cargo metadata --no-deps --format-version=1 2>/dev/null | python3 -c \"import json,sys;[print(t['name']) for p in json.load(sys.stdin)['packages'] for t in p['targets'] if 'example' in t['kind']]\""}, description: "Name of the example target to run"}
      --release: {aliases: [-r], description: "Build artifacts in release mode"}
      --features: {value: any, description: "Space or comma separated list of features to activate"}
      --all-features: {description: "Activate all available features"}
      --no-default-features: {description: "Do not activate the default features"}
      --jobs: {aliases: [-j], value: any, description: "Number of parallel jobs"}
      --target: {value: any, description: "Build for the target triple"}
      --target-dir: {value: dir, description: "Directory for all generated artifacts"}
      --verbose: {aliases: [-v], description: "Use verbose output"}
      --quiet: {aliases: [-q], description: "Do not print cargo log messages"}
      --color: {value: any, description: "Coloring: auto, always, never"}
      --frozen: {description: "Require Cargo.lock and cache are up to date"}
      --locked: {description: "Require Cargo.lock is up to date"}
      --offline: {description: "Run without accessing the network"}
      --manifest-path: {value: file, description: "Path to Cargo.toml"}
  test:
    description: Execute unit and integration tests and build examples of a local package
    aliases: [t]
    flags:
      --package: {aliases: [-p], value: {exec: "cargo metadata --no-deps --format-version=1 2>/dev/null | python3 -c \"import json,sys;[print(p['name']) for p in json.load(sys.stdin)['packages']]\""}, description: "Package to test"}
      --bin: {value: {exec: "cargo metadata --no-deps --format-version=1 2>/dev/null | python3 -c \"import json,sys;[print(t['name']) for p in json.load(sys.stdin)['packages'] for t in p['targets'] if 'bin' in t['kind']]\""}, description: "Test only the specified binary"}
      --lib: {description: "Test only this package's library unit tests"}
      --example: {value: {exec: "cargo metadata --no-deps --format-version=1 2>/dev/null | python3 -c \"import json,sys;[print(t['name']) for p in json.load(sys.stdin)['packages'] for t in p['targets'] if 'example' in t['kind']]\""}, description: "Test only the specified example"}
      --test: {value: {exec: "cargo metadata --no-deps --format-version=1 2>/dev/null | python3 -c \"import json,sys;[print(t['name']) for p in json.load(sys.stdin)['packages'] for t in p['targets'] if 'test' in t['kind']]\""}, description: "Test only the specified test target"}
      --bench: {value: {exec: "cargo metadata --no-deps --format-version=1 2>/dev/null | python3 -c \"import json,sys;[print(t['name']) for p in json.load(sys.stdin)['packages'] for t in p['targets'] if 'bench' in t['kind']]\""}, description: "Test only the specified bench target"}
      --doc: {description: "Test only this library's documentation"}
      --release: {aliases: [-r], description: "Build artifacts in release mode"}
      --features: {value: any, description: "Space or comma separated list of features to activate"}
      --all-features: {description: "Activate all available features"}
      --no-default-features: {description: "Do not activate the default features"}
      --jobs: {aliases: [-j], value: any, description: "Number of parallel jobs"}
      --target: {value: any, description: "Build for the target triple"}
      --target-dir: {value: dir, description: "Directory for all generated artifacts"}
      --no-run: {description: "Compile, but don't run tests"}
      --no-fail-fast: {description: "Run all tests regardless of failure"}
      --verbose: {aliases: [-v], description: "Use verbose output"}
      --quiet: {aliases: [-q], description: "Do not print cargo log messages"}
      --color: {value: any, description: "Coloring: auto, always, never"}
      --frozen: {description: "Require Cargo.lock and cache are up to date"}
      --locked: {description: "Require Cargo.lock is up to date"}
      --offline: {description: "Run without accessing the network"}
      --manifest-path: {value: file, description: "Path to Cargo.toml"}
  bench:
    description: Execute all benchmarks of a local package
    flags:
      --package: {aliases: [-p], value: any, description: "Package to benchmark"}
      --bench: {value: {exec: "cargo metadata --no-deps --format-version=1 2>/dev/null | python3 -c \"import json,sys;[print(t['name']) for p in json.load(sys.stdin)['packages'] for t in p['targets'] if 'bench' in t['kind']]\""}, description: "Benchmark only the specified bench target", show: always}
      --release: {description: "Build artifacts in release mode"}
      --features: {value: any, description: "Space or comma separated list of features to activate"}
      --all-features: {description: "Activate all available features"}
      --no-default-features: {description: "Do not activate the default features"}
      --target: {value: any, description: "Build for the target triple"}
      --no-run: {description: "Compile, but don't run benchmarks", show: always}
  doc:
    description: Build a package's documentation
    flags:
      --package: {aliases: [-p], value: any, description: "Package to document"}
      --no-deps: {description: "Do not build documentation for dependencies"}
      --open: {description: "Opens the docs in a browser after the operation"}
      --release: {description: "Build artifacts in release mode"}
      --features: {value: any, description: "Space or comma separated list of features to activate"}
      --all-features: {description: "Activate all available features"}
      --no-default-features: {description: "Do not activate the default features"}
      --target: {value: any, description: "Build for the target triple"}
  new:
    description: Create a new Cargo package
    flags:
      --bin: {description: "Use a binary (application) template"}
      --lib: {description: "Use a library template"}
      --name: {value: any, description: "Set the resulting package name"}
      --edition: {value: any, description: "Edition to set for the crate generated"}
      --vcs: {value: any, description: "Initialize a new repository for the given version control system"}
      --registry: {value: any, description: "Registry to use"}
      --verbose: {aliases: [-v], description: "Use verbose output"}
  init:
    description: Create a new Cargo package in an existing directory
    flags:
      --bin: {description: "Use a binary (application) template"}
      --lib: {description: "Use a library template", show: always}
      --name: {value: any, description: "Set the resulting package name", show: always}
      --edition: {value: any, description: "Edition to set for the crate generated"}
      --vcs: {value: any, description: "Initialize a new repository for the given version control system", show: always}
      --registry: {value: any, description: "Registry to use"}
      --verbose: {aliases: [-v], description: "Use verbose output"}
  add:
    description: Add dependencies to a Cargo.toml manifest file
    flags:
      --dev: {description: "Add as development dependency"}
      --build: {description: "Add as build dependency"}
      --features: {value: any, description: "Space or comma separated list of features to activate", show: always}
      --default-features: {description: "Re-enable the default features"}
      --no-default-features: {description: "Disable the default features", show: always}
      --optional: {description: "Mark the dependency as optional", show: always}
      --path: {value: dir, description: "Filesystem path to local crate to add", show: always}
      --git: {value: any, description: "Git repository location"}
      --branch: {value: any, description: "Git branch to download the crate from"}
      --tag: {value: any, description: "Git tag to download the crate from"}
      --rev: {value: any, description: "Git reference to download the crate from"}
      --registry: {value: any, description: "Registry to use"}
      --package: {aliases: [-p], value: any, description: "Package to modify"}
      --verbose: {aliases: [-v], description: "Use verbose output"}
  remove:
    description: Remove dependencies from a Cargo.toml manifest file
    flags:
      --dev: {description: "Remove as development dependency"}
      --build: {description: "Remove as build dependency"}
      --package: {aliases: [-p], value: any, description: "Package to modify"}
  update:
    description: Update dependencies as recorded in the local lock file
    aliases: [up]
    flags:
      --package: {aliases: [-p], value: any, description: "Package to update", show: always}
      --aggressive: {description: "Force updating all dependencies"}
      --precise: {value: any, description: "Update a single dependency to exactly the specified version", show: always}
      --dry-run: {description: "Display what would be updated, but don't write the lock file", show: always}
      --verbose: {aliases: [-v], description: "Use verbose output"}
  search:
    description: Search packages in crates.io
    flags:
      --limit: {value: any, description: "Limit the number of results", show: always}
      --index: {value: any, description: "Registry index URL to upload the package to"}
      --registry: {value: any, description: "Registry to use"}
  publish:
    description: Upload a package to the registry
    flags:
      --index: {value: any, description: "Registry index URL to upload the package to"}
      --token: {value: any, description: "Token to use when uploading"}
      --no-verify: {description: "Don't verify the contents by building them"}
      --allow-dirty: {description: "Allow dirty working directories to be packaged"}
      --registry: {value: any, description: "Registry to use", show: always}
      --dry-run: {description: "Perform all checks without uploading", show: always}
  install:
    description: Install a Rust binary
    flags:
      --version: {value: any, description: "Specify a version to install"}
      --git: {value: any, description: "Git URL to install the specified crate from", show: always}
      --branch: {value: any, description: "Branch to use when installing from git"}
      --tag: {value: any, description: "Tag to use when installing from git"}
      --rev: {value: any, description: "Specific commit to use when installing from git"}
      --path: {value: dir, description: "Filesystem path to local crate to install", show: always}
      --bin: {value: any, description: "Install only the specified binary"}
      --root: {value: dir, description: "Directory to install packages into"}
      --features: {value: any, description: "Space or comma separated list of features to activate"}
      --all-features: {description: "Activate all available features"}
      --no-default-features: {description: "Do not activate the default features"}
      --force: {aliases: [-f], description: "Force overwriting existing crates or binaries"}
      --no-track: {description: "Don't keep track of this package"}
      --jobs: {aliases: [-j], value: any, description: "Number of parallel jobs"}
      --verbose: {aliases: [-v], description: "Use verbose output"}
    args:
      exec: "cargo install --list 2>/dev/null | grep -v '^\\s' | awk '{print $1}'"
  uninstall:
    description: Remove a Rust binary
    flags:
      --root: {value: dir, description: "Directory to uninstall packages from"}
      --bin: {value: any, description: "Only uninstall the binary name"}
      --verbose: {aliases: [-v], description: "Use verbose output"}
    args:
      exec: "cargo install --list 2>/dev/null | grep -v '^\\s' | awk '{print $1}'"
  fetch:
    description: Fetch dependencies of a package from the network
    flags:
      --target: {value: any, description: "Fetch dependencies for the target triple", show: always}
      --manifest-path: {value: file, description: "Path to Cargo.toml"}
      --verbose: {aliases: [-v], description: "Use verbose output"}
  generate-lockfile:
    description: Generate the lockfile for a package
    flags:
      --manifest-path: {value: file, description: "Path to Cargo.toml"}
  locate-project:
    description: Print a JSON representation of a Cargo.toml file's location
    flags:
      --message-format: {value: any, description: "Output representation (json, plain)", show: always}
      --manifest-path: {value: file, description: "Path to Cargo.toml", show: always}
      --workspace: {description: "Locate Cargo.toml of the workspace root", show: always}
  metadata:
    description: Output the resolved dependencies of a package in machine-readable format
    flags:
      --format-version: {value: any, description: "Format version", show: always}
      --no-deps: {description: "Output information only about the workspace members", show: always}
      --filter-platform: {value: any, description: "Only include resolve dependencies matching the given target-triple", show: always}
      --features: {value: any, description: "Space or comma separated list of features to activate"}
      --all-features: {description: "Activate all available features"}
      --no-default-features: {description: "Do not activate the default features"}
      --manifest-path: {value: file, description: "Path to Cargo.toml"}
  pkgid:
    description: Print a fully qualified package specification
    flags:
      --package: {aliases: [-p], value: any, description: "Argument to get the package id specifier for"}
      --manifest-path: {value: file, description: "Path to Cargo.toml"}
  tree:
    description: Display a tree visualization of a dependency graph
    flags:
      --package: {aliases: [-p], value: any, description: "Package to use as the root"}
      --features: {value: any, description: "Space or comma separated list of features to activate"}
      --all-features: {description: "Activate all available features"}
      --no-default-features: {description: "Do not activate the default features"}
      --invert: {aliases: [-i], value: any, description: "Invert the tree direction and focus on the given package"}
      --duplicates: {aliases: [-d], description: "Show only dependencies which come in multiple versions"}
      --charset: {value: any, description: "Character set to use in output: utf8, ascii"}
      --format: {aliases: [-f], value: any, description: "Format string used for printing dependencies"}
      --edges: {aliases: [-e], value: any, description: "Types of dependencies to display", show: always}
      --manifest-path: {value: file, description: "Path to Cargo.toml"}
  vendor:
    description: Vendor all dependencies locally
    flags:
      --sync: {aliases: [-s], value: file, description: "Additional Cargo.toml to vendor"}
      --no-delete: {description: "Don't delete older crates in the vendor directory"}
      --respect-source-config: {description: "Respect [source] configuration in .cargo/config.toml"}
      --versioned-dirs: {description: "Vendor into a directory with version information"}
      --manifest-path: {value: file, description: "Path to Cargo.toml"}
      --verbose: {aliases: [-v], description: "Use verbose output"}
  verify-project:
    description: Check correctness of crate manifest
    flags:
      --manifest-path: {value: file, description: "Path to Cargo.toml", show: always}
  version:
    description: Show version information
    flags:
      --verbose: {aliases: [-v], description: "Use verbose output", show: always}
  yank:
    description: Remove a pushed crate from the index
    flags:
      --vers: {value: any, description: "The version to yank or un-yank"}
      --undo: {description: "Undo a yank, putting a version back into the index", show: always}
      --index: {value: any, description: "Registry index to yank from"}
      --token: {value: any, description: "API token to use when authenticating"}
      --registry: {value: any, description: "Registry to use", show: always}
  login:
    description: Save an API token from the registry locally
    flags:
      --registry: {value: any, description: "Registry to use", show: always}
  logout:
    description: Remove an API token from the registry locally
    flags:
      --registry: {value: any, description: "Registry to use", show: always}
  owner:
    description: Manage the owners of a crate on the registry
    flags:
      --add: {aliases: [-a], value: any, description: "Name of a user or team to invite as an owner", show: always}
      --remove: {aliases: [-r], value: any, description: "Name of a user or team to remove as an owner", show: always}
      --list: {aliases: [-l], description: "List owners of a crate", show: always}
      --index: {value: any, description: "Registry index to modify owners for"}
      --token: {value: any, description: "API token to use when authenticating"}
      --registry: {value: any, description: "Registry to use", show: always}
  package:
    description: Assemble the local package into a distributable tarball
    flags:
      --no-verify: {description: "Don't verify the contents by building them"}
      --allow-dirty: {description: "Allow dirty working directories to be packaged"}
      --list: {aliases: [-l], description: "Print files included in a package without making one", show: always}
      --manifest-path: {value: file, description: "Path to Cargo.toml"}
  report:
    description: Generate and display various kinds of reports
    commands:
      future-incompat:
        description: Reports any crates which will eventually stop compiling
        flags:
          --package: {aliases: [-p], value: any, description: "Package to display a report for"}
          --id: {value: any, description: "Show the report with the specified Cargo-generated id"}
  fix:
    description: Automatically fix lint warnings reported by rustc
    flags:
      --package: {aliases: [-p], value: any, description: "Package(s) to fix"}
      --lib: {description: "Fix only this package's library", show: always}
      --bin: {value: any, description: "Fix only the specified binary"}
      --example: {value: any, description: "Fix only the specified example"}
      --test: {value: any, description: "Fix only the specified test target", show: always}
      --bench: {value: any, description: "Fix only the specified bench target"}
      --release: {description: "Fix artifacts in release mode"}
      --features: {value: any, description: "Space or comma separated list of features to activate"}
      --all-features: {description: "Activate all available features"}
      --no-default-features: {description: "Do not activate the default features"}
      --target: {value: any, description: "Fix for the target triple"}
      --edition: {description: "Fix in preparation for the next edition", show: always}
      --edition-idioms: {description: "Fix warnings to migrate to the idioms of an edition"}
      --allow-no-vcs: {description: "Fix code even if a VCS was not detected"}
      --allow-dirty: {description: "Fix code even if the working directory is dirty", show: always}
      --allow-staged: {description: "Fix code even if the working directory has staged changes"}
      --manifest-path: {value: file, description: "Path to Cargo.toml"}
  fmt:
    description: Formats all bin and lib files of the current crate using rustfmt
    aliases: [format]
    flags:
      --package: {aliases: [-p], value: any, description: "Specify package to format"}
      --manifest-path: {value: file, description: "Path to Cargo.toml"}
      --message-format: {value: any, description: "Specify message-format: short|json|human"}
      --all: {description: "Format all packages and also their local path-based dependencies"}
      --check: {description: "Run rustfmt in check mode", show: always}
  clippy:
    description: Checks a package to catch common mistakes and improve your Rust code
    flags:
      --package: {aliases: [-p], value: any, description: "Package(s) to check", show: always}
      --lib: {description: "Check only this package's library"}
      --bin: {value: any, description: "Check only the specified binary"}
      --example: {value: any, description: "Check only the specified example"}
      --test: {value: any, description: "Check only the specified test target"}
      --bench: {value: any, description: "Check only the specified bench target"}
      --release: {description: "Check artifacts in release mode"}
      --features: {value: any, description: "Space or comma separated list of features to activate"}
      --all-features: {description: "Activate all available features"}
      --no-default-features: {description: "Do not activate the default features"}
      --target: {value: any, description: "Check for the target triple"}
      --fix: {description: "Automatically apply lint suggestions", show: always}
      --allow-dirty: {description: "Allow fix to apply even if the working directory is dirty"}
      --allow-staged: {description: "Allow fix to apply even if the working directory has staged changes"}
      --no-deps: {description: "Run Clippy only on the given crate, without linting the dependencies"}
      --manifest-path: {value: file, description: "Path to Cargo.toml"}
  clean:
    description: Remove generated artifacts
    flags:
      --package: {aliases: [-p], value: any, description: "Package to clean artifacts for"}
      --release: {description: "Whether or not to clean release artifacts", show: always}

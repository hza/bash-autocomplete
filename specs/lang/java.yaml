version: '20261015'
description: "Launch a Java application"
flags:
  --class-path: {aliases: [-cp, -classpath], value: file, description: class path (dirs and jars separated by colons), show: always}
  -jar: {value: file, description: run the main class of a jar file, show: always}
  --module: {aliases: [-m], value: {exec: "java --list-modules | sed 's/@.*//'"}, description: run the main class of a module}
  --module-path: {aliases: [-p], value: file, description: module path}
  --upgrade-module-path: {value: file, description: module path that replaces upgradeable modules}
  --add-modules: {value: {exec: "java --list-modules | sed 's/@.*//'; printf '%s\n' ALL-DEFAULT ALL-SYSTEM ALL-MODULE-PATH"}, description: extra root modules to resolve}
  --enable-native-access: {value: any, description: modules allowed to do restricted native operations}
  --list-modules: {description: list observable modules and exit}
  --describe-module: {aliases: [-d], value: {exec: "java --list-modules | sed 's/@.*//'"}, description: describe a module and exit}
  --dry-run: {description: load the main class without running main}
  --validate-modules: {description: validate all modules and exit}
  -version: {description: print the version to stderr and exit, show: always}
  --version: {description: print the version to stdout and exit}
  -showversion: {description: print the version to stderr and continue}
  --show-version: {description: print the version to stdout and continue}
  --show-module-resolution: {description: show module resolution during startup}
  -verbose:class: {description: log class loading}
  -verbose:module: {description: log module resolution}
  -verbose:gc: {description: log garbage collection}
  -verbose:jni: {description: log JNI calls}
  -ea: {description: enable assertions}
  -da: {description: disable assertions}
  -esa: {description: enable system assertions}
  -dsa: {description: disable system assertions}
  -agentlib:jdwp=: {description: load the debugger agent with these options}
  --enable-preview: {description: allow preview language features}
  --source: {value: {enum: ['25', '21', '17', '11', '8']}, description: Java version of a source-file program}
  -XX:+UseG1GC: {description: use the G1 garbage collector}
  -XX:+UseZGC: {description: use the Z garbage collector}
  -XX:+HeapDumpOnOutOfMemoryError: {description: dump the heap on OutOfMemoryError}
  --help: {description: print help}
  --help-extra: {aliases: [-X], description: print help on extra options}
args: {exec: "sh \"$AUTOCOMPLETE_SPEC_DIR/java.sh\""}

    description: Set access level on published packages
    flags:
      --otp:
        value: any
        description: This is a one-time password from a two-factor authenticator
    commands:
      list: {}
      get: {}
      set: {}
      grant: {}
      revoke: {}
    args: any
  adduser:
    description: Add a registry user account

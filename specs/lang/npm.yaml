version: '20261015'
description: Node.js package manager
flags:
  --workspace:
    aliases: [-w]
    show: always
    value:
      exec: node -e 'let d=process.cwd(),p=require("path");try{for(const w of require(p.join(d,"package.json")).workspaces||[])console.log(w)}catch(e){}'
    description: Run in workspace

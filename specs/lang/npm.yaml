    description: Registry URL
  --loglevel:
    show: always
    value:
      exec: printf 'silent\nerror\nwarn\nnotice\nhttp\ninfo\nverbose\nsilly\n'
    description: Log level
  --silent:
    description: No output
  --verbose:
    show: always
    description: Verbose output
  --json:
    show: always
    description: Output JSON
  --help:
    aliases: [-h]
    show: always
    description: Show help
  --version:
    aliases: [-v]
    description: Show npm version
commands:

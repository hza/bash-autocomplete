flags:
  --config: {value: dir, description: "Location of client config files"}
  -c: {value: any, description: "Name of the context to use to connect to the daemon (overrides DOCKER_HOST env var and default context set with \"docker context use\")", show: always}
  --context: {value: any, description: "Name of the context to use to connect to the daemon (overrides DOCKER_HOST env var and default context set with \"docker context use\")"}
  -D: {description: "Enable debug mode"}
  --debug: {description: "Enable debug mode"}
  -H: {value: any, description: "Daemon socket to connect to"}
  --host: {value: any, description: "Daemon socket to connect to"}
  -l: {value: any, description: "Set the logging level (\"debug\", \"info\", \"warn\", \"error\", \"fatal\")", show: always}
  --log-level: {value: any, description: "Set the logging level (\"debug\", \"info\", \"warn\", \"error\", \"fatal\")"}
  --help: {description: "Print usage", show: always}
  -v: {description: "Print version information and quit", show: always}
  --version: {description: "Print version information and quit"}
commands:
  run:
    description: Create and run a new container from an image
    flags:
      -d: {description: "Run container in background and print container ID"}
      --detach: {description: "Run container in background and print container ID"}
      -i: {description: "Keep STDIN open even if not attached"}
      --interactive: {description: "Keep STDIN open even if not attached"}
      -t: {description: "Allocate a pseudo-TTY"}
      --tty: {description: "Allocate a pseudo-TTY"}
      --rm: {description: "Automatically remove the container and its associated anonymous volumes when it exits"}
      --name: {value: any, description: "Assign a name to the container"}
      -e: {value: any, description: "Set environment variables"}
      --env: {value: any, description: "Set environment variables"}
      --env-file: {value: file, description: "Read in a file of environment variables"}
      -p: {value: any, description: "Publish a container's port(s) to the host"}
      --publish: {value: any, description: "Publish a container's port(s) to the host"}
      -P: {description: "Publish all exposed ports to random ports"}
      -v: {value: any, description: "Bind mount a volume"}
      --volume: {value: any, description: "Bind mount a volume"}
      --mount: {value: any, description: "Attach a filesystem mount to the container"}
      -w: {value: any, description: "Working directory inside the container"}
      --workdir: {value: any, description: "Working directory inside the container"}
      --network: {value: {exec: "docker network ls --format '{{.Name}}'"}, description: "Connect a container to a network"}
      --entrypoint: {value: any, description: "Overwrite the default ENTRYPOINT of the image"}
      -u: {value: any, description: "Username or UID (format: <name|uid>[:<group|gid>])"}
      --user: {value: any, description: "Username or UID (format: <name|uid>[:<group|gid>])"}
      --restart: {value: any, description: "Restart policy to apply when a container exits"}
      --platform: {value: any, description: "Set platform if server is multi-platform capable"}
      --pull: {value: any, description: "Pull image before running (\"always\", \"missing\", \"never\")"}
      -h: {value: any, description: "Container host name"}
      --hostname: {value: any, description: "Container host name"}
      -m: {value: any, description: "Memory limit"}
      --memory: {value: any, description: "Memory limit"}
      --cpus: {value: any, description: "Number of CPUs"}
      --privileged: {description: "Give extended privileges to this container"}
      -l: {value: any, description: "Set meta data on a container"}
      --label: {value: any, description: "Set meta data on a container"}
      --volumes-from: {value: {exec: "docker ps -a --format '{{.Names}}'"}, description: "Mount volumes from the specified container(s)"}
    args:
      exec: docker images --format '{{.Repository}}:{{.Tag}}'
  exec:
    description: Execute a command in a running container
    flags:
      -d: {description: "Detached mode: run command in the background"}
      --detach: {description: "Detached mode: run command in the background"}
      -i: {description: "Keep STDIN open even if not attached"}
      --interactive: {description: "Keep STDIN open even if not attached"}
      -t: {description: "Allocate a pseudo-TTY"}
      --tty: {description: "Allocate a pseudo-TTY"}
      -e: {value: any, description: "Set environment variables"}
      --env: {value: any, description: "Set environment variables"}
      -u: {value: any, description: "Username or UID (format: \"<name|uid>[:<group|gid>]\")"}
      --user: {value: any, description: "Username or UID (format: \"<name|uid>[:<group|gid>]\")"}
      -w: {value: any, description: "Working directory inside the container"}
      --workdir: {value: any, description: "Working directory inside the container"}
      --privileged: {description: "Give extended privileges to the command"}
    args:
      exec: docker ps --format '{{.Names}}'
  ps:
    description: List containers
    flags:
      -a: {description: "Show all containers"}
      --all: {description: "Show all containers"}
      -q: {description: "Only display container IDs"}
      --quiet: {description: "Only display container IDs"}
      -f: {value: any, description: "Filter output based on conditions provided"}
      --filter: {value: any, description: "Filter output based on conditions provided"}
      --format: {value: any, description: "Format output using a custom template: 'table': Print output in table format with column headers 'table TEMPLATE': Print output in table format using the given Go template 'json': Print in JSON format 'TEMPLATE': Print output using the given Go template. Refer to https://docs.docker.com/go/formatting/ for more information about formatting output with templates"}
      -n: {value: any, description: "Show n last created containers (includes all states)"}
      --last: {value: any, description: "Show n last created containers (includes all states)"}
      -l: {description: "Show the latest created container (includes all states)"}
      --latest: {description: "Show the latest created container (includes all states)"}
      -s: {description: "Display total file sizes"}
      --size: {description: "Display total file sizes"}
      --no-trunc: {description: "Don't truncate output"}
  images:
    description: List images
    flags:
      -a: {description: "Show all images"}
      --all: {description: "Show all images"}
      -q: {description: "Only show image IDs"}
      --quiet: {description: "Only show image IDs"}
      -f: {value: any, description: "Filter output based on conditions provided"}
      --filter: {value: any, description: "Filter output based on conditions provided"}
      --format: {value: any, description: "Format output using a custom template: 'table': Print output in table format with column headers 'table TEMPLATE': Print output in table format using the given Go template 'json': Print in JSON format 'TEMPLATE': Print output using the given Go template. Refer to https://docs.docker.com/go/formatting/ for more information about formatting output with templates"}
      --digests: {description: "Show digests"}
      --no-trunc: {description: "Don't truncate output"}
  pull:
    description: Download an image from a registry
    flags:
      -a: {description: "Download all tagged images in the repository"}
      --all-tags: {description: "Download all tagged images in the repository"}
      --platform: {value: any, description: "Set platform if server is multi-platform capable"}
      -q: {description: "Suppress verbose output"}
      --quiet: {description: "Suppress verbose output"}
    args:
      exec: docker images --format '{{.Repository}}:{{.Tag}}'
  push:
    description: Upload an image to a registry
    args:
      exec: docker images --format '{{.Repository}}:{{.Tag}}'
  build:
    description: Build an image from a Dockerfile
    flags:
      -t: {value: any, description: "Image identifier (format: \"[registry/]repository[:tag]\")", show: always}
      --tag: {value: any, description: "Image identifier (format: \"[registry/]repository[:tag]\")", show: always}
      -f: {value: file, description: "Name of the Dockerfile", show: always}
      --file: {value: file, description: "Name of the Dockerfile", show: always}
      --build-arg: {value: any, description: "Set build-time variables", show: always}
      --target: {value: any, description: "Set the target build stage to build", show: always}
      --no-cache: {description: "Do not use cache when building the image", show: always}
      --pull: {description: "Always attempt to pull all referenced images"}
      --platform: {value: any, description: "Set target platform for build", show: always}
      -q: {description: "Suppress the build output and print image ID on success"}
      --quiet: {description: "Suppress the build output and print image ID on success"}
      --progress: {value: any, description: "Set type of progress output (\"auto\", \"none\", \"plain\", \"quiet\", \"rawjson\", \"tty\"). Use plain to show container output"}
      --network: {value: {exec: "docker network ls --format '{{.Name}}'"}, description: "Set the networking mode for the \"RUN\" instructions during build"}
      --secret: {value: any, description: "Secret to expose to the build (format: \"id=mysecret[,src=/local/secret]\")"}
    args: dir
  start:
    description: Start one or more stopped containers
    flags:
      -a: {description: "Attach STDOUT/STDERR and forward signals"}
      --attach: {description: "Attach STDOUT/STDERR and forward signals"}
      -i: {description: "Attach container's STDIN"}
      --interactive: {description: "Attach container's STDIN"}
    args:
      exec: docker ps -a --format '{{.Names}}'
  stop:
    description: Stop one or more running containers
    flags:
      -t: {value: any, description: "Seconds to wait before killing the container"}
      --timeout: {value: any, description: "Seconds to wait before killing the container"}
      -s: {value: any, description: "Signal to send to the container"}
      --signal: {value: any, description: "Signal to send to the container"}
    args:
      exec: docker ps --format '{{.Names}}'
  restart:
    description: Restart one or more containers
    flags:
      -t: {value: any, description: "Seconds to wait before killing the container"}
      --timeout: {value: any, description: "Seconds to wait before killing the container"}
      -s: {value: any, description: "Signal to send to the container"}
      --signal: {value: any, description: "Signal to send to the container"}
    args:
      exec: docker ps -a --format '{{.Names}}'
  rm:
    description: Remove one or more containers
    flags:
      -f: {description: "Force the removal of a running container (uses SIGKILL)", show: always}
      --force: {description: "Force the removal of a running container (uses SIGKILL)", show: always}
      -v: {description: "Remove anonymous volumes associated with the container"}
      --volumes: {description: "Remove anonymous volumes associated with the container"}
      -l: {description: "Remove the specified link"}
      --link: {description: "Remove the specified link"}
    args:
      exec: docker ps -a --format '{{.Names}}'
  rmi:
    description: Remove one or more images
    flags:
      -f: {description: "Force removal of the image"}
      --force: {description: "Force removal of the image"}
      --no-prune: {description: "Do not delete untagged parents"}
    args:
      exec: docker images --format '{{.Repository}}:{{.Tag}}'
  logs:
    description: Fetch the logs of a container
    flags:
      -f: {description: "Follow log output"}
      --follow: {description: "Follow log output"}
      -n: {value: any, description: "Number of lines to show from the end of the logs"}
      --tail: {value: any, description: "Number of lines to show from the end of the logs"}
      -t: {description: "Show timestamps"}
      --timestamps: {description: "Show timestamps"}
      --since: {value: any, description: "Show logs since timestamp (e.g. \"2013-01-02T13:23:37Z\") or relative (e.g. \"42m\" for 42 minutes)"}
      --until: {value: any, description: "Show logs before a timestamp (e.g. \"2013-01-02T13:23:37Z\") or relative (e.g. \"42m\" for 42 minutes)"}
      --details: {description: "Show extra details provided to logs"}
    args:
      exec: docker ps -a --format '{{.Names}}'
  inspect:
    description: Return low-level information on Docker objects
    flags:
      -f: {value: any, description: "Format output using a custom template: 'json': Print in JSON format 'TEMPLATE': Print output using the given Go template. Refer to https://docs.docker.com/go/formatting/ for more information about formatting output with templates", show: always}
      --format: {value: any, description: "Format output using a custom template: 'json': Print in JSON format 'TEMPLATE': Print output using the given Go template. Refer to https://docs.docker.com/go/formatting/ for more information about formatting output with templates", show: always}
      -s: {description: "Display total file sizes if the type is container"}
      --size: {description: "Display total file sizes if the type is container"}
      --type: {value: any, description: "Only inspect objects of the given type"}
    args:
      exec: docker ps -a --format '{{.Names}}'
  kill:
    description: Kill one or more running containers
    flags:
      -s: {value: any, description: "Signal to send to the container"}
      --signal: {value: any, description: "Signal to send to the container"}
    args:
      exec: docker ps --format '{{.Names}}'
  cp:
    description: Copy files/folders between a container and the local filesystem
    flags:
      -a: {description: "Archive mode (copy all uid/gid information)"}
      --archive: {description: "Archive mode (copy all uid/gid information)"}
      -L: {description: "Always follow symlinks in SRC_PATH"}
      --follow-link: {description: "Always follow symlinks in SRC_PATH"}
      -q: {description: "Suppress progress output during copy. Progress output is automatically suppressed if no terminal is attached"}
      --quiet: {description: "Suppress progress output during copy. Progress output is automatically suppressed if no terminal is attached"}
    args:
      - exec: docker ps -a --format '{{.Names}}'
        suffix: ":"
        nospace: true
      - file
  tag:
    description: Create a tag TARGET_IMAGE that refers to SOURCE_IMAGE
    args:
      exec: docker images --format '{{.Repository}}:{{.Tag}}'
  top:
    description: Display the running processes of a container
    args:
      exec: docker ps --format '{{.Names}}'
  stats:
    description: Display a live stream of container(s) resource usage statistics
    flags:
      -a: {description: "Show all containers"}
      --all: {description: "Show all containers"}
      --no-stream: {description: "Disable streaming stats and only pull the first result"}
      --no-trunc: {description: "Do not truncate output"}
      --format: {value: any, description: "Format output using a custom template: 'table': Print output in table format with column headers 'table TEMPLATE': Print output in table format using the given Go template 'json': Print in JSON format 'TEMPLATE': Print output using the given Go template. Refer to https://docs.docker.com/go/formatting/ for more information about formatting output with templates"}
    args:
      exec: docker ps --format '{{.Names}}'
  attach:
    description: Attach local standard input, output, and error streams to a running container
    args:
      exec: docker ps --format '{{.Names}}'
  port:
    description: List port mappings or a specific mapping for the container
    args:
      exec: docker ps --format '{{.Names}}'
  rename:
    description: Rename a container
    args:
      exec: docker ps -a --format '{{.Names}}'
  pause:
    description: Pause all processes within one or more containers
    args:
      exec: docker ps --format '{{.Names}}'
  unpause:
    description: Unpause all processes within one or more containers
    args:
      exec: docker ps -a --format '{{.Names}}'
  commit:
    description: Create a new image from a container's changes
    flags:
      -a: {value: any, description: "Author (e.g., \"John Hannibal Smith <hannibal@a-team.com>\")"}
      --author: {value: any, description: "Author (e.g., \"John Hannibal Smith <hannibal@a-team.com>\")"}
      -m: {value: any, description: "Commit message"}
      --message: {value: any, description: "Commit message"}
      -c: {value: any, description: "Apply Dockerfile instruction to the created image"}
      --change: {value: any, description: "Apply Dockerfile instruction to the created image"}
      --no-pause: {description: "Disable pausing container during commit"}
    args:
      exec: docker ps -a --format '{{.Names}}'
  save:
    description: Save one or more images to a tar archive (streamed to STDOUT by default)
    flags:
      -o: {value: file, description: "Write to a file, instead of STDOUT"}
      --output: {value: file, description: "Write to a file, instead of STDOUT"}
    args:
      exec: docker images --format '{{.Repository}}:{{.Tag}}'
  load:
    description: Load an image from a tar archive or STDIN
    flags:
      -i: {value: file, description: "Read from tar archive file, instead of STDIN"}
      --input: {value: file, description: "Read from tar archive file, instead of STDIN"}
      -q: {description: "Suppress the load output"}
      --quiet: {description: "Suppress the load output"}
  login:
    description: Authenticate to a registry
    flags:
      -u: {value: any, description: Username, show: always}
      --username: {value: any, description: Username, show: always}
      -p: {value: any, description: "Password or Personal Access Token (PAT), or \"-\" to read from stdin", show: always}
      --password: {value: any, description: "Password or Personal Access Token (PAT), or \"-\" to read from stdin", show: always}
      --password-stdin: {description: "Take the Password or Personal Access Token (PAT) from stdin"}
    args: any
  logout:
    description: Log out from a registry
    args: any
  version:
    description: Show the Docker version information
  info:
    description: Display system-wide information
  help:
    description: Help about any command
    args: "@subcommands"
  network:
    description: Manage networks
    commands:
      ls:
        description: List networks
        flags:
          -q: {description: "Only display network IDs"}
          --quiet: {description: "Only display network IDs"}
          -f: {value: any, description: "Provide filter values (e.g. \"driver=bridge\")"}
          --filter: {value: any, description: "Provide filter values (e.g. \"driver=bridge\")"}
          --format: {value: any, description: "Format output using a custom template: 'table': Print output in table format with column headers 'table TEMPLATE': Print output in table format using the given Go template 'json': Print in JSON format 'TEMPLATE': Print output using the given Go template. Refer to https://docs.docker.com/go/formatting/ for more information about formatting output with templates"}
      create:
        description: Create a network
        flags:
          -d: {value: any, description: "Driver to manage the Network", show: always}
          --driver: {value: any, description: "Driver to manage the Network", show: always}
          --subnet: {value: any, description: "Subnet in CIDR format that represents a network segment"}
          --gateway: {value: any, description: "IPv4 or IPv6 Gateway for the master subnet"}
          --internal: {description: "Restrict external access to the network"}
          --attachable: {description: "Enable manual container attachment"}
        args: any
      rm:
        description: Remove one or more networks
        args:
          exec: docker network ls --format '{{.Name}}'
      inspect:
        description: Display detailed information on one or more networks
        flags:
          -f: {value: any, description: "Format output using a custom template: 'json': Print in JSON format 'TEMPLATE': Print output using the given Go template. Refer to https://docs.docker.com/go/formatting/ for more information about formatting output with templates"}
          --format: {value: any, description: "Format output using a custom template: 'json': Print in JSON format 'TEMPLATE': Print output using the given Go template. Refer to https://docs.docker.com/go/formatting/ for more information about formatting output with templates"}
        args:
          exec: docker network ls --format '{{.Name}}'
      connect:
        description: Connect a container to a network
        args:
          exec: docker network ls --format '{{.Name}}'
      disconnect:
        description: Disconnect a container from a network
        args:
          exec: docker network ls --format '{{.Name}}'
      prune:
        description: Remove all unused networks
        flags:
          -f: {description: "Do not prompt for confirmation"}
          --force: {description: "Do not prompt for confirmation"}
          --filter: {value: any, description: "Provide filter values (e.g. \"until=<timestamp>\")"}
  volume:
    description: Manage volumes
    commands:
      ls:
        description: List volumes
        flags:
          -q: {description: "Only display volume names"}
          --quiet: {description: "Only display volume names"}
          -f: {value: any, description: "Provide filter values (e.g. \"dangling=true\")"}
          --filter: {value: any, description: "Provide filter values (e.g. \"dangling=true\")"}
          --format: {value: any, description: "Format output using a custom template: 'table': Print output in table format with column headers 'table TEMPLATE': Print output in table format using the given Go template 'json': Print in JSON format 'TEMPLATE': Print output using the given Go template. Refer to https://docs.docker.com/go/formatting/ for more information about formatting output with templates"}
      create:
        description: Create a volume
        flags:
          -d: {value: any, description: "Specify volume driver name"}
          --driver: {value: any, description: "Specify volume driver name"}
          --label: {value: any, description: "Set metadata for a volume", show: always}
          -o: {value: any, description: "Set driver specific options", show: always}
          --opt: {value: any, description: "Set driver specific options", show: always}
        args: any
      rm:
        description: Remove one or more volumes
        flags:
          -f: {description: "Force the removal of one or more volumes"}
          --force: {description: "Force the removal of one or more volumes"}
        args:
          exec: docker volume ls --format '{{.Name}}'
      inspect:
        description: Display detailed information on one or more volumes
        flags:
          -f: {value: any, description: "Format output using a custom template: 'json': Print in JSON format 'TEMPLATE': Print output using the given Go template. Refer to https://docs.docker.com/go/formatting/ for more information about formatting output with templates"}
          --format: {value: any, description: "Format output using a custom template: 'json': Print in JSON format 'TEMPLATE': Print output using the given Go template. Refer to https://docs.docker.com/go/formatting/ for more information about formatting output with templates"}
        args:
          exec: docker volume ls --format '{{.Name}}'
      prune:
        description: Remove unused local volumes
        flags:
          -f: {description: "Do not prompt for confirmation"}
          --force: {description: "Do not prompt for confirmation"}
          --filter: {value: any, description: "Provide filter values (e.g. \"label=<label>\")"}
  system:
    description: Manage Docker
    commands:
      df:
        description: Show docker disk usage
      info:
        description: Display system-wide information
      prune:
        description: Remove unused data
        flags:
          -a: {description: "Remove all unused images not just dangling ones", show: always}
          --all: {description: "Remove all unused images not just dangling ones", show: always}
          -f: {description: "Do not prompt for confirmation"}
          --force: {description: "Do not prompt for confirmation"}
          --volumes: {description: "Prune anonymous volumes", show: always}
          --filter: {value: any, description: "Provide filter values (e.g. \"label=<key>=<value>\")", show: always}
      events:
        description: Get real time events from the server
  compose:
    description: Define and run multi-container applications
    flags:
      -f: {value: file, description: "Compose configuration files", show: always}
      --file: {value: file, description: "Compose configuration files", show: always}
      -p: {value: any, description: "Project name", show: always}
      --project-name: {value: any, description: "Project name", show: always}
      --profile: {value: any, description: "Specify a profile to enable"}
      --env-file: {value: file, description: "Specify an alternate environment file"}
    commands:
      up:
        description: Create and start containers
        flags:
          -d: {description: "Detached mode: Run containers in the background", show: always}
          --detach: {description: "Detached mode: Run containers in the background", show: always}
          --build: {description: "Build images before starting containers", show: always}
          --force-recreate: {description: "Recreate containers even if their configuration and image haven't changed"}
          --no-deps: {description: "Don't start linked services"}
          --remove-orphans: {description: "Remove containers for services not defined in the Compose file", show: always}
          --wait: {description: "Wait for services to be running|healthy. Implies detached mode"}
        args: any
      down:
        description: Stop and remove containers, networks
        flags:
          -v: {description: "Remove named volumes declared in the \"volumes\" section of the Compose file and anonymous volumes attached to containers", show: always}
          --volumes: {description: "Remove named volumes declared in the \"volumes\" section of the Compose file and anonymous volumes attached to containers", show: always}
          --remove-orphans: {description: "Remove containers for services not defined in the Compose file", show: always}
          --rmi: {value: any, description: "Remove images used by services. \"local\" remove only images that don't have a custom tag (\"local\"|\"all\")", show: always}
      ps:
        description: List containers
        flags:
          -a: {description: "Show all stopped containers (including those created by the run command)"}
          --all: {description: "Show all stopped containers (including those created by the run command)"}
          -q: {description: "Only display IDs"}
          --quiet: {description: "Only display IDs"}
          --filter: {value: any, description: "Filter services by a property (supported filters: status)"}
          --format: {value: any, description: "Format output using a custom template: 'table': Print output in table format with column headers 'table TEMPLATE': Print output in table format using the given Go template 'json': Print in JSON format 'TEMPLATE': Print output using the given Go template. Refer to https://docs.docker.com/go/formatting/ for more information about formatting output with templates"}
          --no-trunc: {description: "Don't truncate output"}
        args: any
      logs:
        description: View output from containers
        flags:
          -f: {description: "Follow log output", show: always}
          --follow: {description: "Follow log output", show: always}
          -n: {value: any, description: "Number of lines to show from the end of the logs for each container", show: always}
          --tail: {value: any, description: "Number of lines to show from the end of the logs for each container", show: always}
          -t: {description: "Show timestamps", show: always}
          --timestamps: {description: "Show timestamps", show: always}
          --since: {value: any, description: "Show logs since timestamp (e.g. 2013-01-02T13:23:37Z) or relative (e.g. 42m for 42 minutes)", show: always}
          --until: {value: any, description: "Show logs before a timestamp (e.g. 2013-01-02T13:23:37Z) or relative (e.g. 42m for 42 minutes)", show: always}
        args: any
      build:
        description: Build or rebuild services
        flags:
          --build-arg: {value: any, description: "Set build-time variables for services"}
          --no-cache: {description: "Do not use cache when building the image"}
          --pull: {description: "Always attempt to pull a newer version of the image"}
          -q: {description: "Suppress the build output"}
          --quiet: {description: "Suppress the build output"}
        args: any
      pull:
        description: Pull service images
        args: any
      restart:
        description: Restart service containers

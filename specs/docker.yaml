flags:
  --config: dir
  -c: any
  --context: any
  -D:
  --debug:
  -H: any
  --host: any
  -l: any
  --log-level: any
  --help:
  -v:
  --version:
commands:
  run:
    description: Create and run a new container from an image
    flags:
      -d:
      --detach:
      -i:
      --interactive:
      -t:
      --tty:
      --rm:
      --name: any
      -e: any
      --env: any
      --env-file: file
      -p: any
      --publish: any
      -P:
      -v: any
      --volume: any
      --mount: any
      -w: any
      --workdir: any
      --network:
        exec: docker network ls --format '{{.Name}}'
      --entrypoint: any
      -u: any
      --user: any
      --restart: any
      --platform: any
      --pull: any
      -h: any
      --hostname: any
      -m: any
      --memory: any
      --cpus: any
      --privileged:
      -l: any
      --label: any
      --volumes-from:
        exec: docker ps -a --format '{{.Names}}'
    args:
      exec: docker images --format '{{.Repository}}:{{.Tag}}'
  exec:
    description: Execute a command in a running container
    flags:
      -d:
      --detach:
      -i:
      --interactive:
      -t:
      --tty:
      -e: any
      --env: any
      -u: any
      --user: any
      -w: any
      --workdir: any
      --privileged:
    args:
      exec: docker ps --format '{{.Names}}'
  ps:
    description: List containers
    flags:
      -a:
      --all:
      -q:
      --quiet:
      -f: any
      --filter: any
      --format: any
      -n: any
      --last: any
      -l:
      --latest:
      -s:
      --size:
      --no-trunc:
  images:
    description: List images
    flags:
      -a:
      --all:
      -q:
      --quiet:
      -f: any
      --filter: any
      --format: any
      --digests:
      --no-trunc:
  pull:
    description: Download an image from a registry
    flags:
      -a:
      --all-tags:
      --platform: any
      -q:
      --quiet:
    args:
      exec: docker images --format '{{.Repository}}:{{.Tag}}'
  push:
    description: Upload an image to a registry
    args:
      exec: docker images --format '{{.Repository}}:{{.Tag}}'
  build:
    description: Build an image from a Dockerfile
    flags:
      -t: any
      --tag: any
      -f: file
      --file: file
      --build-arg: any
      --target: any
      --no-cache:
      --pull:
      --platform: any
      -q:
      --quiet:
      --progress: any
      --network:
        exec: docker network ls --format '{{.Name}}'
      --secret: any
    args: dir
  start:
    description: Start one or more stopped containers
    flags:
      -a:
      --attach:
      -i:
      --interactive:
    args:
      exec: docker ps -a --format '{{.Names}}'
  stop:
    description: Stop one or more running containers
    flags:
      -t: any
      --time: any
      -s: any
      --signal: any
    args:
      exec: docker ps --format '{{.Names}}'
  restart:
    description: Restart one or more containers
    flags:
      -t: any
      --time: any
      -s: any
      --signal: any
    args:
      exec: docker ps -a --format '{{.Names}}'
  rm:
    description: Remove one or more containers
    flags:
      -f:
      --force:
      -v:
      --volumes:
      -l:
      --link:
    args:
      exec: docker ps -a --format '{{.Names}}'
  rmi:
    description: Remove one or more images
    flags:
      -f:
      --force:
      --no-prune:
    args:
      exec: docker images --format '{{.Repository}}:{{.Tag}}'
  logs:
    description: Fetch the logs of a container
    flags:
      -f:
      --follow:
      -n: any
      --tail: any
      -t:
      --timestamps:
      --since: any
      --until: any
      --details:
    args:
      exec: docker ps -a --format '{{.Names}}'
  inspect:
    description: Return low-level information on Docker objects
    flags:
      -f: any
      --format: any
      -s:
      --size:
      --type: any
    args:
      exec: docker ps -a --format '{{.Names}}'
  kill:
    description: Kill one or more running containers
    flags:
      -s: any
      --signal: any
    args:
      exec: docker ps --format '{{.Names}}'
  cp:
    description: Copy files/folders between a container and the local filesystem
    flags:
      -a:
      --archive:
      -L:
      --follow-link:
      -q:
      --quiet:
    args:
      - exec: docker ps -a --format '{{.Names}}'
        suffix: ":"
        nospace: true
      - file
  tag:
    description: Create a tag TARGET_IMAGE that refers to SOURCE_IMAGE
    args:
      exec: docker images --format '{{.Repository}}:{{.Tag}}'
  top:
    description: Display the running processes of a container
    args:
      exec: docker ps --format '{{.Names}}'
  stats:
    description: Display a live stream of container(s) resource usage statistics
    flags:
      -a:
      --all:
      --no-stream:
      --no-trunc:
      --format: any
    args:
      exec: docker ps --format '{{.Names}}'
  attach:
    description: Attach local standard input, output, and error streams to a running container
    args:
      exec: docker ps --format '{{.Names}}'
  port:
    description: List port mappings or a specific mapping for the container
    args:
      exec: docker ps --format '{{.Names}}'
  rename:
    description: Rename a container
    args:
      exec: docker ps -a --format '{{.Names}}'
  pause:
    description: Pause all processes within one or more containers
    args:
      exec: docker ps --format '{{.Names}}'
  unpause:
    description: Unpause all processes within one or more containers
    args:
      exec: docker ps -a --format '{{.Names}}'
  commit:
    description: Create a new image from a container's changes
    flags:
      -a: any
      --author: any
      -m: any
      --message: any
      -c: any
      --change: any
      -p:
      --pause:
    args:
      exec: docker ps -a --format '{{.Names}}'
  save:
    description: Save one or more images to a tar archive (streamed to STDOUT by default)
    flags:
      -o: file
      --output: file
    args:
      exec: docker images --format '{{.Repository}}:{{.Tag}}'
  load:
    description: Load an image from a tar archive or STDIN
    flags:
      -i: file
      --input: file
      -q:
      --quiet:
  login:
    description: Authenticate to a registry
    flags:
      -u: any
      --username: any
      -p: any
      --password: any
      --password-stdin:
    args: any
  logout:
    description: Log out from a registry
    args: any
  version:
    description: Show the Docker version information
  info:
    description: Display system-wide information
  help:
    description: Help about any command
    args: "@subcommands"
  network:
    description: Manage networks
    commands:
      ls:
        description: List networks
        flags:
          -q:
          --quiet:
          -f: any
          --filter: any
          --format: any
      create:
        description: Create a network
        flags:
          -d: any
          --driver: any
          --subnet: any
          --gateway: any
          --internal:
          --attachable:
        args: any
      rm:
        description: Remove one or more networks
        args:
          exec: docker network ls --format '{{.Name}}'
      inspect:
        description: Display detailed information on one or more networks
        flags:
          -f: any
          --format: any
          -s:
          --size:
          --type: any
        args:
          exec: docker network ls --format '{{.Name}}'
      connect:
        description: Connect a container to a network
        args:
          exec: docker network ls --format '{{.Name}}'
      disconnect:
        description: Disconnect a container from a network
        args:
          exec: docker network ls --format '{{.Name}}'
      prune:
        description: Remove all unused networks
        flags:
          -f:
          --force:
          --filter: any
  volume:
    description: Manage volumes
    commands:
      ls:
        description: List volumes
        flags:
          -q:
          --quiet:
          -f: any
          --filter: any
          --format: any
      create:
        description: Create a volume
        flags:
          -d: any
          --driver: any
          --label: any
          -o: any
          --opt: any
        args: any
      rm:
        description: Remove one or more volumes
        flags:
          -f:
          --force:
          --no-prune:
        args:
          exec: docker volume ls --format '{{.Name}}'
      inspect:
        description: Display detailed information on one or more volumes
        flags:
          -f: any
          --format: any
          -s:
          --size:
          --type: any
        args:
          exec: docker volume ls --format '{{.Name}}'
      prune:
        description: Remove unused local volumes
        flags:
          -f:
          --force:
          --filter: any
  system:
    description: Manage Docker
    commands:
      df:
        description: Show docker disk usage
      info:
        description: Display system-wide information
      prune:
        description: Remove unused data
        flags:
          -a:
          --all:
          -f:
          --force:
          --volumes:
          --filter: any
      events:
        description: Get real time events from the server
  compose:
    description: Define and run multi-container applications
    flags:
      -f: file
      --file: file
      -p: any
      --project-name: any
      --profile: any
      --env-file: file
    commands:
      up:
        description: Create and start containers
        flags:
          -d:
          --detach:
          --build:
          --force-recreate:
          --no-deps:
          --remove-orphans:
          --wait:
        args: any
      down:
        description: Stop and remove containers, networks
        flags:
          -v:
          --volumes:
          --remove-orphans:
          --rmi: any
      ps:
        description: List containers
        flags:
          -a:
          --all:
          -q:
          --quiet:
          -f: any
          --filter: any
          --format: any
          -n: any
          --last: any
          -l:
          --latest:
          -s:
          --size:
          --no-trunc:
        args: any
      logs:
        description: View output from containers
        flags:
          -f:
          --follow:
          -n: any
          --tail: any
          -t:
          --timestamps:
          --since: any
          --until: any
          --details:
        args: any
      build:
        description: Build or rebuild services
        flags:
          -t: any
          --tag: any
          -f: file
          --file: file
          --build-arg: any
          --target: any
          --no-cache:
          --pull:
          --platform: any
          -q:
          --quiet:
          --progress: any
          --network:
            exec: docker network ls --format '{{.Name}}'
          --secret: any
        args: any
      pull:
        description: Pull service images
        args: any
      restart:
        description: Restart service containers
        args: any
      exec:
        description: Execute a command in a running container
        flags:
          -d:
          --detach:
          -i:
          --interactive:
          -t:
          --tty:
          -e: any
          --env: any
          -u: any
          --user: any
          -w: any
          --workdir: any
          --privileged:
        args: any
      stop:
        description: Stop services
        args: any
      start:
        description: Start services
        args: any
      config:
        description: Parse, resolve and render compose file

description: "List metadata attributes of files (Spotlight)"
flags:
  -name:
    value: {exec: 'mdimport -A 2>/dev/null | awk -F"''" ''$2 ~ /^kMDItem/ {d=($6=="(null)"?"":$6); print $2 (d==""?"":"\t" d)}'''}
    description: "Show only this attribute (repeatable)"
  -attr:
    show: always
    value: {exec: 'mdimport -A 2>/dev/null | awk -F"''" ''$2 ~ /^kMDItem/ {d=($6=="(null)"?"":$6); print $2 (d==""?"":"\t" d)}'''}
    description: "Show only this attribute (repeatable)"
  -raw: {description: "Print values only, without attribute names"}
  -nullMarker: {value: any, description: "Text printed for null attributes with -raw"}
  -plist: {value: file, description: "Write all attributes as XML plist to file ('-' for stdout)"}
  -sdb: {description: "Show Spotlight database info (_kMDItemSDBInfo)"}
args: file
examples:
  - key: 'UTI'
    command: "mdls -name kMDItemContentType -raw README.md"
    description: "file's type identifier, e.g. for duti -s"
  - key: 'UTI tree'
    command: "mdls -name kMDItemContentTypeTree README.md"
    description: "the type and all types it conforms to"
  - key: 'all'
    command: "mdls photo.jpg"
    description: "every metadata attribute of a file"
  - key: 'several'
    command: "mdls -name kMDItemPixelWidth -name kMDItemPixelHeight photo.jpg"
    description: "image dimensions"
  - key: 'download source'
    command: "mdls -name kMDItemWhereFroms ~/Downloads/file.zip"
    description: "URL a downloaded file came from"
  - key: 'null marker'
    command: "mdls -raw -nullMarker none -name kMDItemDurationSeconds video.mov"
    description: "print 'none' when the attribute is missing"

version: '20261015'
description: "Bash completion engine"
commands:
  bash:
    description: "Print the bash init script (use with eval)"
    flags:
      --man: {description: "Also complete every command with a man page, from the man page"}
  list:
    description: "List commands that have a spec, with descriptions"
    flags:
      --paths: {description: "Also show the spec file each command uses"}
      --tsv: {description: "NAME<TAB>DESCRIPTION lines, for scripts"}
      --user: {description: "Only specs in ~/.config/autocomplete (generated, aliases, your own)"}
  manage:
    description: "Your specs in ~/.config/autocomplete (same as list --user)"
    flags:
      --paths: {description: "Also show the spec file each command uses"}
      --tsv: {description: "NAME<TAB>DESCRIPTION lines, for scripts"}
  check:
    description: "Validate a spec and print it as JSON"
    args: file
  add:
    description: "Write a spec for a command (cobra, man page or --help, first that works)"
    flags:
      --force: {description: "Replace an existing CMD spec"}
      --from:
        description: "Use only this source"
        value: {enum: {cobra: 'cobra (Go) program completion', man: 'the man page', help: 'CMD --help output'}}
    args: {exec: "compgen -c | sort -u"}
  edit:
    description: "Open your copy of a spec in $VISUAL/$EDITOR (copies the shipped one first)"
    args: {exec: "autocomplete list --tsv"}
  rm:
    description: "Delete your spec or alias in ~/.config/autocomplete (the shipped one takes over)"
    flags:
      -f: {description: "Don't ask y/n before each file"}
    args: {exec: "autocomplete manage --tsv"}
  diff:
    description: "diff -u your copies against the shipped specs (default: all that differ)"
    args: {exec: "autocomplete manage | awk '/\\[override/ && !/unchanged/ {print $1}'"}
  emoji:
    description: "List snippet mark names; NAME -> emoji, emoji -> NAME"
    args: {exec: "autocomplete emoji | awk '{print $2 \"\\t\" $1}'"}
  alias:
    description: "Complete NAME like CMD (CMD NAME..., symlinks its spec)"
    flags:
      --force: {description: "Replace an existing NAME spec"}
      --rm:
        description: "Remove aliases (NAME...)"
        value: {exec: "autocomplete alias --list | cut -d' ' -f1"}
      --list: {description: "List aliases (NAME -> CMD)"}
    args: {exec: "autocomplete list --tsv"}
snippets:
  - key: l
    mark: pin
    command: "autocomplete list"
    description: "commands with a spec"
  - key: u
    command: "autocomplete manage"
    description: "your own / generated specs"
  - key: e
    mark: pin
    command: "autocomplete edit git"
    description: "edit your copy of a spec"
  - key: a
    mark: pin
    command: "autocomplete add mytool"
    description: "generate a spec (cobra, man or --help)"
  - key: h
    command: "autocomplete add --from help --force mytool"
    description: "regenerate from --help output"
  - key: m
    command: "autocomplete add --from man mytool"
    description: "generate from the man page"
  - key: k
    command: "autocomplete alias kubectl k"
    description: "complete k like kubectl"
  - key: s
    command: "autocomplete alias --list"
    description: "list aliases"
  - key: o
    command: "autocomplete diff"
    description: "your changes to shipped specs"
  - key: v
    command: "autocomplete check ~/.config/autocomplete/mytool.yaml"
    description: "validate a spec"

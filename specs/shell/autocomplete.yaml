description: "Bash completion engine"
commands:
  bash:
    description: "Print the bash init script (use with eval)"
  list:
    description: "List commands that have a spec, with descriptions"
    flags:
      --paths: {description: "Also show the spec file each command uses"}
      --user: {description: "Only specs in ~/.config/autocomplete (generated, aliases, your own)"}
  check:
    description: "Validate a spec and print it as JSON"
    args: file
  cache:
    description: "Precompile big specs (> 100 KB) into the cache"
    args: {exec: "autocomplete list | awk '{n = $1; sub(/^[^ ]+ */, \"\"); print n \"\\t\" $0}'"}
  add:
    description: "Write a spec for a command (cobra, man page or --help, first that works)"
    flags:
      --force: {description: "Replace an existing CMD spec"}
      --from:
        description: "Use only this source"
        value: {exec: "printf 'cobra\\tcobra (Go) program completion\\nman\\tthe man page\\nhelp\\tCMD --help output\\n'"}
    args: {exec: "compgen -c | sort -u"}
  emoji:
    description: "List snippet mark names; NAME -> emoji, emoji -> NAME"
    args: {exec: "autocomplete emoji | awk '{print $2 \"\\t\" $1}'"}
  alias:
    description: "Complete NAME like CMD (CMD NAME..., symlinks its spec)"
    flags:
      --force: {description: "Replace an existing NAME spec"}
      --rm:
        description: "Remove aliases (NAME...)"
        value: {exec: "autocomplete alias --list | cut -d' ' -f1"}
      --list: {description: "List aliases (NAME -> CMD)"}
    args: {exec: "autocomplete list | awk '{n = $1; sub(/^[^ ]+ */, \"\"); print n \"\\t\" $0}'"}

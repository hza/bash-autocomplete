version: '20261015'
description: "compare files line by line (BSD diff)"
flags:
  --unified: {aliases: [-u], description: "Unified diff: the format patch and code review tools read", show: always}
  -U: {value: any, description: "Unified diff with NUM lines of context"}
  --context: {aliases: [-c], description: "Context diff (3 lines of context)"}
  -C: {value: any, description: "Context diff with NUM lines of context"}
  -n: {description: "RCS format diff"}
  -e: {description: "Output an ed script"}
  -f: {description: "Output a forward ed script"}
  --side-by-side: {aliases: [-y], description: "Side by side in two columns", show: always}
  --width: {aliases: [-W], value: any, description: "Side by side: output at most NUM columns"}
  --suppress-common-lines: {description: "Side by side: show only the changed lines"}
  --brief: {aliases: [-q], description: "Only report whether the files differ", show: always}
  --report-identical-files: {aliases: [-s], description: "Report when two files are the same"}
  --recursive: {aliases: [-r], description: "Recurse into subdirectories", show: always}
  --new-file: {aliases: [-N], description: "Treat a file missing on one side as empty (new and removed files show whole)", show: always}
  --unidirectional-new-file: {aliases: [-P], description: "Treat a file missing on the first side as empty"}
  --starting-file: {aliases: [-S], value: file, description: "Start a folder comparison at this file"}
  --exclude: {aliases: [-x], value: any, description: "Exclude files matching this pattern (folders)"}
  --exclude-from: {aliases: [-X], value: file, description: "Exclude files matching the patterns in this file"}
  --ignore-case: {aliases: [-i], description: "Ignore case differences", show: always}
  --no-ignore-case: {description: "Consider case when comparing file names"}
  --ignore-all-blanks: {aliases: [-w], description: "Ignore all white space", show: always}
  --ignore-all-space: {description: "Ignore all white space"}
  --ignore-space-change: {aliases: [-b], description: "Ignore changes in the amount of white space"}
  --ignore-blank-lines: {aliases: [-B], description: "Ignore changes where all lines are blank"}
  -I: {value: any, description: "Ignore changes where all lines match this regex"}
  --show-function-line: {aliases: [-F], value: any, description: "Show the last line matching this regex in the hunk header"}
  --show-c-function: {aliases: [-p], description: "Show which C function each change is in"}
  --minimal: {aliases: [-d], description: "Try harder to find a smaller set of changes", show: always}
  --text: {aliases: [-a], description: "Treat all files as text"}
  --strip-trailing-cr: {description: "Strip trailing carriage returns on input"}
  --expand-tabs: {aliases: [-t], description: "Expand tabs to spaces in the output"}
  --initial-tab: {aliases: [-T], description: "Make tabs line up by prepending a tab"}
  --tabsize: {value: any, description: "Tab stops every NUM columns"}
  -L: {value: any, description: "Use this label instead of the file name and time"}
  -l: {description: "Pass the output through pr(1) to paginate it"}
  -D: {value: any, description: "Merged output with #ifdef NAME ... #endif"}
  --help: {description: "Show help"}
  --version: {description: "Show version"}
args: file
snippets:
  - key: u
    mark: pin
    command: "diff -u old.txt new.txt"
    description: "unified diff of two files (the format patch reads)"
  - key: r
    mark: pin
    command: "diff -ru old/ new/ > changes.diff"
    description: "unified diff of two folders, saved for patch"
  - key: q
    mark: pin
    command: "diff -rq old/ new/"
    description: "only list the files that differ"
  - key: n
    command: "diff -Nru old/ new/ > changes.diff"
    description: "folders: new and removed files included as whole files"
  - key: y
    command: "diff -y -W 120 old.txt new.txt"
    description: "side by side, 120 columns"
  - key: w
    command: "diff -w old.txt new.txt"
    description: "ignore all white space"
  - key: i
    command: "diff -i old.txt new.txt"
    description: "ignore case"
  - key: x
    command: "diff -ru -x '*.o' -x .git old/ new/"
    description: "folders, skipping build files and .git"
  - key: c
    command: "diff -u old.txt new.txt | pbcopy"
    description: "unified diff copied to the clipboard"

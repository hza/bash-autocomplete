version: '20261013'
description: "Run commands by matching a word against patterns (bash keyword)"
args: any
snippets:
  - key: b
    command: 'case "$(git branch --show-current)" in main|master) echo "on main, not pushing";; *) git push;; esac'
    description: "guard a command by branch"
  - key: o
    mark: pin
    command: 'case "$(uname -s)" in Darwin) open .;; Linux) xdg-open .;; esac'
    description: "per-OS command"
  - key: p
    mark: pin
    command: 'case "$PWD" in */frontend*) npm test;; *) make test;; esac'
    description: "per-project command"
  - key: u
    command: 'for f in *.zip *.tar.gz; do case "$f" in *.zip) unzip -o "$f";; *.tar.gz) tar xzf "$f";; esac; done'
    description: "unpack archives by type"
  - key: w
    command: 'case "$(date +%u)" in 6|7) echo weekend;; *) echo workday;; esac'
    description: "by day of week"
  - key: x
    command: 'case "$f" in *.tar.gz|*.tgz) tar xzf "$f";; *.tar.bz2) tar xjf "$f";; *.zip) unzip "$f";; *.gz) gunzip "$f";; esac'
    description: "extract any archive"
  - key: y
    mark: pin
    command: 'read -p "Continue? [y/N] " a; case "$a" in [yY]*) echo go;; *) echo stop;; esac'
    description: "yes/no prompt"
  - key: a
    command: 'case "$(uname -m)" in arm64) echo "Apple Silicon";; x86_64) echo Intel;; esac'
    description: "CPU architecture"
  - key: s
    command: 'case "$SHELL" in */bash) echo bash;; */zsh) echo zsh;; *) echo other;; esac'
    description: "which login shell"
  - key: d
    command: 'case "$1" in start|stop|restart) echo "$1 service";; *) echo "usage: $0 start|stop|restart" >&2;; esac'
    description: "subcommand dispatch (in a script)"

version: '20261015'
description: "apply a diff file to an original (BSD patch)"
flags:
  --strip: {aliases: [-p], value: {enum: ['0', '1', '2', '3']}, description: "Strip N leading path components (-p1 drops a/ b/ of git diffs)", show: always}
  --input: {aliases: [-i], value: file, description: "Read the patch from this file instead of stdin", show: always}
  --output: {aliases: [-o], value: any, description: "Write the patched file to this name", show: always}
  --directory: {aliases: [-d], value: dir, description: "Change to this directory first", show: always}
  --reverse: {aliases: [-R], description: "Patch was made with old and new swapped: undo it", show: always}
  --check: {aliases: [-C], description: "Check that the patch applies, change nothing", show: always}
  --dry-run: {description: "Check that the patch applies, change nothing"}
  --backup: {aliases: [-b], description: "Save the original as FILE.orig before changing it", show: always}
  --backup-if-mismatch: {description: "Back up only when a hunk failed or needed fuzz"}
  --no-backup-if-mismatch: {description: "Back up every file that is patched"}
  --suffix: {aliases: [-z], value: any, description: "Backup extension instead of .orig"}
  --prefix: {aliases: [-B], value: any, description: "Backup file name prefix"}
  --basename-prefix: {aliases: [-Y], value: any, description: "Prepend this to the basename of the backup file"}
  --version-control: {aliases: [-V], value: {enum: {t: 'numbered backups', nil: 'numbered if they exist', never: 'simple backups', none: 'no backups'}}, description: "Backup naming: numbered, existing, simple, none"}
  --reject-file: {aliases: [-r], value: any, description: "Write rejected hunks to this file (default FILE.rej)"}
  --forward: {aliases: [-N], description: "Skip hunks that look reversed or already applied", show: always}
  --ignore-whitespace: {aliases: [-l], description: "Ignore whitespace differences when matching context", show: always}
  --fuzz: {aliases: [-F], value: any, description: "Maximum fuzz factor (default 2)"}
  --quiet: {aliases: [-s], description: "Silent unless an error occurs"}
  --silent: {description: "Silent unless an error occurs"}
  --force: {aliases: [-f], description: "Force: no questions, skip missing files, assume not reversed"}
  --batch: {aliases: [-t], description: "Batch: like -f, but assume reversed patches are reversed"}
  --remove-empty-files: {aliases: [-E], description: "Remove output files that end up empty"}
  --set-time: {aliases: [-T], description: "Set file times from the timestamps in the diff header"}
  --set-utc: {aliases: [-Z], description: "Like -T, timestamps are UTC"}
  --get: {aliases: [-g], value: any, description: "Consult version control (RCS, Perforce) for missing or read-only files"}
  --context: {aliases: [-c], description: "Read the patch as a context diff"}
  --unified: {aliases: [-u], description: "Read the patch as a unified diff"}
  --normal: {aliases: [-n], description: "Read the patch as a normal diff"}
  --ed: {aliases: [-e], description: "Read the patch as an ed script"}
  --ifdef: {aliases: [-D], value: any, description: "Wrap changes in #ifdef SYMBOL ... #endif"}
  --debug: {aliases: [-x], value: any, description: "Internal debugging flags"}
  --quoting-style: {value: {enum: [literal, shell, shell-always, c, escape]}, description: "How file names are quoted in messages"}
  --posix: {description: "Strict POSIX behaviour (no default backups, POSIX file name choice)"}
  --help: {description: "Print a help message"}
  --version: {aliases: [-v], description: "Print the patch version"}
args: file
snippets:
  - key: p
    mark: pin
    command: "patch -p1 < changes.diff"
    description: "apply a git diff made at the repo root (strips a/ b/)"
  - key: c
    mark: pin
    command: "patch -p1 --dry-run < changes.diff"
    description: "check the diff applies cleanly, change nothing"
  - key: r
    mark: pin
    command: "patch -R -p1 < changes.diff"
    description: "undo a diff that was already applied"
  - key: b
    command: "patch -b -p1 < changes.diff"
    description: "apply and keep FILE.orig backups"
  - key: d
    command: "patch -d src -p1 < changes.diff"
    description: "apply inside another directory"
  - key: i
    command: "patch -p1 -i changes.diff"
    description: "same as < changes.diff, the file as an argument"
  - key: n
    command: "patch -N -p1 < changes.diff"
    description: "skip hunks that are already applied"
  - key: l
    command: "patch -l -p1 < changes.diff"
    description: "tolerate changed whitespace (tabs turned into spaces)"
  - key: o
    command: "patch -o fixed.c original.c fix.diff"
    description: "write the result to another file, original untouched"
  - key: s
    command: "patch -s -p1 < changes.diff"
    description: "silent unless something fails"

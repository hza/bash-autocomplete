args: file
snippets:
  - key: r
    mark: 1
    command: "zip -r archive.zip folder/"
    description: "zip a folder (without -r only the empty folder goes in)"
  - key: m
    mark: 3
    command: "zip -r -X clean.zip folder/ -x '*.DS_Store' '*/__MACOSX/*'"
    description: "no macOS junk: .DS_Store, extended attributes"
  - key: x
    mark: 2
    command: "zip -r src.zip project/ -x '*/node_modules/*' '*/.git/*'"
    description: "exclude folders (patterns match the stored path)"
  - key: e
    mark: key
    command: "zip -er secret.zip folder/"
    description: "password-protect (prompted, not shown in history)"
  - key: c
    command: "cd folder && zip -r ../archive.zip . && cd -"
    description: "contents only, without the top folder"
  - key: j
    command: "zip -j flat.zip docs/*.pdf"
    description: "files only, drop their folder paths"
  - key: u
    command: "zip -u archive.zip notes.txt"
    description: "add or update a file in an existing zip"
  - key: d
    command: "zip -d archive.zip 'folder/old.txt'"
    description: "delete an entry from the zip"
  - key: l
    command: "zip -sf archive.zip"
    description: "list the entries (or unzip -l)"
  - key: s
    command: "zip -r -s 100m parts.zip big/"
    description: "split into 100 MB parts (.z01, .z02, … .zip)"
  - key: '9'
    command: "zip -r -9 best.zip folder/"
    description: "maximum compression (slower)"
  - key: '0'
    command: "zip -r -0 photos.zip photos/"
    description: "store only, for already compressed files"
  - key: y
    command: "zip -ry app.zip MyApp.app"
    description: "keep symlinks as links (needed for .app bundles)"
  - key: p
    command: "find . -name '*.log' | zip logs.zip -@"
    description: "zip the file names read from stdin"
  - key: t
    command: "zip -T archive.zip"
    description: "test the archive"
  - key: f
    command: "zip -FF broken.zip --out fixed.zip"
    description: "try to repair a damaged zip"

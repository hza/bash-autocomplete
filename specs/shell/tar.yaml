args: file
snippets:
  - key: c
    mark: pin
    command: "tar -czf backup.tar.gz project/"
    description: "create a gzip archive of a folder"
  - key: x
    mark: pin
    command: "tar -xzf backup.tar.gz"
    description: "extract a gzip archive here (-x auto-detects compression too)"
  - key: t
    mark: pin
    command: "tar -tzf backup.tar.gz"
    description: "list the contents without extracting"
  - key: d
    command: "tar -xzf backup.tar.gz -C /tmp/out"
    description: "extract into another directory (must exist)"
  - key: j
    command: "tar -cJf backup.tar.xz project/"
    description: "create an xz archive (smaller, slower)"
  - key: b
    command: "tar -cjf backup.tar.bz2 project/"
    description: "create a bzip2 archive"
  - key: a
    command: "tar -caf backup.tar.zst project/"
    description: "pick the compression from the suffix (.gz .bz2 .xz .zst)"
  - key: e
    command: "tar -czf src.tar.gz --exclude node_modules --exclude .git project/"
    description: "create an archive skipping folders"
  - key: o
    command: "tar -xzf backup.tar.gz project/README.md"
    description: "extract a single file"
  - key: s
    command: "tar -xzf release.tar.gz --strip-components 1"
    description: "extract dropping the top-level folder"
  - key: v
    command: "tar -cvzf backup.tar.gz project/"
    description: "create and print each file added"
  - key: m
    command: "COPYFILE_DISABLE=1 tar -czf clean.tar.gz project/"
    description: "no macOS ._ metadata files (for Linux machines)"
  - key: p
    command: "tar -czf - project/ | ssh myhost 'tar -xzf - -C ~'"
    description: "copy a folder to another host through a pipe"

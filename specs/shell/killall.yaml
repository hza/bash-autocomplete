version: '20261013'
description: Kill processes by name
flags:
  -d: {description: "Show what would be done, send no signal"}
  -e: {description: "Use effective UID for -u matching"}
  -help: {description: "Show usage and exit"}
  -I: {description: "Confirm before signalling each process"}
  -l: {description: "List signal names and exit", show: always}
  -m: {description: "Match procname as a regular expression"}
  -v: {description: "Be verbose"}
  -s: {description: "Like -v, but send no signal"}
  -q: {description: "Suppress error if no processes match"}
  -z: {description: "Do not skip zombies"}
  -u:
    value: "@users"
    description: "Only processes of USER"
  -t:
    value: {exec: "cd /dev && ls -d tty?*"}
    description: "Only processes on TTY"
  -c:
    value: "@processes"
    description: "Only processes matching PROCNAME"
  -HUP: {description: "Send SIGHUP"}
  -INT: {description: "Send SIGINT"}
  -QUIT: {description: "Send SIGQUIT"}
  -KILL: {description: "Send SIGKILL"}
  -TERM: {description: "Send SIGTERM (default)"}
  -STOP: {description: "Send SIGSTOP"}
  -CONT: {description: "Send SIGCONT"}
  -USR1: {description: "Send SIGUSR1"}
  -USR2: {description: "Send SIGUSR2"}
  '-9': {description: "Send SIGKILL", show: always}
args: "@processes"
snippets:
  - key: f
    command: "killall Finder"
    description: "restart Finder"
    mark: pin
  - key: d
    command: "killall Dock"
    description: "restart the Dock (applies defaults changes)"
    mark: pin
  - key: u
    command: "killall SystemUIServer"
    description: "restart the menu bar"
  - key: k
    command: "killall -9 NAME"
    description: "force-kill every process named NAME"
  - key: n
    command: "killall -d NAME"
    description: "dry run: show what would be signalled"
  - key: h
    command: "killall -HUP mDNSResponder"
    description: "flush the DNS cache"
  - key: c
    command: "killall cfprefsd"
    description: "make defaults re-read preference files"

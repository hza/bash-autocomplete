snippets:
  - key: 'f'
    mark: pin
    command: 'xz big.log'
    description: 'replace big.log with big.log.xz'
  - key: 'k'
    mark: pin
    command: 'xz -k big.log'
    description: 'keep the original'
  - key: 't'
    mark: pin
    command: 'xz -T0 -k big.iso'
    description: 'all CPU cores (much faster)'
  - key: '9'
    command: 'xz -9e -T0 big.tar'
    description: 'maximum compression (slow, lots of memory)'
  - key: '0'
    command: 'xz -0 -T0 big.log'
    description: 'fastest, still beats gzip on size'
  - key: 'c'
    command: 'xz -c big.log > big.log.xz'
    description: 'write to stdout'
  - key: 'd'
    mark: pin
    command: 'xz -d big.log.xz'
    description: 'decompress (same as unxz)'
  - key: 'l'
    command: 'xz -l big.log.xz'
    description: 'sizes, ratio, check type'
  - key: 'v'
    command: 'xz -tv big.log.xz'
    description: 'test integrity'
  - key: 'p'
    command: 'tar -cf - folder/ | xz -T0 > folder.tar.xz'
    description: 'compress a folder via tar (or tar -cJf)'

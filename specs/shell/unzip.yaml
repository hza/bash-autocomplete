snippets:
  - key: l
    mark: pushpin
    command: "unzip -l archive.zip"
    description: "list contents without extracting"
  - key: d
    mark: pushpin
    command: "unzip archive.zip -d out/"
    description: "extract into a folder (created if missing)"
  - key: x
    mark: pushpin
    command: "unzip archive.zip -x '__MACOSX/*' '*.DS_Store'"
    description: "extract skipping macOS junk"
  - key: o
    mark: pushpin
    command: "unzip -o archive.zip"
    description: "overwrite existing files without asking"
  - key: n
    command: "unzip -n archive.zip"
    description: "never overwrite existing files"
  - key: u
    command: "unzip -u archive.zip"
    description: "only new or newer files"
  - key: f
    command: "unzip archive.zip 'docs/*'"
    description: "extract only matching entries (quote the pattern)"
  - key: j
    command: "unzip -j archive.zip '*.pdf' -d pdfs/"
    description: "flatten: drop folder paths"
  - key: p
    command: "unzip -p archive.zip config.json | jq ."
    description: "print one file to stdout"
  - key: q
    command: "unzip -q archive.zip"
    description: "quiet, no file list"
  - key: t
    command: "unzip -t archive.zip"
    description: "test the archive"
  - key: v
    command: "unzip -v archive.zip"
    description: "sizes, compression ratio, CRC"
  - key: b
    command: "unzip -Z1 archive.zip"
    description: "bare entry names, one per line"
  - key: s
    command: "zip -s 0 parts.zip --out whole.zip && unzip whole.zip"
    description: "split zip: join the parts first"

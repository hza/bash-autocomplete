version: '20261015'
description: "Recursively search files for a regex (ripgrep), honouring .gitignore"
flags:
  --regexp: {aliases: [-e], value: {exec: "sh \"$AUTOCOMPLETE_SPEC_DIR/grep.sh\" pattern"}, description: "A pattern to search for", repeat: true}
  --file: {aliases: [-f], value: file, description: "Search for patterns from the given file", repeat: true}
  --pre: {value: "@command", description: "Search output of COMMAND for each PATH"}
  --pre-glob: {value: {exec: "sh \"$AUTOCOMPLETE_SPEC_DIR/grep.sh\" glob"}, description: "Include or exclude files from a preprocessor"}
  --search-zip: {aliases: [-z], description: "Search in compressed files"}
  --case-sensitive: {aliases: [-s], description: "Search case sensitively (default)"}
  --crlf: {description: "Use CRLF line terminators (nice for Windows)"}
  --dfa-size-limit: {value: any, description: "The upper size limit of the regex DFA"}
  --encoding: {aliases: [-E], value: {enum: {utf-8: UTF-8, utf-16le: 'UTF-16 little endian', latin1: ISO-8859-1, none: 'raw bytes, no transcoding', auto: 'detect BOM (default)'}}, description: "Specify the text encoding of files to search"}
  --engine: {value: {enum: {default: 'Rust regex engine', pcre2: 'PCRE2 (lookaround, backrefs)', auto: 'PCRE2 only when needed'}}, description: "Specify which regex engine to use"}
  --fixed-strings: {aliases: [-F], description: "Treat all patterns as literals", show: always}
  --ignore-case: {aliases: [-i], description: "Case insensitive search", show: always}
  --invert-match: {aliases: [-v], description: "Invert matching"}
  --line-regexp: {aliases: [-x], description: "Show matches surrounded by line boundaries"}
  --max-count: {aliases: [-m], value: {exec: "sh \"$AUTOCOMPLETE_SPEC_DIR/grep.sh\" count"}, description: "Limit the number of matching lines"}
  --mmap: {description: "Search with memory maps when possible"}
  --multiline: {aliases: [-U], description: "Enable searching across multiple lines"}
  --multiline-dotall: {description: "Make '.' match line terminators"}
  --no-unicode: {description: "Disable Unicode mode"}
  --null-data: {description: "Use NUL as a line terminator"}
  --pcre2: {aliases: [-P], description: "Enable PCRE2 matching"}
  --regex-size-limit: {value: any, description: "The size limit of the compiled regex"}
  --smart-case: {aliases: [-S], description: "Smart case search", show: always}
  --stop-on-nonmatch: {description: "Stop searching after a non-match"}
  --text: {aliases: [-a], description: "Search binary files as if they were text"}
  --threads: {aliases: [-j], value: any, description: "Set the approximate number of threads to use"}
  --word-regexp: {aliases: [-w], description: "Show matches surrounded by word boundaries", show: always}
  --binary: {description: "Search binary files"}
  --follow: {aliases: [-L], description: "Follow symbolic links"}
  --glob: {aliases: [-g], value: {exec: "sh \"$AUTOCOMPLETE_SPEC_DIR/grep.sh\" glob"}, description: "Include or exclude file paths", repeat: true, show: always}
  --glob-case-insensitive: {description: "Process all glob patterns case insensitively"}
  --hidden: {aliases: ['-.'], description: "Search hidden files and directories", show: always}
  --iglob: {value: {exec: "sh \"$AUTOCOMPLETE_SPEC_DIR/grep.sh\" glob"}, description: "Include/exclude paths case insensitively", repeat: true}
  --ignore-file: {value: file, description: "Specify additional ignore files"}
  --ignore-file-case-insensitive: {description: "Process ignore files case insensitively"}
  --max-depth: {aliases: [-d], value: any, description: "Descend at most NUM directories"}
  --max-filesize: {value: any, description: "Ignore files larger than NUM in size"}
  --no-ignore: {description: "Don't use ignore files"}
  --no-ignore-dot: {description: "Don't use .ignore or .rgignore files"}
  --no-ignore-exclude: {description: "Don't use local exclusion files"}
  --no-ignore-files: {description: "Don't use --ignore-file arguments"}
  --no-ignore-global: {description: "Don't use global ignore files"}
  --no-ignore-parent: {description: "Don't use ignore files in parent directories"}
  --no-ignore-vcs: {description: "Don't use ignore files from source control"}
  --no-require-git: {description: "Use .gitignore outside of git repositories"}
  --one-file-system: {description: "Skip directories on other file systems"}
  --type: {aliases: [-t], value: {exec: "rg --type-list | sed 's/: /\t/'"}, description: "Only search files matching TYPE", repeat: true, show: always}
  --type-not: {aliases: [-T], value: {exec: "rg --type-list | sed 's/: /\t/'"}, description: "Do not search files matching TYPE", repeat: true}
  --type-add: {value: any, description: "Add a new glob for a file type", repeat: true}
  --type-clear: {value: {exec: "rg --type-list | sed 's/: /\t/'"}, description: "Clear globs for a file type"}
  --unrestricted: {aliases: [-u], description: "Reduce the level of \"smart\" filtering"}
  --after-context: {aliases: [-A], value: {exec: "sh \"$AUTOCOMPLETE_SPEC_DIR/grep.sh\" lines"}, description: "Show NUM lines after each match"}
  --before-context: {aliases: [-B], value: {exec: "sh \"$AUTOCOMPLETE_SPEC_DIR/grep.sh\" lines"}, description: "Show NUM lines before each match"}
  --block-buffered: {description: "Force block buffering"}
  --byte-offset: {aliases: [-b], description: "Print the byte offset for each matching line"}
  --color: {value: {enum: {auto: 'when stdout is a terminal', always: 'always colorize', never: 'no color', ansi: 'ANSI escapes even on Windows'}}, description: "When to use color"}
  --colors: {value: any, description: "Configure color settings and styles"}
  --column: {description: "Show column numbers"}
  --context: {aliases: [-C], value: {exec: "sh \"$AUTOCOMPLETE_SPEC_DIR/grep.sh\" lines"}, description: "Show NUM lines before and after each match", show: always}
  --context-separator: {value: any, description: "Set the separator for contextual chunks"}
  --field-context-separator: {value: any, description: "Set the field context separator"}
  --field-match-separator: {value: any, description: "Set the field match separator"}
  --heading: {description: "Print matches grouped by each file"}
  --help: {aliases: [-h], description: "Show help output"}
  --hostname-bin: {value: "@command", description: "Run a program to get this system's hostname"}
  --hyperlink-format: {value: any, description: "Set the format of hyperlinks"}
  --include-zero: {description: "Include zero matches in summary output"}
  --line-buffered: {description: "Force line buffering"}
  --line-number: {aliases: [-n], description: "Show line numbers"}
  --no-line-number: {aliases: [-N], description: "Suppress line numbers"}
  --max-columns: {aliases: [-M], value: any, description: "Omit lines longer than this limit"}
  --max-columns-preview: {description: "Show preview for lines exceeding the limit"}
  --null: {aliases: ['-0'], description: "Print a NUL byte after file paths"}
  --only-matching: {aliases: [-o], description: "Print only matched parts of a line"}
  --path-separator: {value: any, description: "Set the path separator for printing paths"}
  --passthru: {description: "Print both matching and non-matching lines"}
  --pretty: {aliases: [-p], description: "Alias for colors, headings and line numbers"}
  --quiet: {aliases: [-q], description: "Do not print anything to stdout"}
  --replace: {aliases: [-r], value: any, description: "Replace matches with the given text"}
  --sort: {value: {enum: {path: 'by file path', modified: 'by modification time', accessed: 'by access time', created: 'by creation time', none: 'no sorting (parallel)'}}, description: "Sort results in ascending order"}
  --sortr: {value: {enum: {path: 'by file path', modified: 'by modification time', accessed: 'by access time', created: 'by creation time', none: 'no sorting (parallel)'}}, description: "Sort results in descending order"}
  --trim: {description: "Trim prefix whitespace from matches"}
  --vimgrep: {description: "Print results im a vim compatible format"}
  --with-filename: {aliases: [-H], description: "Print the file path with each matching line"}
  --no-filename: {aliases: [-I], description: "Never print the path with each matching line"}
  --count: {aliases: [-c], description: "Show count of matching lines for each file"}
  --count-matches: {description: "Show count of every match for each file"}
  --files-with-matches: {aliases: [-l], description: "Print the paths with at least one match", show: always}
  --files-without-match: {description: "Print the paths that contain zero matches"}
  --json: {description: "Show search results in a JSON Lines format"}
  --debug: {description: "Show debug messages"}
  --no-ignore-messages: {description: "Suppress gitignore parse error messages"}
  --no-messages: {description: "Suppress some error messages"}
  --stats: {description: "Print statistics about the search"}
  --trace: {description: "Show trace messages"}
  --files: {description: "Print each file that would be searched"}
  --generate: {value: {enum: {man: 'roff man page', complete-bash: 'bash completion', complete-zsh: 'zsh completion', complete-fish: 'fish completion', complete-powershell: 'PowerShell completion'}}, description: "Generate man pages and completion scripts"}
  --no-config: {description: "Never read configuration files"}
  --pcre2-version: {description: "Print the version of PCRE2 that ripgrep uses"}
  --type-list: {description: "Show all supported file types"}
  --version: {aliases: [-V], description: "Print ripgrep's version"}
snippets:
  - key: t
    mark: pin
    command: "rg -t py 'def main'"
    description: "search only one file type"
  - key: g
    mark: pin
    command: "rg -g '!*.min.js' fetch"
    description: "exclude files by glob"
  - key: l
    mark: pin
    command: "rg -l TODO"
    description: "names of files with a match"
  - key: h
    mark: pin
    command: "rg -uu --hidden secret"
    description: "include hidden and ignored files"
  - key: w
    command: "rg -w -S count src"
    description: "whole word, smart case, in one dir"
  - key: f
    command: "rg -F 'a.b(c)'"
    description: "literal text, no regex"
  - key: r
    command: "rg 'old_name' -r 'new_name'"
    description: "preview a replacement (files untouched)"
  - key: c
    command: "rg -c ERROR --sort path"
    description: "matches per file, sorted by path"
  - key: m
    command: "rg -U 'struct \\w+ \\{[^}]*\\}'"
    description: "multiline match"
  - key: p
    command: "rg -P '(?<=id=)\\d+' -o"
    description: "PCRE2 lookbehind, print only the match"
  - key: s
    command: "rg --files | rg -i test"
    description: "list searchable files, filter names"
  - key: j
    command: "rg --json panic | jq -c 'select(.type==\"match\")'"
    description: "machine-readable results"
positional:
  - {exec: "sh \"$AUTOCOMPLETE_SPEC_DIR/grep.sh\" pattern"}
args: file

version: '20261015'
description: "Search files for lines matching a pattern"
flags:
  --regexp: {aliases: [-e], value: {exec: "sh \"$AUTOCOMPLETE_SPEC_DIR/grep.sh\" pattern"}, description: "Pattern (repeatable; for patterns starting with -)", repeat: true}
  --file: {aliases: [-f], value: file, description: "Read patterns from a file, one per line"}
  --ignore-case: {aliases: [-i], description: "Ignore case"}
  --invert-match: {aliases: [-v], description: "Select non-matching lines"}
  --word-regexp: {aliases: [-w], description: "Match whole words only"}
  --line-regexp: {aliases: [-x], description: "Match whole lines only"}
  --extended-regexp: {aliases: [-E], description: "Extended regex: | + ? () {} without backslashes"}
  --fixed-strings: {aliases: [-F], description: "Fixed strings, no regex (fast, no escaping)"}
  --basic-regexp: {aliases: [-G], description: "Basic regex (default)"}
  --recursive: {aliases: [-r, -R], description: "Recurse into directories"}
  --line-number: {aliases: [-n], description: "Prefix lines with line numbers"}
  --count: {aliases: [-c], description: "Print only a count of matching lines per file"}
  --files-with-matches: {aliases: [-l], description: "Print only names of files with matches"}
  --files-without-match: {aliases: [-L], description: "Print only names of files without matches"}
  --only-matching: {aliases: [-o], description: "Print only the matched parts"}
  --quiet: {aliases: [-q], description: "Quiet: exit status only (0 = found)"}
  --no-messages: {aliases: [-s], description: "No messages about missing or unreadable files"}
  -H: {description: "Always print file names"}
  --no-filename: {aliases: [-h], description: "Never print file names"}
  --byte-offset: {aliases: [-b], description: "Prefix lines with byte offsets"}
  --after-context: {aliases: [-A], value: {exec: "sh \"$AUTOCOMPLETE_SPEC_DIR/grep.sh\" lines"}, description: "Lines of context after each match"}
  --before-context: {aliases: [-B], value: {exec: "sh \"$AUTOCOMPLETE_SPEC_DIR/grep.sh\" lines"}, description: "Lines of context before each match"}
  --context: {aliases: [-C], value: {exec: "sh \"$AUTOCOMPLETE_SPEC_DIR/grep.sh\" lines"}, description: "Lines of context around each match"}
  --max-count: {aliases: [-m], value: {exec: "sh \"$AUTOCOMPLETE_SPEC_DIR/grep.sh\" count"}, description: "Stop after this many matches per file"}
  --include: {value: {exec: "sh \"$AUTOCOMPLETE_SPEC_DIR/grep.sh\" glob"}, description: "With -r: only files matching a glob (repeatable)", repeat: true}
  --exclude: {value: {exec: "sh \"$AUTOCOMPLETE_SPEC_DIR/grep.sh\" glob"}, description: "With -r: skip files matching a glob (repeatable)", repeat: true}
  --exclude-dir: {value: {exec: "sh \"$AUTOCOMPLETE_SPEC_DIR/grep.sh\" dir"}, description: "With -r: skip directories matching a glob (repeatable)", repeat: true}
  --include-dir: {value: {exec: "sh \"$AUTOCOMPLETE_SPEC_DIR/grep.sh\" dir"}, description: "With -r: only directories matching a glob", repeat: true}
  --color: {value: {exec: "sh \"$AUTOCOMPLETE_SPEC_DIR/grep.sh\" color"}, description: "Highlight matches: auto, always, never"}
  --binary-files: {value: {exec: "sh \"$AUTOCOMPLETE_SPEC_DIR/grep.sh\" binary"}, description: "How to treat binary files"}
  --text: {aliases: [-a], description: "Treat binary files as text"}
  -I: {description: "Skip binary files"}
  -D: {value: {enum: {read: 'read devices and FIFOs', skip: 'skip them'}}, description: "Devices and FIFOs: read or skip"}
  -d: {value: {enum: {read: 'read as files', recurse: 'like -r', skip: 'skip them'}}, description: "Directories: read, recurse or skip"}
  --null-data: {aliases: [-z], description: "Input lines end with NUL, not newline"}
  --null: {description: "NUL after file names (for xargs -0 with -l)"}
  --decompress: {aliases: [-Z], description: "Search compressed files (gzip)"}
  -J: {description: "Search bzip2 compressed files"}
  -O: {description: "With -r: follow symlinks given on the command line only"}
  -S: {description: "With -r: follow all symbolic links"}
  -p: {description: "With -r: follow no symbolic links (default)"}
  -U: {description: "Binary search, don't touch CR/LF"}
  --line-buffered: {description: "Flush after every line (for tail -f pipelines)"}
  --label: {value: any, description: "File name to show for standard input"}
  --help: {description: "Show help"}
  --version: {aliases: [-V], description: "Version information"}
snippets:
  - key: t
    mark: pin
    command: "grep -rn TODO ."
    description: "TODO lines with file and line number"
  - key: w
    mark: pin
    command: "grep -rnw main --include='*.c' ."
    description: "whole word in C sources only"
  - key: f
    mark: pin
    command: "grep -ril password --exclude-dir=.git ."
    description: "files mentioning a word, skipping .git"
  - key: v
    mark: pin
    command: "grep -v '^#' config.txt"
    description: "drop comment lines"
  - key: e
    command: "grep -v -e '^$' -e '^#' config.txt"
    description: "drop empty and comment lines"
  - key: c
    command: "grep -c ERROR app.log"
    description: "count matching lines"
  - key: a
    mark: pin
    command: "grep -C 3 Exception app.log"
    description: "3 lines of context around matches"
  - key: o
    mark: pin
    command: "grep -E 'error|warn' app.log"
    description: "either word (extended regex)"
  - key: i
    command: "grep -Eo '[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+' access.log"
    description: "extract IPv4-like addresses"
  - key: l
    command: "grep -F '[x]' notes.md"
    description: "literal text, no regex escaping"
  - key: n
    command: "grep -L license -r src"
    description: "files missing a word"
  - key: m
    command: "grep -m 1 version package.json"
    description: "first match only"
  - key: q
    command: "grep -q pattern file && echo found"
    description: "test for a match in a script"
  - key: x
    command: "grep -x 'exact line' file.txt"
    description: "whole line must match"
  - key: u
    command: "grep -o 'https\\?://[^ ]*' page.html"
    description: "extract URLs"
  - key: r
    command: "grep -rl old src | xargs sed -i '' 's/old/new/g'"
    description: "replace in every file containing a word"
  - key: z
    command: "grep -Z error logs.gz"
    description: "search a gzip-compressed file"
  - key: d
    command: "grep -e -v file.txt"
    description: "pattern that starts with a dash"
  - key: s
    command: "grep -h -r import --include='*.py' . | sort | uniq -c"
    description: "count distinct import lines"
  - key: g
    command: "grep --line-buffered ERROR <(tail -f app.log)"
    description: "follow a log as it grows"
positional:
  - {exec: "sh \"$AUTOCOMPLETE_SPEC_DIR/grep.sh\" pattern"}
args: file

version: '20261013'
description: Send a signal to a process
flags:
  -s:
    value: "@signals"
    description: "Signal name to send"
  -l: {description: "List signal names", show: always}
  '-9': {description: "Send SIGKILL (forceful termination)", show: always}
  '-15': {description: "Send SIGTERM (default)"}
  -HUP: {description: "Send SIGHUP", show: always}
  -INT: {description: "Send SIGINT", show: always}
  -QUIT: {description: "Send SIGQUIT"}
  -KILL: {description: "Send SIGKILL", show: always}
  -TERM: {description: "Send SIGTERM"}
  -STOP: {description: "Send SIGSTOP", show: always}
  -CONT: {description: "Send SIGCONT"}
  -USR1: {description: "Send SIGUSR1"}
  -USR2: {description: "Send SIGUSR2"}
args: "@pids"

version: '20261015'
# generated by autocomplete add; edit freely
description: 'decompress .bz2 files'
flags:
  --decompress: {aliases: [-d], description: "force decompression"}
  --compress: {aliases: [-z], description: "force compression"}
  --keep: {aliases: [-k], description: "keep (don't delete) input files"}
  --force: {aliases: [-f], description: "overwrite existing output files"}
  --test: {aliases: [-t], description: "test compressed file integrity"}
  --stdout: {aliases: [-c], description: "output to standard out"}
  --quiet: {aliases: [-q], description: "suppress noncritical error messages"}
  --verbose: {aliases: [-v], description: "be verbose (a 2nd -v gives more)", repeat: true}
  --small: {aliases: [-s], description: "use less memory (at most 2500k)"}
  '-1': {description: "block size 100k (fastest)"}
  '-9': {description: "block size 900k (default, best)"}
  --fast: {description: "alias for -1"}
  --best: {description: "alias for -9"}
  -L: {description: "display software version & license"}
  -V: {description: "display software version & license"}
  --help: {aliases: [-h], description: "print help"}
args: {file: "*.bz2 *.tbz *.tbz2"}
snippets:
  - key: 'u'
    mark: pin
    command: 'bunzip2 big.log.bz2'
    description: 'restore big.log, removing the .bz2'
  - key: 'k'
    mark: pin
    command: 'bunzip2 -k big.log.bz2'
    description: 'keep the .bz2'
  - key: 'c'
    mark: pin
    command: 'bunzip2 -c big.log.bz2 | less'
    description: 'read without unpacking (or bzless)'
  - key: 't'
    command: 'bunzip2 -c folder.tar.bz2 | tar -xf -'
    description: 'unpack a .tar.bz2 (tar -xf works too)'
  - key: 'f'
    command: 'bunzip2 -f big.log.bz2'
    description: 'overwrite an existing big.log'
  - key: 's'
    command: 'bunzip2 -s huge.bz2'
    description: 'low-memory mode'

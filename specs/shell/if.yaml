description: "Run commands if a command succeeds (bash keyword)"
args: "@command"
snippets:
  - key: g
    command: 'if git diff --quiet; then git pull --rebase; else echo "uncommitted changes"; fi'
    description: "only if the work tree is clean"
  - key: b
    command: 'if make; then say "build ok"; else say "build failed"; fi'
    description: "announce the result of a long command"
  - key: e
    mark: pushpin
    command: 'if [ -f .env ]; then set -a; . ./.env; set +a; fi'
    description: "load .env into the shell"
  - key: d
    command: 'if [ -d node_modules ]; then npm test; else npm ci && npm test; fi'
    description: "set up only when missing"
  - key: c
    mark: pushpin
    command: 'if grep -q "^127.0.0.1.*myapp" /etc/hosts; then echo present; else echo missing; fi'
    description: "check a file contains something"
  - key: i
    mark: pushpin
    command: 'if command -v brew >/dev/null; then brew upgrade; fi'
    description: "only if a tool is installed"
  - key: h
    command: 'if ping -c1 -t1 example.com >/dev/null; then echo up; else echo down; fi'
    description: "is a host up"
  - key: t
    command: 'if [ -z "$(git status --porcelain)" ]; then echo clean; else git status -s; fi'
    description: "is the work tree clean"
  - key: r
    command: 'if [ "$(id -u)" -eq 0 ]; then echo root; else echo "user $(id -un)"; fi'
    description: "running as root"
  - key: v
    command: 'if [ ! -d .venv ]; then python3 -m venv .venv; fi; . .venv/bin/activate'
    description: "create a venv once, then activate"
  - key: p
    command: 'if lsof -iTCP:8080 -sTCP:LISTEN >/dev/null; then echo "port 8080 busy"; fi'
    description: "is a port in use"
  - key: n
    command: 'if [ file1 -nt file2 ]; then cp file1 file2; fi'
    description: "copy only if newer"
  - key: s
    command: 'if [[ $PWD == */src/* ]]; then cd "${PWD%%/src/*}"; fi'
    description: "jump to the project root above src/"
  - key: k
    command: 'if ! git diff --cached --quiet; then git commit; else echo "nothing staged"; fi'
    description: "commit only when something is staged"
  - key: a
    command: 'if [ $# -lt 1 ]; then echo "usage: $0 FILE" >&2; exit 1; fi'
    description: "argument check (in a script)"

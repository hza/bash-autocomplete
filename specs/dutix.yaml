description: "Manage default apps for file extensions, UTIs and URL schemes"
flags:
  -o: {value: {exec: "printf 'table\\njson\\nyaml\\n'"}, description: "Output format (default table)"}
  --output: {value: {exec: "printf 'table\\njson\\nyaml\\n'"}, description: "Output format (default table)", show: always}
  -q: {description: "Suppress non-essential output"}
  --quiet: {description: "Suppress non-essential output", show: always}
  --debug: {description: "Enable debug logging"}
  -h: {description: "Show help"}
  --help: {description: "Show help", show: always}
commands:
  set:
    description: "Set the default app for extensions, UTIs or URL schemes"
    flags:
      --extensions: {value: {exec: 'c=${COMP_LINE##*[ =]}; p=; case $c in *,*) p=${c%,*},;; esac; dutix targets list -o json 2>/dev/null | awk -F''"'' -v p="$p" ''/"extension":/{e=$4} /"uti":/{u=$4} /"name":/{if(e!="*")print p e "\t" u " → " $4}'''}, description: "File extensions, comma-separated (txt,md,json)"}
      --utis: {value: {exec: 'c=${COMP_LINE##*[ =]}; p=; case $c in *,*) p=${c%,*},;; esac; dutix targets list -o json 2>/dev/null | awk -F''"'' -v p="$p" ''/"extension":/{e=$4} /"uti":/{u=$4} /"name":/{if(u!~/^dyn\./&&!s[u]++)print p u "\t." e " → " $4}'''}, description: "UTIs, comma-separated"}
      --schemes: {value: {exec: 'c=${COMP_LINE##*[ =]}; p=; case $c in *,*) p=${c%,*},;; esac; for a in /Applications/*.app /System/Applications/*.app ~/Applications/*.app; do plutil -extract CFBundleURLTypes json -o - "$a/Contents/Info.plist" 2>/dev/null | grep -o ''"CFBundleURLSchemes":\[[^]]*\]'' | grep -o ''"[^"]*"'' | grep -v CFBundle | tr -d ''"'' | sed "s|^|$p|; s|\$|	$(basename "$a" .app)|"; done'}, description: "URL schemes, comma-separated (http,https)"}
      --dry-run: {description: "Preview changes without applying"}
      --yes: {description: "Skip confirmation prompt"}
    args: {exec: 'dutix apps list -o json 2>/dev/null | awk -F''"'' ''/"name":/{n=$4} /"bundle_id":/{b=$4} /"path":/{k=$4;sub(/.*\//,"",k);sub(/\.app$/,"",k);print n"\t"b; if(k!=n)print k"\t"b}'''}
  apps:
    description: "List and inspect installed applications"
    commands:
      list:
        description: "List installed applications"
        flags:
          --filter: {value: any, description: "Filter by name or path (case-insensitive)"}
      show:
        description: "Show an app's bundle id, UTIs and URL schemes"
        args: {exec: 'dutix apps list -o json 2>/dev/null | awk -F''"'' ''/"name":/{n=$4} /"bundle_id":/{b=$4} /"path":/{k=$4;sub(/.*\//,"",k);sub(/\.app$/,"",k);print n"\t"b; if(k!=n)print k"\t"b}'''}
      migrate:
        description: "Move all file associations from one app to another"
        flags:
          --dry-run: {description: "Preview changes without applying"}
          --yes: {description: "Skip confirmation prompt"}
        args: {exec: 'dutix apps list -o json 2>/dev/null | awk -F''"'' ''/"name":/{n=$4} /"bundle_id":/{b=$4} /"path":/{k=$4;sub(/.*\//,"",k);sub(/\.app$/,"",k);print n"\t"b; if(k!=n)print k"\t"b}'''}
  targets:
    description: "List and inspect extensions, UTIs and URL schemes"
    commands:
      list:
        description: "List extensions with their UTI and default app"
        args: {exec: 'c=${COMP_LINE##*[ =]}; p=; case $c in *,*) p=${c%,*},;; esac; dutix targets list -o json 2>/dev/null | awk -F''"'' -v p="$p" ''/"extension":/{e=$4} /"uti":/{u=$4} /"name":/{if(e!="*")print p e "\t" u " → " $4}'''}
      show:
        description: "Show the default app for an extension, UTI or URL scheme"
        args: [{exec: 'c=${COMP_LINE##*[ =]}; p=; case $c in *,*) p=${c%,*},;; esac; dutix targets list -o json 2>/dev/null | awk -F''"'' -v p="$p" ''/"extension":/{e=$4} /"uti":/{u=$4} /"name":/{if(e!="*")print p e "\t" u " → " $4}'''}, {exec: 'c=${COMP_LINE##*[ =]}; p=; case $c in *,*) p=${c%,*},;; esac; dutix targets list -o json 2>/dev/null | awk -F''"'' -v p="$p" ''/"extension":/{e=$4} /"uti":/{u=$4} /"name":/{if(u!~/^dyn\./&&!s[u]++)print p u "\t." e " → " $4}'''}, {exec: 'c=${COMP_LINE##*[ =]}; p=; case $c in *,*) p=${c%,*},;; esac; for a in /Applications/*.app /System/Applications/*.app ~/Applications/*.app; do plutil -extract CFBundleURLTypes json -o - "$a/Contents/Info.plist" 2>/dev/null | grep -o ''"CFBundleURLSchemes":\[[^]]*\]'' | grep -o ''"[^"]*"'' | grep -v CFBundle | tr -d ''"'' | sed "s|^|$p|; s|\$|	$(basename "$a" .app)|"; done'}]
  version:
    description: "Print version information"
  completion:
    description: "Generate a shell completion script"
    args: [bash, zsh, fish, powershell]
  help:
    description: "Help about any command"
    args: "@subcommands"
examples:
  - key: 'markdown to VS Code'
    command: "dutix set \"Visual Studio Code\" --extensions md"
    description: "open .md files with VS Code"
  - key: 'browser'
    command: "dutix set Safari --schemes http,https"
    description: "make Safari the default browser"
  - key: 'preview first'
    command: "dutix set TextEdit --extensions txt,json --dry-run"
    description: "show what would change"
  - key: 'migrate'
    command: "dutix apps migrate TextEdit \"Visual Studio Code\""
    description: "move every association from one app to another"
  - key: 'who opens'
    command: "dutix targets show md"
    description: "default app for an extension, UTI or scheme"
  - key: 'app types'
    command: "dutix apps show Preview"
    description: "UTIs and URL schemes an app supports"

description: "Bash completion engine"
commands:
  bash:
    description: "Print the bash init script (use with eval)"
  list:
    description: "List commands that have a spec"
  check:
    description: "Validate a spec and print it as JSON"
    args: file
  cache:
    description: "Precompile big specs (> 100 KB) into the cache"
    args: {exec: "autocomplete list"}
  man:
    description: "Write a spec for a command from its man page"
    flags:
      -f: {description: "Overwrite an existing spec"}
    args: {exec: "compgen -c | sort -u"}
  alias:
    description: "Complete an alias like a command (NAME=CMD, symlinks its spec)"
    flags:
      -f: {description: "Overwrite an existing spec"}
    args: {exec: "autocomplete list | sed 's/$/=/'", nospace: true}

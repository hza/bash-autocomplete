version: '20261013'
description: "Claude Code: agentic coding in the terminal"
flags:
  --add-dir: {value: dir, description: "Additional directories to allow tool access to", repeat: true}
  --agent: {value: any, description: "Agent for the current session"}
  --agents: {value: any, description: "JSON object defining custom agents"}
  --allow-dangerously-skip-permissions: {description: "Make bypass-permissions mode available without defaulting to it"}
  --allowedTools: {value: any, description: "Tool names to allow (e.g. \"Bash(git *) Edit\")"}
  --allowed-tools: {value: any, description: "Tool names to allow (e.g. \"Bash(git *) Edit\")"}
  --append-system-prompt: {value: any, description: "Append to the default system prompt"}
  --ax-screen-reader: {description: "Screen-reader friendly output"}
  --bg: {description: "Start as a background agent and return immediately"}
  --background: {description: "Start as a background agent and return immediately"}
  --bare: {description: "Minimal mode: no hooks, plugins, memory, CLAUDE.md discovery"}
  --betas: {value: any, description: "Beta headers for API requests (API key users)"}
  --brief: {description: "Enable SendUserMessage tool"}
  --chrome: {description: "Enable Claude in Chrome integration"}
  --no-chrome: {description: "Disable Claude in Chrome integration"}
  -c: {description: "Continue the most recent conversation in this directory", show: always}
  --continue: {description: "Continue the most recent conversation in this directory"}
  --dangerously-skip-permissions: {description: "Bypass all permission checks (sandboxes only)"}
  -d: {value: any, description: "Debug mode with optional category filter (api,hooks)"}
  --debug: {value: any, description: "Debug mode with optional category filter (api,hooks)"}
  --debug-file: {value: file, description: "Write debug logs to this file"}
  --disable-slash-commands: {description: "Disable all skills"}
  --disallowedTools: {value: any, description: "Tool names to deny"}
  --disallowed-tools: {value: any, description: "Tool names to deny"}
  --effort: {value: {enum: [low, medium, high, xhigh, max]}, description: "Effort level for the session"}
  --exclude-dynamic-system-prompt-sections: {description: "Move per-machine prompt sections into the first message"}
  --fallback-model: {value: {enum: [fable, opus, sonnet, haiku]}, description: "Fallback model(s) when overloaded (--print only)"}
  --file: {value: any, description: "File resources to download: file_id:relative_path"}
  --fork-session: {description: "New session ID when resuming (with -r/-c)"}
  --from-pr: {value: any, description: "Resume a session linked to a PR number/URL"}
  -h: {description: "Display help"}
  --help: {description: "Display help"}
  --ide: {description: "Connect to the IDE on startup"}
  --include-hook-events: {description: "Hook events in stream-json output"}
  --include-partial-messages: {description: "Partial message chunks in stream-json output"}
  --input-format: {value: {enum: [text, stream-json]}, description: "Input format (--print only)"}
  --json-schema: {value: any, description: "JSON Schema for structured output"}
  --max-budget-usd: {value: any, description: "Maximum dollars to spend (--print only)"}
  --mcp-config: {value: {file: "*.json"}, description: "Load MCP servers from JSON files or strings"}
  --model: {value: {enum: [fable, opus, sonnet, haiku, claude-fable-5-1, claude-opus-5-5, claude-sonnet-5-5, claude-haiku-5-5]}, description: "Model for the session"}
  -n: {value: any, description: "Display name for this session"}
  --name: {value: any, description: "Display name for this session"}
  --no-session-persistence: {description: "Don't save the session (--print only)"}
  --output-format: {value: {enum: [text, json, stream-json]}, description: "Output format (--print only)"}
  --permission-mode: {value: {enum: [acceptEdits, auto, bypassPermissions, default, dontAsk, plan]}, description: "Permission mode for the session"}
  --plugin-dir: {value: dir, description: "Load a plugin from a directory or .zip", repeat: true}
  --plugin-url: {value: any, description: "Fetch a plugin .zip from a URL", repeat: true}
  -p: {description: "Print response and exit (non-interactive)", show: always}
  --print: {description: "Print response and exit (non-interactive)"}
  --prompt-suggestions: {value: {enum: ['true', 'false']}, description: "Enable prompt suggestions"}
  --remote-control: {value: any, description: "Interactive session with Remote Control"}
  --remote-control-session-name-prefix: {value: any, description: "Prefix for Remote Control session names"}
  --replay-user-messages: {description: "Re-emit user messages on stdout (stream-json)"}
  -r: {value: any, description: "Resume a conversation by ID, or open the picker", show: always}
  --resume: {value: any, description: "Resume a conversation by ID, or open the picker"}
  --safe-mode: {description: "Start with all customizations disabled"}
  --session-id: {value: any, description: "Use a specific session UUID"}
  --setting-sources: {value: {enum: [user, project, local, 'user,project', 'user,project,local']}, description: "Setting sources to load"}
  --settings: {value: {file: "*.json"}, description: "Settings JSON file or string"}
  --strict-mcp-config: {description: "Only use MCP servers from --mcp-config"}
  --system-prompt: {value: any, description: "System prompt for the session"}
  --tmux: {description: "Create a tmux session for the worktree (with -w)"}
  --tools: {value: any, description: "Built-in tools to enable (\"\" none, default, Bash,Edit,Read)"}
  --verbose: {description: "Override verbose mode setting"}
  -v: {description: "Print the version"}
  --version: {description: "Print the version"}
  -w: {value: any, description: "Run in a new git worktree (optional name)", show: always}
  --worktree: {value: any, description: "Run in a new git worktree (optional name)"}
args: any
commands:
  agents:
    description: "Manage background agents"
    flags:
      --all: {description: "With --json: include completed sessions"}
      --cwd: {value: dir, description: "Only sessions started under this path"}
      --json: {description: "Print active sessions as JSON and exit"}
  auth:
    description: "Manage authentication"
    commands:
      login: {description: "Sign in to your Anthropic account"}
      logout: {description: "Log out from your Anthropic account"}
      status: {description: "Show authentication status"}
  auto-mode: {description: "Inspect auto mode classifier configuration"}
  doctor: {description: "Check the health of the installation and auto-updater"}
  install:
    description: "Install Claude Code native build"
    args: {enum: [stable, latest]}
    flags:
      --force: {description: "Force reinstall"}
  mcp:
    description: "Configure and manage MCP servers"
    commands:
      add:
        description: "Add an MCP server"
        flags:
          --callback-port: {value: any, description: "Fixed port for the OAuth callback"}
          --client-id: {value: any, description: "OAuth client ID for HTTP/SSE servers"}
          --client-secret: {description: "Prompt for the OAuth client secret"}
          -e: {value: any, description: "Set environment variables (KEY=value)", repeat: true}
          --env: {value: any, description: "Set environment variables (KEY=value)", repeat: true}
          -H: {value: any, description: "Set headers (\"X-Api-Key: abc\")", repeat: true}
          --header: {value: any, description: "Set headers (\"X-Api-Key: abc\")", repeat: true}
          -s: {value: {enum: [local, user, project]}, description: "Configuration scope (default local)"}
          --scope: {value: {enum: [local, user, project]}, description: "Configuration scope (default local)"}
          -t: {value: {enum: [stdio, sse, http]}, description: "Transport type (default stdio)"}
          --transport: {value: {enum: [stdio, sse, http]}, description: "Transport type (default stdio)"}
        args: any
      add-from-claude-desktop:
        description: "Import MCP servers from Claude Desktop"
        flags:
          -s: {value: {enum: [local, user, project]}, description: "Configuration scope"}
          --scope: {value: {enum: [local, user, project]}, description: "Configuration scope"}
      add-json:
        description: "Add an MCP server with a JSON string"
        flags:
          -s: {value: {enum: [local, user, project]}, description: "Configuration scope"}
          --scope: {value: {enum: [local, user, project]}, description: "Configuration scope"}
      get: {description: "Details about an MCP server"}
      list: {description: "List configured MCP servers (health-checked)"}
      login: {description: "Authenticate with an MCP server"}
      logout: {description: "Clear stored OAuth credentials for an MCP server"}
      remove:
        description: "Remove an MCP server"
        flags:
          -s: {value: {enum: [local, user, project]}, description: "Configuration scope"}
          --scope: {value: {enum: [local, user, project]}, description: "Configuration scope"}
      reset-project-choices: {description: "Reset approved/rejected .mcp.json servers"}
      serve: {description: "Start Claude Code as an MCP server"}
  plugin:
    description: "Manage Claude Code plugins"
    aliases: [plugins]
    commands:
      details: {description: "Component inventory and token cost of a plugin"}
      disable: {description: "Disable an enabled plugin"}
      enable: {description: "Enable a disabled plugin"}
      init: {description: "Scaffold a new plugin in ~/.claude/skills/<name>/", aliases: [new]}
      install: {description: "Install a plugin (plugin@marketplace)", aliases: [i]}
      list: {description: "List installed plugins"}
      marketplace:
        description: "Manage marketplaces"
        commands:
          add: {description: "Add a marketplace (GitHub repo, URL or path)", args: any}
          list: {description: "List marketplaces"}
          remove: {description: "Remove a marketplace"}
          update: {description: "Update marketplace(s)"}
      prune: {description: "Remove unneeded auto-installed dependencies", aliases: [autoremove]}
      tag: {description: "Create a {name}--v{version} release tag", args: dir}
      uninstall: {description: "Uninstall a plugin", aliases: [remove]}
      update: {description: "Update a plugin (restart to apply)"}
      validate: {description: "Validate a plugin or marketplace manifest", args: dir}
  project:
    description: "Manage Claude Code project state"
    commands:
      purge: {description: "Delete all Claude Code state for a project", args: dir}
  setup-token: {description: "Set up a long-lived auth token (subscription)"}
  ultrareview: {description: "Cloud multi-agent code review of the branch / PR"}
  update: {description: "Check for updates and install", aliases: [upgrade]}
snippets:
  - key: p
    mark: "1"
    command: "claude --permission-mode plan -p \"\""
    description: "plan mode: read and propose, no edits"
  - key: g
    mark: "2"
    command: "claude -c --permission-mode acceptEdits -p \"go ahead with the plan\""
    description: "accept the plan from @p and let it make the edits"
  - key: a
    mark: pin
    command: "claude --permission-mode acceptEdits -p \"\""
    description: "auto-accept file edits"
  - key: c
    mark: lock
    command: "claude -c"
    description: "continue the last conversation in this folder"
  - key: r
    mark: lock
    command: "claude -r"
    description: "pick a past conversation to resume"
  - key: w
    mark: lock
    command: "claude -w feature-x"
    description: "work in a new git worktree"
  - key: t
    mark: lock
    command: "claude -w feature-x --tmux"
    description: "worktree in its own tmux session"
  - key: k
    mark: lock
    command: "claude --fork-session -c"
    description: "branch off the last conversation"
  - key: u
    mark: lock
    command: "claude --from-pr 123"
    description: "resume the session linked to a PR"
  - key: z
    mark: lock
    command: "claude --safe-mode"
    description: "start without any customizations (debug config)"
  - key: v
    mark: lock
    command: "claude -d api,hooks"
    description: "debug output for API and hooks"
  - key: n
    mark: pin
    command: "claude -p \"explain this project\""
    description: "one-shot answer, print and exit"
  - key: e
    mark: pin
    command: "git diff | claude -p \"review this diff for bugs\""
    description: "pipe a diff in for a quick review"
  - key: l
    command: "tail -200 error.log | claude -p \"why is this failing?\""
    description: "pipe a log in and ask about it"
  - key: m
    command: "git diff --cached | claude -p \"write a one-line commit message\""
    description: "commit message from staged changes"
  - key: j
    command: "claude -p --output-format json \"summarize README.md\" | jq -r .result"
    description: "JSON result for scripts"
  - key: s
    command: "claude -p --output-format stream-json --verbose \"run the tests\""
    description: "stream events as JSON lines"
  - key: o
    command: "claude --model opus -p \"\""
    description: "start with Opus"
  - key: h
    command: "claude --model haiku -p \"\""
    description: "quick cheap one-shot with Haiku"
  - key: y
    command: "claude --dangerously-skip-permissions -p \"\""
    description: "no permission prompts (sandboxes only)"
  - key: b
    command: "claude --bg \"fix the failing tests\""
    description: "background agent, returns immediately"
  - key: d
    command: "claude --add-dir ../shared -p \"\""
    description: "also allow access to another folder"
  - key: x
    command: "claude --allowedTools \"Bash(git *) Edit Read\" -p \"\""
    description: "pre-approve specific tools"
  - key: m
    command: "claude --bare -p \"\""
    description: "minimal mode: no hooks, plugins or CLAUDE.md"
  - key: i
    mark: globe
    command: "claude mcp add --transport http NAME https://example.com/mcp"
    description: "add a remote HTTP MCP server"
  - key: "1"
    mark: globe
    command: "claude mcp add -s user NAME -- npx -y PACKAGE"
    description: "add a stdio MCP server for all projects"
  - key: "2"
    mark: globe
    command: "claude mcp list"
    description: "list MCP servers and their health"
  - key: "3"
    mark: package
    command: "claude plugin marketplace add OWNER/REPO"
    description: "add a plugin marketplace from GitHub"
  - key: "4"
    mark: package
    command: "claude plugin install NAME@MARKETPLACE"
    description: "install a plugin"

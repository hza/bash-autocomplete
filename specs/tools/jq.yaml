description: "Command-line JSON processor"
flags:
  -n: {description: "Use null as the single input value"}
  --null-input: {description: "Use null as the single input value"}
  -R: {description: "Read each line as a string, not JSON"}
  --raw-input: {description: "Read each line as a string, not JSON"}
  -s: {description: "Read all inputs into one array"}
  --slurp: {description: "Read all inputs into one array"}
  -c: {description: "Compact output"}
  --compact-output: {description: "Compact output"}
  -r: {description: "Output raw strings, no quotes"}
  --raw-output: {description: "Output raw strings, no quotes"}
  --raw-output0: {description: "Raw output, NUL after each output"}
  -j: {description: "Raw output without newlines"}
  --join-output: {description: "Raw output without newlines"}
  -a: {description: "ASCII-only output"}
  --ascii-output: {description: "ASCII-only output"}
  -S: {description: "Sort object keys"}
  --sort-keys: {description: "Sort object keys"}
  -C: {description: "Colorize output"}
  --color-output: {description: "Colorize output"}
  -M: {description: "Disable colored output"}
  --monochrome-output: {description: "Disable colored output"}
  --tab: {description: "Indent with tabs"}
  --indent: {value: any, description: "Indent with n spaces (max 7)"}
  --unbuffered: {description: "Flush output after each output"}
  --stream: {description: "Parse input in streaming fashion"}
  --stream-errors: {description: "Stream and report parse errors as arrays"}
  --seq: {description: "Use application/json-seq"}
  -f: {value: file, description: "Load filter from file"}
  --from-file: {value: file, description: "Load filter from file"}
  -L: {value: dir, description: "Search modules in directory"}
  --arg: {value: any, description: "Set $name to string: name value"}
  --argjson: {value: any, description: "Set $name to JSON: name value"}
  --slurpfile: {value: any, description: "Set $name to JSON array from file: name file"}
  --rawfile: {value: any, description: "Set $name to file contents: name file"}
  --args: {description: "Remaining arguments are string values"}
  --jsonargs: {description: "Remaining arguments are JSON values"}
  -e: {description: "Exit status from last output"}
  --exit-status: {description: "Exit status from last output"}
  -V: {description: "Show the version"}
  --version: {description: "Show the version"}
  --build-configuration: {description: "Show build configuration"}
  -h: {description: "Show help"}
  --help: {description: "Show help"}
args: file
snippets:
  - key: p
    mark: pushpin
    command: "jq . data.json"
    description: "pretty-print"
  - key: f
    mark: pushpin
    command: "jq -r '.name' data.json"
    description: "one field as raw text (no quotes)"
  - key: a
    mark: pushpin
    command: "jq '.items[] | {id, name}' data.json"
    description: "pick fields from every array element"
  - key: s
    mark: pushpin
    command: "jq '.items[] | select(.status == \"active\")' data.json"
    description: "filter array elements"
  - key: l
    command: "jq '.items | length' data.json"
    description: "count elements"
  - key: k
    command: "jq 'keys' data.json"
    description: "top-level keys"
  - key: c
    command: "jq -r '.items[] | [.id, .name] | @csv' data.json"
    description: "array of objects to CSV"
  - key: v
    command: "jq --arg n \"$USER\" '.items[] | select(.owner == $n)' data.json"
    description: "use a shell variable safely"
  - key: m
    command: "jq '.version = \"2.0\"' data.json > tmp.json && mv tmp.json data.json"
    description: "change a value and save"
  - key: o
    command: "jq -c '.items[]' data.json"
    description: "one compact object per line"
  - key: t
    command: "jq -s 'add' a.json b.json"
    description: "merge arrays from several files"
  - key: g
    command: "jq 'group_by(.status) | map({status: .[0].status, n: length})' data.json"
    description: "count per value"

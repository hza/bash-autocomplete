flags:
  -am: {description: "Also build projects required by the -pl list"}
  --also-make: {description: "Also build projects required by the -pl list"}
  -amd: {description: "Also build projects that depend on the -pl list"}
  --also-make-dependents: {description: "Also build projects that depend on the -pl list"}
  -B: {description: "Run in non-interactive (batch) mode"}
  --batch-mode: {description: "Run in non-interactive (batch) mode"}
  -b: {value: any, description: "Build strategy id"}
  --builder: {value: any, description: "Build strategy id"}
  -C: {description: "Fail the build if checksums don't match"}
  --strict-checksums: {description: "Fail the build if checksums don't match"}
  -c: {description: "Warn if checksums don't match"}
  --lax-checksums: {description: "Warn if checksums don't match"}
  --color: {value: {exec: "printf 'auto\\nalways\\nnever\\n'"}, description: "Output color mode"}
  -D: {value: any, description: "Define a user property"}
  --define: {value: any, description: "Define a user property"}
  -DskipTests: {description: "Compile tests but don't run them"}
  '-Dmaven.test.skip=true': {description: "Skip compiling and running tests"}
  -DskipITs: {description: "Skip integration tests (failsafe)"}
  '-Dtest=': {description: "Run only the given test class/method"}
  '-Dit.test=': {description: "Run only the given integration test"}
  '-DfailIfNoTests=false': {description: "Don't fail when -Dtest matches nothing"}
  '-Dsurefire.failIfNoSpecifiedTests=false': {description: "Don't fail when -Dtest matches nothing in a module"}
  '-Dmaven.javadoc.skip=true': {description: "Skip Javadoc generation"}
  '-Dmaven.source.skip=true': {description: "Skip source jar"}
  -Dgpg.skip: {description: "Skip GPG signing"}
  -Dcheckstyle.skip: {description: "Skip Checkstyle"}
  '-Dspotless.check.skip=true': {description: "Skip Spotless check"}
  '-Dpmd.skip=true': {description: "Skip PMD"}
  '-Dspotbugs.skip=true': {description: "Skip SpotBugs"}
  '-Djacoco.skip=true': {description: "Skip JaCoCo"}
  '-Denforcer.skip=true': {description: "Skip Maven Enforcer"}
  -Dmaven.main.skip: {description: "Skip main compilation"}
  '-DdownloadSources=true': {description: "Download source jars"}
  '-DdownloadJavadocs=true': {description: "Download javadoc jars"}
  '-DnewVersion=': {description: "New version for versions:set"}
  '-DgenerateBackupPoms=false': {description: "No pom.xml.versionsBackup (versions plugin)"}
  '-Dspring-boot.run.profiles=': {description: "Spring profiles for spring-boot:run"}
  '-Dspring-boot.run.jvmArguments=': {description: "JVM args for spring-boot:run"}
  '-Dexec.mainClass=': {description: "Main class for exec:java"}
  '-Dexec.args=': {description: "Program arguments for exec:java"}
  '-Dexpression=': {description: "Expression for help:evaluate"}
  -DforceStdout: {description: "Print only the value (help:evaluate)"}
  -e: {description: "Produce execution error messages"}
  --errors: {description: "Produce execution error messages"}
  -emp: {value: any, description: "Encrypt master security password"}
  --encrypt-master-password: {value: any, description: "Encrypt master security password"}
  -ep: {value: any, description: "Encrypt server password"}
  --encrypt-password: {value: any, description: "Encrypt server password"}
  -f: {value: file, description: "Alternate POM file (or directory with pom.xml)"}
  --file: {value: file, description: "Alternate POM file (or directory with pom.xml)"}
  -fae: {description: "Fail the build only at the end"}
  --fail-at-end: {description: "Fail the build only at the end"}
  -ff: {description: "Stop at first failure in reactor builds"}
  --fail-fast: {description: "Stop at first failure in reactor builds"}
  -fn: {description: "Never fail the build"}
  --fail-never: {description: "Never fail the build"}
  -gs: {value: file, description: "Alternate global settings file"}
  --global-settings: {value: file, description: "Alternate global settings file"}
  -gt: {value: file, description: "Alternate global toolchains file"}
  --global-toolchains: {value: file, description: "Alternate global toolchains file"}
  -h: {description: "Display help information"}
  --help: {description: "Display help information"}
  -itr: {description: "Ignore repositories from transitive dependencies"}
  --ignore-transitive-repositories: {description: "Ignore repositories from transitive dependencies"}
  -l: {value: file, description: "Log file for all build output"}
  --log-file: {value: file, description: "Log file for all build output"}
  -N: {description: "Do not recurse into sub-projects"}
  --non-recursive: {description: "Do not recurse into sub-projects"}
  -nsu: {description: "Suppress SNAPSHOT updates"}
  --no-snapshot-updates: {description: "Suppress SNAPSHOT updates"}
  -ntp: {description: "Do not display transfer progress"}
  --no-transfer-progress: {description: "Do not display transfer progress"}
  -o: {description: "Work offline"}
  --offline: {description: "Work offline"}
  -P: {value: {exec: "tr -d '\\n' < pom.xml | grep -o '<profile>[[:space:]]*<id>[^<]*' | sed 's/.*<id>//'"}, description: "Comma-delimited list of profiles to activate"}
  --activate-profiles: {value: {exec: "tr -d '\\n' < pom.xml | grep -o '<profile>[[:space:]]*<id>[^<]*' | sed 's/.*<id>//'"}, description: "Comma-delimited list of profiles to activate"}
  -pl: {value: {exec: "grep -o '<module>[^<]*' pom.xml | sed 's/<module>//'"}, description: "Comma-delimited list of reactor projects to build"}
  --projects: {value: {exec: "grep -o '<module>[^<]*' pom.xml | sed 's/<module>//'"}, description: "Comma-delimited list of reactor projects to build"}
  -q: {description: "Quiet output, only show errors"}
  --quiet: {description: "Quiet output, only show errors"}
  -rf: {value: {exec: "grep -o '<module>[^<]*' pom.xml | sed 's/<module>//'"}, description: "Resume reactor from specified project"}
  --resume-from: {value: {exec: "grep -o '<module>[^<]*' pom.xml | sed 's/<module>//'"}, description: "Resume reactor from specified project"}
  -s: {value: file, description: "Alternate user settings file"}
  --settings: {value: file, description: "Alternate user settings file"}
  -t: {value: file, description: "Alternate user toolchains file"}
  --toolchains: {value: file, description: "Alternate user toolchains file"}
  -T: {value: any, description: "Thread count, e.g. 4 or 1C"}
  --threads: {value: any, description: "Thread count, e.g. 4 or 1C"}
  -U: {description: "Force update of missing releases and snapshots"}
  --update-snapshots: {description: "Force update of missing releases and snapshots"}
  -v: {description: "Display version information"}
  --version: {description: "Display version information"}
  -V: {description: "Display version information and continue the build"}
  --show-version: {description: "Display version information and continue the build"}
  -X: {description: "Produce execution debug output"}
  --debug: {description: "Produce execution debug output"}
args: "@subcommands"
commands:
  validate:
    description: "Validate the project is correct"
    args: "@subcommands"
  compile:
    description: "Compile the source code"
    args: "@subcommands"
  test:
    description: "Run unit tests"
    args: "@subcommands"
  package:
    description: "Package compiled code (jar, war...)"
    args: "@subcommands"
  verify:
    description: "Run integration test checks"
    args: "@subcommands"
  install:
    description: "Install the package into the local repository"
    args: "@subcommands"
  deploy:
    description: "Copy the package to the remote repository"
    args: "@subcommands"
  clean:
    description: "Remove previous build output"
    args: "@subcommands"
  site:
    description: "Generate project site documentation"
    args: "@subcommands"
  initialize:
    description: "Initialize build state"
    args: "@subcommands"
  generate-sources:
    description: "Generate source code"
    args: "@subcommands"
  process-resources:
    description: "Copy resources to the output dir"
    args: "@subcommands"
  test-compile:
    description: "Compile test sources"
    args: "@subcommands"
  integration-test:
    description: "Run integration tests"
    args: "@subcommands"
  dependency:tree:
    description: "Display the dependency tree"
    args: "@subcommands"
  dependency:resolve:
    description: "Resolve all dependencies"
    args: "@subcommands"
  dependency:analyze:
    description: "Analyze used/declared dependencies"
    args: "@subcommands"
  dependency:go-offline:
    description: "Download everything for offline use"
    args: "@subcommands"
  dependency:purge-local-repository:
    description: "Remove project dependencies from local repo"
    args: "@subcommands"
  dependency:copy-dependencies:
    description: "Copy dependencies to target/dependency"
    args: "@subcommands"
  help:effective-pom:
    description: "Display the effective POM"
    args: "@subcommands"
  help:effective-settings:
    description: "Display effective settings"
    args: "@subcommands"
  help:active-profiles:
    description: "List active profiles"
    args: "@subcommands"
  help:describe:
    description: "Describe a plugin or goal"
    args: "@subcommands"
  help:evaluate:
    description: "Evaluate a Maven expression"
    args: "@subcommands"
  versions:set:
    description: "Set the project version"
    args: "@subcommands"
  versions:display-dependency-updates:
    description: "Show newer dependency versions"
    args: "@subcommands"
  versions:display-plugin-updates:
    description: "Show newer plugin versions"
    args: "@subcommands"
  exec:java:
    description: "Run a Java main class"
    args: "@subcommands"
  archetype:generate:
    description: "Generate a project from an archetype"
    args: "@subcommands"
  release:prepare:
    description: "Prepare a release"
    args: "@subcommands"
  release:perform:
    description: "Perform a release"
    args: "@subcommands"
  wrapper:wrapper:
    description: "Add the Maven wrapper to the project"
    args: "@subcommands"
  spring-boot:run:
    description: "Run a Spring Boot application"
    when: {file: pom.xml, contains: "<artifactId>spring-boot-maven-plugin</artifactId>"}
    args: "@subcommands"
  spring-boot:build-image:
    description: "Build an OCI image of the application"
    when: {file: pom.xml, contains: "<artifactId>spring-boot-maven-plugin</artifactId>"}
    args: "@subcommands"
  spring-boot:repackage:
    description: "Repackage as an executable jar/war"
    when: {file: pom.xml, contains: "<artifactId>spring-boot-maven-plugin</artifactId>"}
    args: "@subcommands"
  spotless:apply:
    description: "Reformat code (Spotless)"
    when: {file: pom.xml, contains: "<artifactId>spotless-maven-plugin</artifactId>"}
    args: "@subcommands"
  spotless:check:
    description: "Check code formatting (Spotless)"
    when: {file: pom.xml, contains: "<artifactId>spotless-maven-plugin</artifactId>"}
    args: "@subcommands"
  checkstyle:check:
    description: "Fail the build on Checkstyle violations"
    when: {file: pom.xml, contains: "<artifactId>maven-checkstyle-plugin</artifactId>"}
    args: "@subcommands"
  checkstyle:checkstyle:
    description: "Generate a Checkstyle report"
    when: {file: pom.xml, contains: "<artifactId>maven-checkstyle-plugin</artifactId>"}
    args: "@subcommands"
  pmd:check:
    description: "Fail the build on PMD violations"
    when: {file: pom.xml, contains: "<artifactId>maven-pmd-plugin</artifactId>"}
    args: "@subcommands"
  pmd:pmd:
    description: "Generate a PMD report"
    when: {file: pom.xml, contains: "<artifactId>maven-pmd-plugin</artifactId>"}
    args: "@subcommands"
  pmd:cpd-check:
    description: "Fail the build on duplicated code"
    when: {file: pom.xml, contains: "<artifactId>maven-pmd-plugin</artifactId>"}
    args: "@subcommands"
  spotbugs:check:
    description: "Fail the build on SpotBugs findings"
    when: {file: pom.xml, contains: "<artifactId>spotbugs-maven-plugin</artifactId>"}
    args: "@subcommands"
  spotbugs:spotbugs:
    description: "Run SpotBugs analysis"
    when: {file: pom.xml, contains: "<artifactId>spotbugs-maven-plugin</artifactId>"}
    args: "@subcommands"
  spotbugs:gui:
    description: "Open SpotBugs GUI"
    when: {file: pom.xml, contains: "<artifactId>spotbugs-maven-plugin</artifactId>"}
    args: "@subcommands"
  jacoco:report:
    description: "Generate a JaCoCo coverage report"
    when: {file: pom.xml, contains: "<artifactId>jacoco-maven-plugin</artifactId>"}
    args: "@subcommands"
  jacoco:check:
    description: "Check coverage thresholds"
    when: {file: pom.xml, contains: "<artifactId>jacoco-maven-plugin</artifactId>"}
    args: "@subcommands"
  jib:build:
    description: "Build and push an image (Jib)"
    when: {file: pom.xml, contains: "<artifactId>jib-maven-plugin</artifactId>"}
    args: "@subcommands"
  jib:dockerBuild:
    description: "Build an image to the Docker daemon (Jib)"
    when: {file: pom.xml, contains: "<artifactId>jib-maven-plugin</artifactId>"}
    args: "@subcommands"
  flyway:migrate:
    description: "Apply database migrations"
    when: {file: pom.xml, contains: "<artifactId>flyway-maven-plugin</artifactId>"}
    args: "@subcommands"
  flyway:info:
    description: "Show migration status"
    when: {file: pom.xml, contains: "<artifactId>flyway-maven-plugin</artifactId>"}
    args: "@subcommands"
  flyway:clean:
    description: "Drop all objects in the schemas"
    when: {file: pom.xml, contains: "<artifactId>flyway-maven-plugin</artifactId>"}
    args: "@subcommands"
  quarkus:dev:
    description: "Run Quarkus in dev mode"
    when: {file: pom.xml, contains: "<artifactId>quarkus-maven-plugin</artifactId>"}
    args: "@subcommands"
  quarkus:build:
    description: "Build the Quarkus application"
    when: {file: pom.xml, contains: "<artifactId>quarkus-maven-plugin</artifactId>"}
    args: "@subcommands"

description: GitHub CLI
flags:
  --help: {description: "Show help", show: always}
  -R:
    show: always
    value: {exec: "gh repo list --limit 200 --json nameWithOwner,description --jq '.[] | \"\\(.nameWithOwner)\\t\\(.description // \"\")\"' 2>/dev/null"}
    description: "Select another repository using the [HOST/]OWNER/REPO format"
  --repo:
    show: always
    value: {exec: "gh repo list --limit 200 --json nameWithOwner,description --jq '.[] | \"\\(.nameWithOwner)\\t\\(.description // \"\")\"' 2>/dev/null"}
    description: "Select another repository using the [HOST/]OWNER/REPO format"
  --hostname:
    value: any
    description: "The hostname of the GitHub instance to authenticate with"
commands:
  pr:
    description: Manage pull requests
    flags:
      -R: {value: any, description: "Select another repository"}
      --repo: {value: any, description: "Select another repository"}
    commands:
      list:
        description: List pull requests in a repository
        flags:
          -a: {value: any, description: "Filter by assignee"}
          --assignee: {value: any, description: "Filter by assignee"}
          -A: {value: any, description: "Filter by author"}
          --author: {value: any, description: "Filter by author"}
          -B: {value: {exec: "git for-each-ref --format='%(refname:short)' refs/heads refs/tags 2>/dev/null", tree: true}, description: "Filter by base branch"}
          --base: {value: {exec: "git for-each-ref --format='%(refname:short)' refs/heads refs/tags 2>/dev/null", tree: true}, description: "Filter by base branch"}
          -H: {value: {exec: "git for-each-ref --format='%(refname:short)' refs/heads refs/tags 2>/dev/null", tree: true}, description: "Filter by head branch"}
          --head: {value: {exec: "git for-each-ref --format='%(refname:short)' refs/heads refs/tags 2>/dev/null", tree: true}, description: "Filter by head branch"}
          -l: {value: {exec: "gh label list --limit 200 --json name,description --jq '.[] | \"\\(.name)\\t\\(.description)\"' 2>/dev/null"}, description: "Filter by label"}
          --label: {value: {exec: "gh label list --limit 200 --json name,description --jq '.[] | \"\\(.name)\\t\\(.description)\"' 2>/dev/null"}, description: "Filter by label"}
          -L: {value: any, description: "Maximum number of results"}
          --limit: {value: any, description: "Maximum number of results"}
          -s: {value: any, description: "Filter by state: {open|closed|merged|all}"}
          --state: {value: any, description: "Filter by state: {open|closed|merged|all}"}
          --json: {value: any, description: "Output JSON with specified fields"}
          --jq: {value: any, description: "Filter JSON output using a jq expression"}
      view:
        description: View a pull request
        flags:
          -w: {description: "Open PR in the browser", show: always}
          --web: {description: "Open PR in the browser", show: always}
          --json: {value: any, description: "Output JSON with specified fields"}
          --jq: {value: any, description: "Filter JSON output using a jq expression"}
          --comments: {description: "View pull request comments", show: always}
        args:
          exec: "gh pr list --json number,title --jq '.[] | \"\\(.number)\\t\\(.title)\"' 2>/dev/null"
      checkout:
        description: Check out a pull request in git
        flags:
          -b: {value: any, description: "Local branch name to use"}
          --branch: {value: any, description: "Local branch name to use"}
          --detach: {description: "Checkout PR with a detached HEAD"}
          -f: {description: "Reset the existing local branch to the latest state of the pull request"}
          --force: {description: "Reset the existing local branch to the latest state of the pull request"}
          --recurse-submodules: {description: "Update all active submodules"}
        args:
          exec: "gh pr list --json number,title --jq '.[] | \"\\(.number)\\t\\(.title)\"' 2>/dev/null"
      create:
        description: Create a pull request
        flags:
          -B: {value: any, description: "The branch into which you want your code merged"}
          --base: {value: any, description: "The branch into which you want your code merged"}
          -H: {value: any, description: "The branch that contains commits for your pull request"}
          --head: {value: any, description: "The branch that contains commits for your pull request"}
          -t: {value: any, description: "Title"}
          --title: {value: any, description: "Title"}
          -b: {value: any, description: "Body"}
          --body: {value: any, description: "Body"}
          -F: {value: file, description: "Read body text from file"}
          --body-file: {value: file, description: "Read body text from file"}
          -d: {description: "Mark pull request as a draft"}
          --draft: {description: "Mark pull request as a draft"}
          -f: {description: "Do not prompt for title/body and just use commit info"}
          --fill: {description: "Do not prompt for title/body and just use commit info"}
          --fill-first: {description: "Do not prompt for title/body, use first commit info only"}
          -l: {value: any, description: "Add labels by name"}
          --label: {value: any, description: "Add labels by name"}
          -a: {value: any, description: "Assign people by their login"}
          --assignee: {value: any, description: "Assign people by their login"}
          -r: {value: any, description: "Request reviews from people or teams by their handle"}
          --reviewer: {value: any, description: "Request reviews from people or teams by their handle"}
          -m: {value: any, description: "Add the pull request to a milestone by name"}
          --milestone: {value: any, description: "Add the pull request to a milestone by name"}
          -w: {description: "Open the browser after creating the pull request"}
          --web: {description: "Open the browser after creating the pull request"}
      merge:
        description: Merge a pull request
        flags:
          --auto: {description: "Automatically merge only after necessary requirements are met", show: always}
          --disable-auto: {description: "Disable auto-merge for this pull request"}
          -d: {description: "Delete the local and remote branch after merge"}
          --delete-branch: {description: "Delete the local and remote branch after merge"}
          -m: {value: any, description: "Merge commit message", show: always}
          --merge-strategy: {value: any, description: "The merge strategy to use"}
          --squash: {description: "Squash the commits into one commit and merge it into the base branch", show: always}
          --rebase: {description: "Rebase the commits onto the base branch and fast-forward", show: always}
          --merge: {description: "Merge the commits with a merge commit", show: always}
          -t: {value: any, description: "Title text of the merge commit"}
          -b: {value: any, description: "Body text of the merge commit"}
          -F: {value: file, description: "Read merge body text from file"}
          --admin: {description: "Use administrator privileges to merge a pull request that does not meet requirements", show: always}
        args:
          exec: "gh pr list --json number,title --jq '.[] | \"\\(.number)\\t\\(.title)\"' 2>/dev/null"
      close:
        description: Close a pull request
        flags:
          --comment: {value: any, description: "Leave a closing comment"}
          -d: {description: "Delete the local and remote branch after close"}
          --delete-branch: {description: "Delete the local and remote branch after close"}
        args:
          exec: "gh pr list --json number,title --jq '.[] | \"\\(.number)\\t\\(.title)\"' 2>/dev/null"
      reopen:
        description: Reopen a pull request
        flags:
          --comment: {value: any, description: "Add a reopening comment"}
        args:
          exec: "gh pr list --state closed --json number,title --jq '.[] | \"\\(.number)\\t\\(.title)\"' 2>/dev/null"
      review:
        description: Add a review to a pull request
        flags:
          -a: {description: "Approve pull request", show: always}
          --approve: {description: "Approve pull request", show: always}
          -r: {description: "Request changes on a pull request"}
          --request-changes: {description: "Request changes on a pull request"}
          -c: {description: "Leave a review comment without approving or requesting changes"}
          --comment: {description: "Leave a review comment without approving or requesting changes"}
          -b: {value: any, description: "Specify the body of a review"}
          --body: {value: any, description: "Specify the body of a review"}
          -F: {value: file, description: "Read body text from file"}
          --body-file: {value: file, description: "Read body text from file"}
        args:
          exec: "gh pr list --json number,title --jq '.[] | \"\\(.number)\\t\\(.title)\"' 2>/dev/null"
      diff:
        description: View changes in a pull request
        flags:
          --patch: {description: "Display diff as a git patch"}
          -w: {description: "Open the browser to view the diff"}
          --web: {description: "Open the browser to view the diff"}
          --name-only: {description: "Display only names of changed files"}
        args:
          exec: "gh pr list --json number,title --jq '.[] | \"\\(.number)\\t\\(.title)\"' 2>/dev/null"
      checks:
        description: Show CI status for a single pull request
        flags:
          --interval: {value: any, description: "Refresh interval in seconds when using --watch"}
          --watch: {description: "Watch checks until all checks complete", show: always}
          --fail-fast: {description: "Exit watch mode on first check failure"}
          -w: {description: "Open the browser to show details about checks"}
          --web: {description: "Open the browser to show details about checks"}
        args:
          exec: "gh pr list --json number,title --jq '.[] | \"\\(.number)\\t\\(.title)\"' 2>/dev/null"
      edit:
        description: Edit a pull request
        flags:
          --add-assignee: {value: any, description: "Add assigned users by their login"}
          --remove-assignee: {value: any, description: "Remove assigned users by their login"}
          --add-label: {value: {exec: "gh label list --limit 200 --json name,description --jq '.[] | \"\\(.name)\\t\\(.description)\"' 2>/dev/null"}, description: "Add labels by name"}
          --remove-label: {value: {exec: "gh label list --limit 200 --json name,description --jq '.[] | \"\\(.name)\\t\\(.description)\"' 2>/dev/null"}, description: "Remove labels by name"}
          --add-reviewer: {value: any, description: "Add reviewers by their login"}
          --remove-reviewer: {value: any, description: "Remove reviewers by their login"}
          -m: {value: any, description: "Edit milestone by name"}
          --milestone: {value: any, description: "Edit milestone by name"}
          -t: {value: any, description: "Set the new title"}
          --title: {value: any, description: "Set the new title"}
          -b: {value: any, description: "Set the new body"}
          --body: {value: any, description: "Set the new body"}
          -F: {value: file, description: "Read body text from file"}
          --body-file: {value: file, description: "Read body text from file"}
        args:
          exec: "gh pr list --json number,title --jq '.[] | \"\\(.number)\\t\\(.title)\"' 2>/dev/null"
      ready:
        description: Mark a pull request as ready for review
        flags:
          --undo: {description: "Convert a pull request to a draft"}
        args:
          exec: "gh pr list --json number,title --jq '.[] | \"\\(.number)\\t\\(.title)\"' 2>/dev/null"
      comment:
        description: Add a comment to a pull request
        flags:
          -b: {value: any, description: "The comment body text", show: always}
          --body: {value: any, description: "The comment body text", show: always}
          -F: {value: file, description: "Read body text from file", show: always}
          --body-file: {value: file, description: "Read body text from file", show: always}
          --edit-last: {description: "Edit the last comment of the same author"}
        args:
          exec: "gh pr list --json number,title --jq '.[] | \"\\(.number)\\t\\(.title)\"' 2>/dev/null"
  issue:
    description: Manage issues
    flags:
      -R: {value: any, description: "Select another repository", show: always}
      --repo: {value: any, description: "Select another repository", show: always}
    commands:
      list:
        description: List issues in a repository
        flags:
          -a: {value: any, description: "Filter by assignee"}
          --assignee: {value: any, description: "Filter by assignee"}
          -A: {value: any, description: "Filter by author"}
          --author: {value: any, description: "Filter by author"}
          -l: {value: any, description: "Filter by label"}
          --label: {value: any, description: "Filter by label"}
          -L: {value: any, description: "Maximum number of results"}
          --limit: {value: any, description: "Maximum number of results"}
          -m: {value: any, description: "Filter by milestone number or title"}
          --milestone: {value: any, description: "Filter by milestone number or title"}
          -s: {value: any, description: "Filter by state: {open|closed|all}"}
          --state: {value: any, description: "Filter by state: {open|closed|all}"}
          --json: {value: any, description: "Output JSON with specified fields"}
      view:
        description: View an issue
        flags:
          -w: {description: "Open issue in the browser", show: always}
          --web: {description: "Open issue in the browser", show: always}
          --comments: {description: "View issue comments"}
          --json: {value: any, description: "Output JSON with specified fields"}
        args:
          exec: "gh issue list --json number,title --jq '.[] | \"\\(.number)\\t\\(.title)\"' 2>/dev/null"
      create:
        description: Create an issue
        flags:
          -t: {value: any, description: "Supply a title"}
          --title: {value: any, description: "Supply a title"}
          -b: {value: any, description: "Supply a body"}
          --body: {value: any, description: "Supply a body"}
          -F: {value: file, description: "Read body text from file"}
          --body-file: {value: file, description: "Read body text from file"}
          -a: {value: any, description: "Assign people by their login"}
          --assignee: {value: any, description: "Assign people by their login"}
          -l: {value: any, description: "Add labels by name"}
          --label: {value: any, description: "Add labels by name"}
          -m: {value: any, description: "Add the issue to a milestone by name"}
          --milestone: {value: any, description: "Add the issue to a milestone by name"}
          -p: {value: any, description: "Add the issue to projects by name"}
          --project: {value: any, description: "Add the issue to projects by name"}
          -w: {description: "Open the browser after creating the issue"}
          --web: {description: "Open the browser after creating the issue"}
      close:
        description: Close an issue
        flags:
          --comment: {value: any, description: "Leave a closing comment"}
          -r: {value: any, description: "Reason for closing: {completed|not planned|reopened}"}
          --reason: {value: any, description: "Reason for closing: {completed|not planned|reopened}"}
        args:
          exec: "gh issue list --json number,title --jq '.[] | \"\\(.number)\\t\\(.title)\"' 2>/dev/null"
      reopen:
        description: Reopen an issue
        flags:
          --comment: {value: any, description: "Add a reopening comment"}
        args:
          exec: "gh issue list --state closed --json number,title --jq '.[] | \"\\(.number)\\t\\(.title)\"' 2>/dev/null"
      edit:
        description: Edit an issue
        flags:
          --add-assignee: {value: any, description: "Add assigned users by their login"}
          --remove-assignee: {value: any, description: "Remove assigned users by their login"}
          --add-label: {value: any, description: "Add labels by name"}
          --remove-label: {value: any, description: "Remove labels by name"}
          -m: {value: any, description: "Edit milestone by name"}
          --milestone: {value: any, description: "Edit milestone by name"}
          -t: {value: any, description: "Set the new title"}
          --title: {value: any, description: "Set the new title"}
          -b: {value: any, description: "Set the new body"}
          --body: {value: any, description: "Set the new body"}
          -F: {value: file, description: "Read body text from file"}
          --body-file: {value: file, description: "Read body text from file"}
        args:
          exec: "gh issue list --json number,title --jq '.[] | \"\\(.number)\\t\\(.title)\"' 2>/dev/null"
      comment:
        description: Add a comment to an issue
        flags:
          -b: {value: any, description: "The comment body text"}
          --body: {value: any, description: "The comment body text"}
          -F: {value: file, description: "Read body text from file"}
          --body-file: {value: file, description: "Read body text from file"}
          --edit-last: {description: "Edit the last comment of the same author"}
        args:
          exec: "gh issue list --json number,title --jq '.[] | \"\\(.number)\\t\\(.title)\"' 2>/dev/null"
      pin:
        description: Pin an issue
        args:
          exec: "gh issue list --json number,title --jq '.[] | \"\\(.number)\\t\\(.title)\"' 2>/dev/null"
      unpin:
        description: Unpin an issue
        args:
          exec: "gh issue list --json number,title --jq '.[] | \"\\(.number)\\t\\(.title)\"' 2>/dev/null"
      transfer:
        description: Transfer issue to another repository
        flags:
          --skip-confirm: {description: "Skip confirmation prompt"}
        args:
          exec: "gh issue list --json number,title --jq '.[] | \"\\(.number)\\t\\(.title)\"' 2>/dev/null"
      delete:
        description: Delete an issue
        flags:
          --yes: {description: "Confirm deletion without prompting"}
        args:
          exec: "gh issue list --json number,title --jq '.[] | \"\\(.number)\\t\\(.title)\"' 2>/dev/null"
      develop:
        description: Manage linked branches for an issue
        flags:
          -b: {value: any, description: "Name of the branch to create"}
          --branch-repo: {value: any, description: "Name or URL of the repository to create the development branch in"}
          --checkout: {description: "Checkout the branch after creating it"}
          --issue-repo: {value: any, description: "Name or URL of the issue's repository"}
          --list: {description: "List linked branches for the issue"}
        args:
          exec: "gh issue list --json number,title --jq '.[] | \"\\(.number)\\t\\(.title)\"' 2>/dev/null"
  repo:
    description: Manage repositories
    flags:
      -R: {value: any, description: "Select another repository"}
      --repo: {value: any, description: "Select another repository"}
    commands:
      clone:
        description: Clone a repository locally
        flags:
          --upstream-remote-name: {value: any, description: "Upstream remote name when cloning a fork"}
        args:
          exec: "gh repo list --json nameWithOwner --jq '.[].nameWithOwner' 2>/dev/null"
      fork:
        description: Create a fork of a repository
        flags:
          --clone: {description: "Clone the fork", show: always}
          --remote: {description: "Add a remote for the fork"}
          --remote-name: {value: any, description: "Specify the name for the new remote"}
          --org: {value: any, description: "Create the fork in an organization"}
          --default-branch-only: {description: "Only include the default branch in the fork"}
        args:
          exec: "gh repo list --json nameWithOwner --jq '.[].nameWithOwner' 2>/dev/null"
      create:
        description: Create a new repository
        flags:
          -d: {value: any, description: "Description of the repository"}
          --description: {value: any, description: "Description of the repository"}
          --public: {description: "Make the repository public"}
          --private: {description: "Make the repository private"}
          --internal: {description: "Make the repository internal"}
          --push: {description: "Push local commits to the new repository"}
          --source: {value: dir, description: "Path to local repository to use as source"}
          --remote: {value: any, description: "Specify remote name for the new repository"}
          --homepage: {value: any, description: "A URL with more information about the repository"}
          --template: {value: any, description: "Make the new repository based on a template repository"}
          --clone: {description: "Clone the new repository to the current directory"}
          -g: {value: any, description: "Specify a gitignore template for the repository"}
          --gitignore: {value: any, description: "Specify a gitignore template for the repository"}
          -l: {value: any, description: "Specify an Open Source License for the repository"}
          --license: {value: any, description: "Specify an Open Source License for the repository"}
          --disable-issues: {description: "Disable issues in the new repository"}
          --disable-wiki: {description: "Disable wiki in the new repository"}
        args: any
      view:
        description: View a repository
        flags:
          -w: {description: "Open a repository in the browser", show: always}
          --web: {description: "Open a repository in the browser", show: always}
          --json: {value: any, description: "Output JSON with specified fields"}
          --jq: {value: any, description: "Filter JSON output using a jq expression"}
          -b: {value: any, description: "View a specific branch of the repository"}
          --branch: {value: any, description: "View a specific branch of the repository"}
        args: {exec: "gh repo list --limit 200 --json nameWithOwner,description --jq '.[] | \"\\(.nameWithOwner)\\t\\(.description // \"\")\"' 2>/dev/null"}
      list:
        description: List repositories owned by user or organization
        flags:
          --archived: {description: "Show only archived repositories"}
          --no-archived: {description: "Omit archived repositories"}
          --fork: {description: "Show only forks"}
          --source: {description: "Show only non-forks"}
          -l: {value: any, description: "Filter by primary coding language"}
          --language: {value: any, description: "Filter by primary coding language"}
          -L: {value: any, description: "Maximum number of repositories listed"}
          --limit: {value: any, description: "Maximum number of repositories listed"}
          --json: {value: any, description: "Output JSON with specified fields"}
          -t: {value: any, description: "Format each repository using a Go template"}
          --template: {value: any, description: "Format each repository using a Go template"}
          -q: {value: any, description: "Filter JSON output using a jq expression"}
          --jq: {value: any, description: "Filter JSON output using a jq expression"}
          --topic: {value: any, description: "Filter by topic"}
          --visibility: {value: any, description: "Filter by repository visibility: {public|private|internal}"}
        args: any
      edit:
        description: Edit repository settings
        flags:
          --default-branch: {value: any, description: "Set the default branch name"}
          --description: {value: any, description: "Edit the repository description"}
          --homepage: {value: any, description: "Edit the repository homepage URL"}
          --visibility: {value: any, description: "Change the repository visibility: {public|private|internal}"}
          --enable-issues: {description: "Enable issues in the repository"}
          --disable-issues: {description: "Disable issues in the repository"}
          --enable-wiki: {description: "Enable wiki in the repository"}
          --disable-wiki: {description: "Disable wiki in the repository"}
          --enable-projects: {description: "Enable projects in the repository"}
          --disable-projects: {description: "Disable projects in the repository"}
          --enable-discussions: {description: "Enable discussions in the repository"}
          --disable-discussions: {description: "Disable discussions in the repository"}
          --enable-merge-commit: {description: "Enable merging pull requests via merge commit"}
          --disable-merge-commit: {description: "Disable merging pull requests via merge commit"}
          --enable-squash-merge: {description: "Enable merging pull requests via squashed commit"}
          --disable-squash-merge: {description: "Disable merging pull requests via squashed commit"}
          --enable-rebase-merge: {description: "Enable merging pull requests via rebase"}
          --disable-rebase-merge: {description: "Disable merging pull requests via rebase"}
          --enable-auto-merge: {description: "Enable auto-merge functionality"}
          --disable-auto-merge: {description: "Disable auto-merge functionality"}
          --enable-delete-branch-on-merge: {description: "Enable automatically deleting head branches when pull requests are merged"}
          --disable-delete-branch-on-merge: {description: "Disable automatically deleting head branches when pull requests are merged"}
        args: {exec: "gh repo list --limit 200 --json nameWithOwner,description --jq '.[] | \"\\(.nameWithOwner)\\t\\(.description // \"\")\"' 2>/dev/null"}
      sync:
        description: Sync a repository
        flags:
          -b: {value: any, description: "Branch to sync"}
          --branch: {value: any, description: "Branch to sync"}
          --force: {description: "Hard reset the branch of the target repository to match the source repository"}
          --source: {value: any, description: "Source repository"}
        args:
          exec: "gh repo list --json nameWithOwner --jq '.[].nameWithOwner' 2>/dev/null"
      archive:
        description: Archive a repository
        flags:
          -y: {description: "Skip the confirmation prompt"}
          --yes: {description: "Skip the confirmation prompt"}
        args:
          exec: "gh repo list --json nameWithOwner --jq '.[].nameWithOwner' 2>/dev/null"
      unarchive:
        description: Unarchive a repository
        flags:
          -y: {description: "Skip the confirmation prompt"}
          --yes: {description: "Skip the confirmation prompt"}
        args:
          exec: "gh repo list --json nameWithOwner --jq '.[].nameWithOwner' 2>/dev/null"
      rename:
        description: Rename a repository
        flags:
          -y: {description: "Skip the confirmation prompt"}
          --yes: {description: "Skip the confirmation prompt"}
        args: {exec: "gh repo list --limit 200 --json nameWithOwner,description --jq '.[] | \"\\(.nameWithOwner)\\t\\(.description // \"\")\"' 2>/dev/null"}
      delete:
        description: Delete a repository
        flags:
          --yes: {description: "Confirm deletion without prompting"}
        args:
          exec: "gh repo list --json nameWithOwner --jq '.[].nameWithOwner' 2>/dev/null"
      deploy-key:
        description: Manage deploy keys in a repository
        commands:
          list:
            description: List deploy keys in a GitHub repository
          add:
            description: Add a deploy key to a GitHub repository
            flags:
              -t: {value: any, description: "Title of the deploy key"}
              --title: {value: any, description: "Title of the deploy key"}
              -k: {value: file, description: "Path to a file containing the public key"}
              --key: {value: file, description: "Path to a file containing the public key"}
              -w: {description: "Allow write access for the deploy key"}
              --allow-write: {description: "Allow write access for the deploy key"}
          delete:
            description: Delete a deploy key from a GitHub repository
            args: any
  gist:
    description: Manage gists
    commands:
      list:
        description: List your gists
        flags:
          -L: {value: any, description: "Maximum number of gists listed"}
          --limit: {value: any, description: "Maximum number of gists listed"}
          --public: {description: "Show only public gists"}
          --secret: {description: "Show only secret gists"}
      view:
        description: View a gist
        flags:
          -f: {value: any, description: "Display a single file from the gist"}
          --filename: {value: any, description: "Display a single file from the gist"}
          -r: {description: "Print raw instead of rendered gist contents", show: always}
          --raw: {description: "Print raw instead of rendered gist contents", show: always}

  workflow:
    description: View details about GitHub Actions workflows
    commands:
      list:
        description: List workflows in a repository
        flags:
          -a: {description: "Also show disabled workflows"}
          --all: {description: "Also show disabled workflows"}
          -L: {value: any, description: "Maximum number of workflows listed"}
          --limit: {value: any, description: "Maximum number of workflows listed"}
      view:
        description: View the summary of a workflow
        flags:
          -r: {value: any, description: "The branch or tag name which contains the version of the workflow file", show: always}
          --ref: {value: {exec: "git for-each-ref --format='%(refname:short)' refs/heads refs/tags 2>/dev/null", tree: true}, description: "The branch or tag name which contains the version of the workflow file", show: always}
          -w: {description: "Open workflow in the browser", show: always}
          --web: {description: "Open workflow in the browser", show: always}
          -y: {description: "View the workflow yaml file", show: always}
          --yaml: {description: "View the workflow yaml file", show: always}
        args:
          exec: "gh workflow list --jq '.[].name' --json name 2>/dev/null"
      run:
        description: Run a workflow by creating a workflow_dispatch event
        flags:
          -r: {value: any, description: "The branch or tag name which contains the version of the workflow file"}
          --ref: {value: any, description: "The branch or tag name which contains the version of the workflow file"}
          -F: {value: any, description: "Add a string parameter in key=value format, loading value from file"}
          --field: {value: any, description: "Add a string parameter in key=value format, loading value from file"}
          -f: {value: any, description: "Add a string parameter in key=value format"}
          --raw-field: {value: any, description: "Add a string parameter in key=value format", show: always}
          --json: {value: any, description: "Read workflow inputs as JSON via STDIN"}
        args:
          exec: "gh workflow list --jq '.[].name' --json name 2>/dev/null"
      enable:
        description: Enable a workflow
        args:
          exec: "gh workflow list --all --jq '.[].name' --json name 2>/dev/null"
      disable:
        description: Disable a workflow
        args:
          exec: "gh workflow list --jq '.[].name' --json name 2>/dev/null"
  run:
    description: View details about workflow runs
    commands:
      list:
        description: List recent workflow runs
        flags:
          -b: {value: any, description: "Filter runs by branch name"}
          --branch: {value: any, description: "Filter runs by branch name"}
          -e: {value: any, description: "Filter runs by which event triggered the run"}
          --event: {value: any, description: "Filter runs by which event triggered the run"}
          -L: {value: any, description: "Maximum number of runs listed"}
          --limit: {value: any, description: "Maximum number of runs listed"}
          -s: {value: any, description: "Filter runs by status: {queued|in_progress|completed|waiting|requested|pending}"}
          --status: {value: any, description: "Filter runs by status"}
          -u: {value: any, description: "Filter runs by the login of the user who triggered the run"}
          --user: {value: any, description: "Filter runs by the login of the user who triggered the run"}
          -w: {value: any, description: "Filter runs by workflow"}
          --workflow: {value: any, description: "Filter runs by workflow"}
      view:
        description: View a summary of a workflow run
        flags:
          -v: {description: "Show job steps"}
          --verbose: {description: "Show job steps"}
          --log: {description: "View full log for either a single step or an entire job", show: always}
          --log-failed: {description: "View the log for any failed steps in a run or specific job"}
          -j: {value: any, description: "View a specific job ID from a run", show: always}
          --job: {value: any, description: "View a specific job ID from a run", show: always}
          -w: {description: "Open run in the browser"}
          --web: {description: "Open run in the browser"}
          --exit-status: {description: "Exit with non-zero status if run failed", show: always}
        args: {exec: "gh run list --json databaseId,displayTitle,status --jq '.[] | \"\\(.databaseId)\\t\\(.status): \\(.displayTitle)\"' 2>/dev/null"}
      download:
        description: Download artifacts generated by a workflow run
        flags:
          -D: {value: dir, description: "The directory to download artifacts into"}
          --dir: {value: dir, description: "The directory to download artifacts into"}
          -n: {value: any, description: "Only download artifacts that match any of the given names"}
          --name: {value: any, description: "Only download artifacts that match any of the given names"}
          -p: {value: any, description: "Only download artifacts that match a glob pattern"}
          --pattern: {value: any, description: "Only download artifacts that match a glob pattern"}
        args: {exec: "gh run list --json databaseId,displayTitle,status --jq '.[] | \"\\(.databaseId)\\t\\(.status): \\(.displayTitle)\"' 2>/dev/null"}
      rerun:
        description: Rerun a run
        flags:
          --failed: {description: "Rerun only failed jobs, including their dependencies"}
          -d: {description: "Rerun with debugging enabled"}
          --debug: {description: "Rerun with debugging enabled"}
          -j: {value: any, description: "Rerun a specific job from a run, including dependencies"}
          --job: {value: any, description: "Rerun a specific job from a run, including dependencies"}
        args: {exec: "gh run list --json databaseId,displayTitle,status --jq '.[] | \"\\(.databaseId)\\t\\(.status): \\(.displayTitle)\"' 2>/dev/null"}
      cancel:
        description: Cancel a workflow run
        args: {exec: "gh run list --json databaseId,displayTitle,status --jq '.[] | \"\\(.databaseId)\\t\\(.status): \\(.displayTitle)\"' 2>/dev/null"}
      watch:
        description: Watch a run until it completes, showing its progress
        flags:
          --exit-status: {description: "Exit with non-zero status if run failed"}
          --interval: {value: any, description: "Refresh interval in seconds"}
        args: {exec: "gh run list --json databaseId,displayTitle,status --jq '.[] | \"\\(.databaseId)\\t\\(.status): \\(.displayTitle)\"' 2>/dev/null"}
      delete:
        description: Delete a workflow run
        flags:
          --yes: {description: "Do not prompt for confirmation"}
        args: {exec: "gh run list --json databaseId,displayTitle,status --jq '.[] | \"\\(.databaseId)\\t\\(.status): \\(.displayTitle)\"' 2>/dev/null"}
  release:
    description: Manage GitHub releases
    commands:
      list:
        description: List releases in a repository
        flags:
          --exclude-drafts: {description: "Exclude draft releases"}
          --exclude-pre-releases: {description: "Exclude pre-releases"}
          -L: {value: any, description: "Maximum number of items to fetch"}
          --limit: {value: any, description: "Maximum number of items to fetch"}
          --json: {value: any, description: "Output JSON with specified fields"}
      view:
        description: View information about a release
        flags:
          -w: {description: "Open the release in the browser"}
          --web: {description: "Open the release in the browser"}
          --json: {value: any, description: "Output JSON with specified fields"}
        args:
          exec: "gh release list --json tagName --jq '.[].tagName' 2>/dev/null"
      create:
        description: Create a new release
        flags:
          --draft: {description: "Save the release as a draft instead of publishing it"}
          --prerelease: {description: "Mark the release as a prerelease"}
          --latest: {description: "Mark this release as the latest release"}
          --verify-tag: {description: "Abort in case the git tag doesn't already exist in the remote repository"}
          -t: {value: any, description: "Release title"}
          --title: {value: any, description: "Release title"}
          -n: {value: any, description: "Release notes"}
          --notes: {value: any, description: "Release notes"}
          -F: {value: file, description: "Read release notes from file"}
          --notes-file: {value: file, description: "Read release notes from file"}
          --notes-start-tag: {value: {exec: "git tag --sort=-creatordate 2>/dev/null"}, description: "Tag to use as the starting point for generating release notes"}
          --generate-notes: {description: "Automatically generate title and notes for the release"}
          --target: {value: {exec: "git for-each-ref --format='%(refname:short)' refs/heads refs/tags 2>/dev/null", tree: true}, description: "Target branch or full commit SHA"}
          --discussion-category: {value: any, description: "Start a discussion in the specified category when publishing a release"}
        args: {exec: "git tag --sort=-creatordate 2>/dev/null"}
      delete:
        description: Delete a release
        flags:
          --yes: {description: "Skip the confirmation prompt"}
          --cleanup-tag: {description: "Delete the specified tag in addition to its release"}
        args:
          exec: "gh release list --json tagName --jq '.[].tagName' 2>/dev/null"
      edit:
        description: Edit a release
        flags:
          --draft: {description: "Save the release as a draft instead of publishing it"}
          --prerelease: {description: "Mark the release as a prerelease"}
          --latest: {description: "Mark this release as the latest release"}
          -t: {value: any, description: "Release title"}
          --title: {value: any, description: "Release title"}
          -n: {value: any, description: "Release notes"}
          --notes: {value: any, description: "Release notes"}
          -F: {value: file, description: "Read release notes from file"}
          --notes-file: {value: file, description: "Read release notes from file"}
          --tag: {value: any, description: "The name of the tag"}
          --target: {value: any, description: "Target branch or full commit SHA"}
          --discussion-category: {value: any, description: "Start a discussion in the specified category when publishing a release"}
        args:
          exec: "gh release list --json tagName --jq '.[].tagName' 2>/dev/null"
      download:
        description: Download release assets
        flags:
          -A: {value: any, description: "Download only assets that match a glob pattern"}
          --pattern: {value: any, description: "Download only assets that match a glob pattern"}
          -D: {value: dir, description: "The directory to download files into"}
          --dir: {value: dir, description: "The directory to download files into"}
          -O: {description: "Write downloaded asset to stdout"}
          --output: {description: "Write downloaded asset to stdout"}
          --skip-existing: {description: "Skip downloading when local file is found"}
          --clobber: {description: "Overwrite existing files of the same name"}
        args:
          exec: "gh release list --json tagName --jq '.[].tagName' 2>/dev/null"
      upload:
        description: Upload assets to a release
        flags:
          --clobber: {description: "Overwrite existing assets of the same name"}
        args: [{exec: "gh release list --json tagName,name --jq '.[] | \"\\(.tagName)\\t\\(.name)\"' 2>/dev/null"}, file]

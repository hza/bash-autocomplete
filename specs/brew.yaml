description: The Missing Package Manager for macOS
flags:
  -v: {description: "Be verbose"}
  --verbose: {description: "Be verbose"}
  -d: {description: "Display any debugging information"}
  --debug: {description: "Display any debugging information"}
  -q: {description: "Make some output more quiet"}
  --quiet: {description: "Make some output more quiet"}
  -h: {description: "Show help"}
  --help: {description: "Show help"}
commands:
  install:
    description: Install a formula or cask
    flags:
      --cask: {description: "Treat as a cask"}
      --formula: {description: "Treat as a formula"}
      --HEAD: {description: "Install HEAD version"}
      --fetch-HEAD: {description: "Fetch the upstream repository to detect if the HEAD installation is outdated"}
      --ignore-dependencies: {description: "Skip installing any dependencies"}
      --only-dependencies: {description: "Install dependencies but not the formula itself"}
      -s: {description: "Compile from source even if a bottle is provided"}
      --build-from-source: {description: "Compile from source even if a bottle is provided"}
      --force-bottle: {description: "Install from a bottle if it exists for the current version"}
      -n: {description: "Dry run, show what would be installed"}
      --dry-run: {description: "Dry run, show what would be installed"}
      -f: {description: "Install without checking for previously installed versions"}
      --force: {description: "Install without checking for previously installed versions"}
    args:
      exec: "brew formulae 2>/dev/null"
  uninstall:
    description: Uninstall a formula or cask
    aliases: [remove, rm]
    flags:
      --cask: {description: "Treat as a cask"}
      --formula: {description: "Treat as a formula"}
      -f: {description: "Delete all installed versions"}
      --force: {description: "Delete all installed versions"}
      --zap: {description: "Remove all files associated with a cask"}
      --ignore-dependencies: {description: "Don't fail uninstall if there are dependents"}
    args:
      exec: "brew list --formula 2>/dev/null"
  upgrade:
    description: Upgrade outdated formulae and casks
    flags:
      --cask: {description: "Treat as a cask"}
      --formula: {description: "Treat as a formula"}
      --greedy: {description: "Also upgrade casks with auto_updates or version :latest"}
      -n: {description: "Dry run, show what would be upgraded"}
      --dry-run: {description: "Dry run, show what would be upgraded"}
      -f: {description: "Force upgrade even if up-to-date"}
      --force: {description: "Force upgrade even if up-to-date"}
    args:
      exec: "brew list --formula 2>/dev/null"
  update:
    description: Fetch the newest version of Homebrew and all formulae
    flags:
      -f: {description: "Force an update"}
      --force: {description: "Force an update"}
      --merge: {description: "Use git merge instead of git rebase"}
      --auto-update: {description: "Run as if called by Homebrew's automatic updater"}
  search:
    description: Search for formulae and casks
    aliases: [se]
    flags:
      --formula: {description: "Search only formulae"}
      --cask: {description: "Search only casks"}
      --desc: {description: "Search in descriptions as well as names"}
    args:
      exec: "brew formulae 2>/dev/null"
  info:
    description: Display brief statistics for a formula or cask
    aliases: [home, abv]
    flags:
      --cask: {description: "Treat as a cask"}
      --formula: {description: "Treat as a formula"}
      --json: {description: "Print a JSON representation"}
      --installed: {description: "Print JSON of formulae that are currently installed"}
      --all: {description: "Print JSON of all available formulae"}
    args:
      exec: "brew list --formula 2>/dev/null"
  list:
    description: List installed formulae and casks
    aliases: [ls]
    flags:
      --formula: {description: "List only formulae"}
      --cask: {description: "List only casks"}
      --versions: {description: "Show the version number for installed formulae"}
      '-1': {description: "Force output to be one entry per line"}
      -l: {description: "List in long format"}
      -r: {description: "Reverse sort by modification time"}
      -t: {description: "Sort by modification time, newest first"}
  outdated:
    description: List installed casks and formulae that have an updated version available
    flags:
      --cask: {description: "List only outdated casks"}
      --formula: {description: "List only outdated formulae"}
      --json: {description: "Print a JSON representation"}
      --fetch-HEAD: {description: "Fetch upstream repository to detect if HEAD is outdated"}
      --greedy: {description: "Include outdated casks with auto_updates or version :latest"}
  doctor:
    description: Check your system for potential problems
    aliases: [dr]
    flags:
      --list-checks: {description: "List all audit methods"}
      --audit-debug: {description: "Enable debugging and profiling of audit methods"}
  cleanup:
    description: Remove stale lock files and outdated downloads
    flags:
      -n: {description: "Dry run, show what would be removed"}
      --dry-run: {description: "Dry run, show what would be removed"}
      -s: {description: "Remove all cached downloads, including recent ones"}
      --prune: {value: any, description: "Remove all cache files older than specified days"}
    args:
      exec: "brew list --formula 2>/dev/null"
  tap:
    description: Tap a formula repository
    flags:
      --force-auto-update: {description: "Auto-update even if already up-to-date"}
      --custom-remote: {description: "Install or change a tap with a custom remote"}
      --repair: {description: "Migrate tapped formulae from symlinks"}
      --list-pinned: {description: "List all pinned taps"}
    args:
      exec: "brew tap 2>/dev/null"
  untap:
    description: Remove a tapped formula repository
    args:
      exec: "brew tap 2>/dev/null"
  tap-info:
    description: Show detailed information about one or more taps
    flags:
      --installed: {description: "Show information on each installed tap"}
      --json: {description: "Print a JSON representation"}
    args:
      exec: "brew tap 2>/dev/null"
  services:
    description: Manage background services with macOS launchctl
    flags:
      --file: {value: file, description: "Use the plist file to start the service"}
      --all: {description: "Run subcommand on all services"}
    commands:
      list:
        description: List all managed services
      start:
        description: Start the service and register it to launch at login
        args:
          exec: "brew services list 2>/dev/null | tail -n +2 | awk '{print $1}'"
      stop:
        description: Stop the service and unregister it from launching at login
        args:
          exec: "brew services list 2>/dev/null | tail -n +2 | awk '{print $1}'"
      restart:
        description: Stop and start the service
        args:
          exec: "brew services list 2>/dev/null | tail -n +2 | awk '{print $1}'"
      run:
        description: Run the service without registering it to launch at login
        args:
          exec: "brew services list 2>/dev/null | tail -n +2 | awk '{print $1}'"
      kill:
        description: Stop the service but keep it registered to launch at login
        args:
          exec: "brew services list 2>/dev/null | tail -n +2 | awk '{print $1}'"
  link:
    description: Symlink all of a formula's installed files into the Homebrew prefix
    aliases: [ln]
    flags:
      --overwrite: {description: "Delete files already existing in the prefix"}
      --dry-run: {description: "Dry run, show what would be linked"}
      -f: {description: "Allow keg-only formulae to be linked"}
      --force: {description: "Allow keg-only formulae to be linked"}
      --HEAD: {description: "Link the HEAD version of the formula"}
    args:
      exec: "brew list --formula 2>/dev/null"
  unlink:
    description: Remove symlinks for a formula from the Homebrew prefix
    flags:
      --dry-run: {description: "Dry run, show what would be unlinked"}
    args:
      exec: "brew list --formula 2>/dev/null"
  pin:
    description: Pin the specified formulae, preventing them from being upgraded
    args:
      exec: "brew list --formula 2>/dev/null"
  unpin:
    description: Unpin the specified formulae, allowing them to be upgraded
    args:
      exec: "brew list --formula 2>/dev/null"
  deps:
    description: Show dependencies for a formula
    flags:
      -n: {description: "Sort dependencies in topological order"}
      --formula: {description: "Treat as a formula"}
      --cask: {description: "Treat as a cask"}
      --1: {description: "Only show direct dependencies"}
      --union: {description: "Show the union of dependencies for multiple formulae"}
      --full-name: {description: "List dependencies by their full name"}
      --include-build: {description: "Include build dependencies"}
      --include-optional: {description: "Include optional dependencies"}
      --include-test: {description: "Include test dependencies"}
      --skip-recommended: {description: "Skip recommended dependencies"}
      --tree: {description: "Show dependencies as tree"}
      --graph: {description: "Show dependencies as DOT graph"}
      --installed: {description: "List dependencies for installed formulae"}
      --missing: {description: "Show only missing dependencies"}
    args:
      exec: "brew list --formula 2>/dev/null"
  leaves:
    description: List installed formulae that are not dependencies of another installed formula
    flags:
      --installed-on-request: {description: "Only list leaves that were manually installed"}
      --installed-as-dependency: {description: "Only list leaves that were installed as dependencies"}
  uses:
    description: Show formulae and casks that specify a formula as a dependency
    flags:
      --formula: {description: "Include only formulae"}
      --cask: {description: "Include only casks"}
      --recursive: {description: "Resolve more than one level of dependencies"}
      --installed: {description: "Only list formulae that are currently installed"}
      --include-build: {description: "Include build dependencies"}
      --include-optional: {description: "Include optional dependencies"}
      --include-test: {description: "Include test dependencies"}
      --skip-recommended: {description: "Skip recommended dependencies"}
    args:
      exec: "brew list --formula 2>/dev/null"
  edit:
    description: Open a formula or cask in the editor
    flags:
      --formula: {description: "Treat as a formula"}
      --cask: {description: "Treat as a cask"}
    args:
      exec: "brew list --formula 2>/dev/null"
  create:
    description: Generate a formula or cask for a new package
    flags:
      --autotools: {description: "Create a basic template for an Autotools-style build"}
      --cmake: {description: "Create a basic template for a CMake-style build"}
      --crystal: {description: "Create a basic template for a Crystal build"}
      --go: {description: "Create a basic template for a Go build"}
      --meson: {description: "Create a basic template for a Meson-style build"}
      --node: {description: "Create a basic template for a Node build"}
      --perl: {description: "Create a basic template for a Perl build"}
      --python: {description: "Create a basic template for a Python build"}
      --ruby: {description: "Create a basic template for a Ruby build"}
      --rust: {description: "Create a basic template for a Rust build"}
      --cask: {description: "Create a basic template for a cask"}
      --set-name: {value: any, description: "Set the name of the new formula or cask"}
      --set-version: {value: any, description: "Set the version of the new formula or cask"}
      -f: {description: "Overwrite the formula file"}
      --force: {description: "Overwrite the formula file"}
    args: any
  fetch:
    description: Download a bottle or source packages for formulae and casks
    flags:
      --formula: {description: "Treat as a formula"}
      --cask: {description: "Treat as a cask"}
      --HEAD: {description: "Fetch HEAD version instead of stable version"}
      --retry: {description: "Retry if download fails or file is missing"}
      -f: {description: "Remove a previously cached version and re-fetch"}
      --force: {description: "Remove a previously cached version and re-fetch"}
    args:
      exec: "brew formulae 2>/dev/null"
  reinstall:
    description: Uninstall and then reinstall a formula or cask
    flags:
      --cask: {description: "Treat as a cask"}
      --formula: {description: "Treat as a formula"}
      -s: {description: "Compile from source even if a bottle is provided"}
      --build-from-source: {description: "Compile from source even if a bottle is provided"}
      -f: {description: "Force reinstall"}
      --force: {description: "Force reinstall"}
    args:
      exec: "brew list --formula 2>/dev/null"
  log:
    description: Show git log for a formula or cask
    flags:
      --formula: {description: "Treat as a formula"}
      --cask: {description: "Treat as a cask"}
      --oneline: {description: "Print only one line per commit"}
      --stat: {description: "Include diffstat in the log"}
      --patch: {description: "Include patch in the log"}
    args:
      exec: "brew list --formula 2>/dev/null"
  cat:
    description: Display the source of a formula or cask
    flags:
      --formula: {description: "Treat as a formula"}
      --cask: {description: "Treat as a cask"}
    args:
      exec: "brew list --formula 2>/dev/null"
  options:
    description: Show install options specific to formula
    flags:
      --compact: {description: "Show all options on a single line separated by spaces"}
      --installed: {description: "Show options for all installed formulae"}
      --all: {description: "Show options for all available formulae"}
      --command: {value: any, description: "Show options for brew command"}
    args:
      exec: "brew list --formula 2>/dev/null"
  switch:
    description: Symlink all of a specific version of a formula's install to the Homebrew prefix
    args:
      exec: "brew list --formula 2>/dev/null"
  missing:
    description: Check the given formulae for missing dependencies
    flags:
      --hide: {value: any, description: "Act as if none of the specified hidden are installed"}
    args:
      exec: "brew list --formula 2>/dev/null"

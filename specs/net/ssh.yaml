description: OpenSSH remote login client
flags:
  -p: {value: any, description: "Port to connect to on the remote host", show: always}
  -i: {value: file, description: "Identity file (private key)", show: always}
  -L: {value: any, description: "Local port forwarding (local:host:hostport)", show: always}
  -R: {value: any, description: "Remote port forwarding (remote:host:hostport)"}
  -D: {value: any, description: "Dynamic application-level port forwarding", show: always}
  -l: {value: any, description: "Login name on the remote machine"}
  -o: {value: any, description: "Option in ssh_config format"}
  -N: {description: "Do not execute a remote command", show: always}
  -f: {description: "Go to background just before command execution"}
  '-4': {description: "Force IPv4 connections only"}
  '-6': {description: "Force IPv6 connections only"}
  -A: {description: "Enable forwarding of the authentication agent connection"}
  -X: {description: "Enable X11 forwarding"}
  -x: {description: "Disable X11 forwarding"}
  -v: {description: "Verbose mode (repeat for more verbosity)", repeat: true}
  -q: {description: "Quiet mode"}
  -C: {description: "Request compression of all data"}
  -t: {description: "Force pseudo-terminal allocation", show: always}
  -T: {description: "Disable pseudo-terminal allocation", show: always}
  -W: {value: any, description: "Forward stdin/stdout to host:port"}
  -J: {value: "@hosts", description: "Jump host(s) (proxy jump)", show: always}
  -E: {value: file, description: "Append debug logs to log_file"}
  -F: {value: file, description: "Specify config file"}
  -b: {value: any, description: "Bind address"}
  -c: {value: any, description: "Cipher spec"}
  -e: {value: any, description: "Escape character"}
  -g: {description: "Allow remote hosts to connect to local forwarded ports"}
  -k: {description: "Disable GSSAPI credential forwarding"}
  -M: {description: "Master mode for connection sharing"}
  -n: {description: "Redirect stdin from /dev/null"}
  -S: {value: any, description: "Control socket for connection sharing"}
  -w: {value: any, description: "Tunnel device forwarding"}
  -Y: {description: "Enable trusted X11 forwarding"}
args: "@hosts"
snippets:
  - key: l
    pin: true
    command: "ssh -L 8080:localhost:80 myhost"
    description: "local forward: localhost:8080 reaches port 80 on myhost"
  - key: r
    command: "ssh -R 9000:localhost:3000 myhost"
    description: "remote forward: myhost:9000 reaches your port 3000"
  - key: j
    pin: true
    command: "ssh -J bastion myhost"
    description: "connect through a jump host"
  - key: d
    command: "ssh -D 1080 -N myhost"
    description: "SOCKS proxy on localhost:1080, no shell"
  - key: n
    command: "ssh -N -f -L 5432:db.internal:5432 myhost"
    description: "tunnel to a host behind myhost, in the background"
  - key: c
    pin: true
    command: "ssh myhost 'df -h; uptime'"
    description: "run commands and return"
  - key: t
    command: "ssh -t myhost htop"
    description: "run an interactive program (forces a tty)"
  - key: p
    command: "ssh -p 2222 user@myhost"
    description: "non-default port and user"
  - key: i
    command: "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes myhost"
    description: "use only this key"
  - key: a
    command: "ssh -A myhost"
    description: "forward your agent (trusted hosts only)"
  - key: v
    command: "ssh -v myhost"
    description: "debug a failing login (-vvv for more)"
  - key: g
    command: "ssh -G myhost | grep -iE '^(hostname|user|port|identityfile) '"
    description: "show the effective config for a host"

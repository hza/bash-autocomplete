description: "Capture images or video of the screen"
flags:
  -c: {description: "Capture to the clipboard"}
  -b: {description: "Capture the Touch Bar"}
  -C: {description: "Capture the cursor as well"}
  -d: {description: "Display errors graphically"}
  -i: {description: "Interactive: select area or window"}
  -m: {description: "Only capture the main monitor"}
  -D: {value: any, description: "Display to capture (1 = main)"}
  -o: {description: "Window mode: no window shadow"}
  -p: {description: "Use default capture settings"}
  -M: {description: "Send capture to a new Mail message"}
  -P: {description: "Open capture in Preview / QuickTime Player"}
  -B:
    value: {exec: "for a in /Applications/*.app /System/Applications/*.app /System/Applications/Utilities/*.app; do i=$(defaults read \"$a/Contents/Info\" CFBundleIdentifier 2>/dev/null) && printf '%s\\t%s\\n' \"$i\" \"$(basename \"$a\" .app)\"; done"}
    description: "Open capture in app with bundle id"
  -s: {description: "Only allow mouse selection"}
  -S: {description: "Window mode: capture the screen, not the window"}
  -J:
    value: {exec: "printf '%s\\n' selection window video"}
    description: "Starting interactive mode"
  -t:
    value: {exec: "printf '%s\\n' png jpg pdf tiff heic gif bmp"}
    description: "Image format (default png)"
  -T: {value: any, description: "Delay in seconds"}
  -w: {description: "Only allow window selection"}
  -W: {description: "Start in window selection mode"}
  -x: {description: "Do not play sounds"}
  -a: {description: "Exclude attached windows"}
  -r: {description: "Do not add dpi metadata"}
  -l: {value: any, description: "Capture window with this id"}
  -R: {value: any, description: "Capture rect x,y,w,h"}
  -v: {description: "Record video"}
  -V: {value: any, description: "Limit video to seconds"}
  -g: {description: "Record audio from default input"}
  -G: {value: any, description: "Record audio from device id"}
  -k: {description: "Show clicks in video"}
  -U: {description: "Show interactive toolbar"}
  -u: {description: "Present UI after capture"}
args: file

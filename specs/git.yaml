flags:
  -C: {value: dir, description: "Run as if git was started in <path>"}
  -c: {value: any, description: "Set a config variable (name=value)"}
  --git-dir: {value: dir, description: "Set the path to the repository"}
  --work-tree: {value: dir, description: "Set the path to the working tree"}
  --no-pager: {description: "Do not pipe output into a pager"}
  -p: {description: "Pipe all output into a pager"}
  --paginate: {description: "Pipe all output into a pager"}
  --bare: {description: "Treat the repository as a bare repository"}
  --help: {description: "Show help"}
  --version: {description: "Print the git version"}
commands:
  add:
    description: Add file contents to the index
    flags:
      -A: {description: "Add changes from all tracked and untracked files"}
      --all: {description: "Add changes from all tracked and untracked files"}
      -u: {description: "Update tracked files"}
      --update: {description: "Update tracked files"}
      -p: {description: "Select hunks interactively"}
      --patch: {description: "Select hunks interactively"}
      -n: {description: "Dry run"}
      --dry-run: {description: "Dry run"}
      -f: {description: "Allow adding otherwise ignored files"}
      --force: {description: "Allow adding otherwise ignored files"}
      -v: {description: "Be verbose"}
      --verbose: {description: "Be verbose"}
      -N: {description: "Record only the fact that the path will be added later"}
      --intent-to-add: {description: "Record only the fact that the path will be added later"}
      --help: {description: "Show the manual page"}
    args:
      - exec: git ls-files -m -o --exclude-standard
      - file
  restore:
    description: Restore working tree files
    flags:
      -S: {description: "Restore the index"}
      --staged: {description: "Restore the index"}
      -W: {description: "Restore the working tree"}
      --worktree: {description: "Restore the working tree"}
      -s: {value: {exec: "git for-each-ref --format='%(refname:short)' refs/heads refs/remotes refs/tags"}, description: "Which tree-ish to checkout from"}
      --source: {value: {exec: "git for-each-ref --format='%(refname:short)' refs/heads refs/remotes refs/tags"}, description: "Which tree-ish to checkout from"}
      -p: {description: "Select hunks interactively"}
      --patch: {description: "Select hunks interactively"}
      --help: {description: "Show the manual page"}
    args:
      - exec: git diff --name-only --relative
      - exec: git diff --cached --name-only --relative
  rm:
    description: Remove files from the working tree and from the index
    flags:
      -f: {description: "Override the up-to-date check"}
      --force: {description: "Override the up-to-date check"}
      -r: {description: "Allow recursive removal"}
      --cached: {description: "Only remove from the index"}
      -n: {description: "Dry run"}
      --dry-run: {description: "Dry run"}
      --help: {description: "Show the manual page"}
    args:
      exec: git ls-files
  mv:
    description: Move or rename a file, a directory, or a symlink
    flags:
      -f: {description: "Force move/rename even if target exists"}
      --force: {description: "Force move/rename even if target exists"}
      -n: {description: "Dry run"}
      --dry-run: {description: "Dry run"}
      --help: {description: "Show the manual page"}
    args: file
  status:
    description: Show the working tree status
    flags:
      -s: {description: "Show status concisely"}
      --short: {description: "Show status concisely"}
      -b: {description: "Show branch information"}
      --branch: {description: "Show branch information"}
      --porcelain: {description: "Machine-readable output"}
      -u: {value: any, description: "Show untracked files, optional modes: all, normal, no. (Default: all)"}
      --untracked-files: {value: any, description: "Show untracked files, optional modes: all, normal, no. (Default: all)"}
      --ignored: {description: "Show ignored files, optional modes: traditional, matching, no. (Default: traditional)"}
      --help: {description: "Show the manual page"}
    args: file
  diff:
    description: Show changes between commits, commit and working tree, etc
    flags:
      --cached: {description: "Show changes staged for the next commit"}
      --staged: {description: "Show changes staged for the next commit"}
      --stat: {description: "Show diffstat instead of patch"}
      --name-only: {description: "Show only names of changed files"}
      --name-status: {description: "Show only names and status of changed files"}
      -w: {description: "Ignore whitespace when comparing lines"}
      --ignore-all-space: {description: "Ignore whitespace when comparing lines"}
      --word-diff: {description: "Show a word diff"}
      --color-words: {description: "Show a colored word diff"}
      --no-index: {description: "Compare two paths on the filesystem"}
      -U: {value: any, description: "Generate diffs with <n> lines of context"}
      --help: {description: "Show the manual page"}
    args:
      - exec: git for-each-ref --format='%(refname:short)' refs/heads refs/remotes refs/tags
      - exec: git diff --name-only --relative
  commit:
    description: Record changes to the repository
    flags:
      -m: {value: any, description: "Commit message"}
      --message: {value: any, description: "Commit message"}
      -a: {description: "Commit all changed files"}
      --all: {description: "Commit all changed files"}
      --amend: {description: "Amend previous commit"}
      --no-edit: {description: "Use the selected commit message without launching an editor"}
      -F: {value: file, description: "Read message from file"}
      --file: {value: file, description: "Read message from file"}
      -v: {description: "Show diff in commit message template"}
      --verbose: {description: "Show diff in commit message template"}
      -n: {description: "Bypass pre-commit and commit-msg hooks"}
      --no-verify: {description: "Bypass pre-commit and commit-msg hooks"}
      -s: {description: "Add a Signed-off-by trailer"}
      --signoff: {description: "Add a Signed-off-by trailer"}
      --fixup: {value: any, description: "Use autosquash formatted message to fixup or amend/reword specified commit"}
      --allow-empty: {description: "Allow a commit with no changes"}
      -p: {description: "Interactively add changes"}
      --patch: {description: "Interactively add changes"}
      --help: {description: "Show the manual page"}
    args:
      exec: git ls-files -m
  log:
    description: Show commit logs
    flags:
      --oneline: {description: "Show each commit on one line"}
      --graph: {description: "Draw a text-based graph of the history"}
      --all: {description: "Show commits from all refs"}
      --decorate: {description: "Decorate options"}
      -p: {description: "Show the patch of each commit"}
      --patch: {description: "Show the patch of each commit"}
      --stat: {description: "Show a diffstat for each commit"}
      -n: {value: any, description: "Limit the number of commits"}
      --max-count: {value: any, description: "Limit the number of commits"}
      --author: {value: any, description: "Only commits by a matching author"}
      --since: {value: any, description: "Only commits newer than a date"}
      --until: {value: any, description: "Only commits older than a date"}
      --grep: {value: any, description: "Only commits whose message matches a pattern"}
      --follow: {description: "Follow a file across renames"}
      --reverse: {description: "Show commits in reverse order"}
      --pretty: {value: any, description: "Pretty-print commits in a given format"}
      --format: {value: any, description: "Pretty-print commits in a given format"}
      --help: {description: "Show the manual page"}
    args:
      - exec: git for-each-ref --format='%(refname:short)' refs/heads refs/remotes refs/tags
      - file
  show:
    description: Show various types of objects
    flags:
      --stat: {description: "Show a diffstat"}
      --name-only: {description: "Show only names of changed files"}
      --oneline: {description: "Show the commit on one line"}
      --pretty: {value: any, description: "Pretty-print in a given format"}
      --format: {value: any, description: "Pretty-print in a given format"}
      --help: {description: "Show the manual page"}
    args:
      exec: git for-each-ref --format='%(refname:short)' refs/heads refs/remotes refs/tags
  branch:
    description: List, create, or delete branches
    aliases: [br]
    flags:
      -a: {description: "List both remote-tracking and local branches"}
      --all: {description: "List both remote-tracking and local branches"}
      -r: {description: "Act on remote-tracking branches"}
      --remotes: {description: "Act on remote-tracking branches"}
      -d: {description: "Delete fully merged branch"}
      --delete: {description: "Delete fully merged branch"}
      -D: {description: "Delete branch (even if not merged)"}
      -m: {description: "Move/rename a branch and its reflog"}
      --move: {description: "Move/rename a branch and its reflog"}
      -M: {description: "Move/rename a branch, even if target exists"}
      -c: {description: "Copy a branch and its reflog"}
      --copy: {description: "Copy a branch and its reflog"}
      -v: {description: "Show hash and subject, give twice for upstream branch"}
      -vv: {description: "Show hash, subject and upstream branch for each branch"}
      -u: {value: {exec: "git for-each-ref --format='%(refname:short)' refs/remotes"}, description: "Change the upstream info"}
      --set-upstream-to: {value: {exec: "git for-each-ref --format='%(refname:short)' refs/remotes"}, description: "Change the upstream info"}
      --unset-upstream: {description: "Unset the upstream info"}
      --show-current: {description: "Show current branch name"}
      --merged: {description: "Print only branches that are merged"}
      --no-merged: {description: "Print only branches that are not merged"}
      --help: {description: "Show the manual page"}
    args:
      exec: git for-each-ref --format='%(refname:short)' refs/heads
  checkout:
    description: Switch branches or restore working tree files
    aliases: [co]
    flags:
      -b: {value: any, description: "Create and checkout a new branch"}
      -B: {value: any, description: "Create/reset and checkout a branch"}
      --orphan: {value: any, description: "New unparented branch"}
      -f: {description: "Force checkout (throw away local modifications)"}
      --force: {description: "Force checkout (throw away local modifications)"}
      -t: {description: "Set branch tracking configuration"}
      --track: {description: "Set branch tracking configuration"}
      --detach: {description: "Detach HEAD at named commit"}
      -p: {description: "Select hunks interactively"}
      --patch: {description: "Select hunks interactively"}
      --help: {description: "Show the manual page"}
    args:
      - exec: git for-each-ref --format='%(refname:short)' refs/heads refs/remotes refs/tags
      - exec: git diff --name-only --relative
  switch:
    description: Switch branches
    flags:
      -c: {value: any, description: "Create and switch to a new branch"}
      --create: {value: any, description: "Create and switch to a new branch"}
      -C: {value: any, description: "Create/reset and switch to a branch"}
      --force-create: {value: any, description: "Create/reset and switch to a branch"}
      -d: {description: "Detach HEAD at named commit"}
      --detach: {description: "Detach HEAD at named commit"}
      -t: {description: "Set branch tracking configuration"}
      --track: {description: "Set branch tracking configuration"}
      --orphan: {value: any, description: "New unparented branch"}
      -f: {description: "Force checkout (throw away local modifications)"}
      --force: {description: "Force checkout (throw away local modifications)"}
      --discard-changes: {description: "Throw away local modifications"}
      --help: {description: "Show the manual page"}
    args:
      exec: git for-each-ref --format='%(refname:short)' refs/heads refs/remotes
  merge:
    description: Join two or more development histories together
    flags:
      --no-ff: {description: "Always create a merge commit"}
      --ff-only: {description: "Abort if fast-forward is not possible"}
      --squash: {description: "Create a single commit instead of doing a merge"}
      --abort: {description: "Abort the current in-progress merge"}
      --continue: {description: "Continue the current in-progress merge"}
      -m: {value: any, description: "Merge commit message (for a non-fast-forward merge)"}
      --no-edit: {description: "Accept the auto-generated merge message"}
      -s: {value: any, description: "Merge strategy to use"}
      --strategy: {value: any, description: "Merge strategy to use"}
      --help: {description: "Show the manual page"}
    args:
      exec: git for-each-ref --format='%(refname:short)' refs/heads refs/remotes refs/tags
  rebase:
    description: Reapply commits on top of another base tip
    aliases: [re]
    flags:
      -i: {description: "Let the user edit the list of commits to rebase"}
      --interactive: {description: "Let the user edit the list of commits to rebase"}
      --continue: {description: Continue}
      --abort: {description: "Abort and check out the original branch"}
      --skip: {description: "Skip current patch and continue"}
      --onto: {value: {exec: "git for-each-ref --format='%(refname:short)' refs/heads refs/remotes refs/tags"}, description: "Rebase onto given branch instead of upstream"}
      --autosquash: {description: "Move commits that begin with squash!/fixup! under -i"}
      --autostash: {description: "Automatically stash/stash pop before and after"}
      --help: {description: "Show the manual page"}
    args:
      exec: git for-each-ref --format='%(refname:short)' refs/heads refs/remotes refs/tags
  cherry-pick:
    description: Apply the changes introduced by some existing commits
    aliases: [cp]
    flags:
      --continue: {description: "Resume revert or cherry-pick sequence"}
      --abort: {description: "Cancel revert or cherry-pick sequence"}
      --skip: {description: "Skip current commit and continue"}
      -n: {description: "Don't automatically commit"}
      --no-commit: {description: "Don't automatically commit"}
      -x: {description: "Append commit name"}
      --help: {description: "Show the manual page"}
    args:
      exec: git for-each-ref --format='%(refname:short)' refs/heads refs/remotes refs/tags
  reset:
    description: Reset current HEAD to the specified state
    flags:
      --soft: {description: "Reset only HEAD"}
      --mixed: {description: "Reset HEAD and index"}
      --hard: {description: "Reset HEAD, index and working tree"}
      --keep: {description: "Reset HEAD but keep local changes"}
      -p: {description: "Select hunks interactively"}
      --patch: {description: "Select hunks interactively"}
      --help: {description: "Show the manual page"}
    args:
      - exec: git for-each-ref --format='%(refname:short)' refs/heads refs/remotes refs/tags
      - exec: git diff --cached --name-only --relative
  revert:
    description: Revert some existing commits
    flags:
      --continue: {description: "Resume revert or cherry-pick sequence"}
      --abort: {description: "Cancel revert or cherry-pick sequence"}
      --no-edit: {description: "Do not start the commit message editor"}
      -n: {description: "Don't automatically commit"}
      --no-commit: {description: "Don't automatically commit"}
      --help: {description: "Show the manual page"}
    args:
      exec: git for-each-ref --format='%(refname:short)' refs/heads refs/tags
  tag:
    description: Create, list, delete or verify a tag object signed with GPG
    flags:
      -a: {description: "Annotated tag, needs a message"}
      --annotate: {description: "Annotated tag, needs a message"}
      -m: {value: any, description: "Tag message"}
      --message: {value: any, description: "Tag message"}
      -d: {description: "Delete tags"}
      --delete: {description: "Delete tags"}
      -l: {description: "List tag names"}
      --list: {description: "List tag names"}
      -f: {description: "Replace the tag if exists"}
      --force: {description: "Replace the tag if exists"}
      -s: {description: "Annotated and GPG-signed tag"}
      --sign: {description: "Annotated and GPG-signed tag"}
      --help: {description: "Show the manual page"}
    args:
      exec: git tag
  fetch:
    description: Download objects and refs from another repository
    aliases: [fe]
    flags:
      --all: {description: "Fetch from all remotes"}
      -p: {description: "Prune remote-tracking branches no longer on remote"}
      --prune: {description: "Prune remote-tracking branches no longer on remote"}
      --tags: {description: "Fetch all tags and associated objects"}
      --depth: {value: any, description: "Deepen history of shallow clone"}
      -v: {description: "Be more verbose"}
      --help: {description: "Show the manual page"}
    args:
      exec: git remote
  pull:
    description: Fetch from and integrate with another repository or a local branch
    flags:
      --rebase: {description: "Incorporate changes by rebasing rather than merging"}
      --no-rebase: {description: "Merge instead of rebasing"}
      --ff-only: {description: "Abort if fast-forward is not possible"}
      --all: {description: "Fetch from all remotes"}
      --autostash: {description: "Automatically stash/stash pop before and after"}
      -v: {description: "Be more verbose"}
      --help: {description: "Show the manual page"}
    args:
      - exec: git remote
      - exec: git for-each-ref --format='%(refname:short)' refs/heads
  push:
    description: Update remote refs along with associated objects
    aliases: [pu]
    flags:
      -u: {description: "Set upstream for git pull/status"}
      --set-upstream: {description: "Set upstream for git pull/status"}
      -f: {description: "Force updates"}
      --force: {description: "Force updates"}
      --force-with-lease: {description: "Require old value of ref to be at this value"}
      --tags: {description: "Push tags (can't be used with --all or --mirror)"}
      --all: {description: "Push all refs"}
      -d: {description: "Delete refs"}
      --delete: {description: "Delete refs"}
      --dry-run: {description: "Dry run"}
      --no-verify: {description: "Bypass pre-push hook"}
      --help: {description: "Show the manual page"}
    args:
      - exec: git remote
      - exec: git for-each-ref --format='%(refname:short)' refs/heads refs/tags
  remote:
    description: Manage set of tracked repositories
    flags:
      -v: {description: "Be verbose; must be placed before a subcommand"}
      --verbose: {description: "Be verbose; must be placed before a subcommand"}
      --help: {description: "Show the manual page"}
    commands:
      add:
        description: Add a remote
        flags:
          -f: {description: "Fetch the remote branches"}
          -t: {value: any, description: "Branch(es) to track"}
          --help: {description: "Show the manual page"}
        args: any
      remove:
        description: Remove a remote
        flags:
          --help: {description: "Show the manual page"}
        args:
          exec: git remote
      rm:
        description: Remove a remote
        flags:
          --help: {description: "Show the manual page"}
        args:
          exec: git remote
      rename:
        description: Rename a remote
        flags:
          --help: {description: "Show the manual page"}
        args:
          exec: git remote
      set-url:
        description: Change the URL of a remote
        flags:
          --add: {description: "Add URL"}
          --delete: {description: "Delete URLs"}
          --push: {description: "Manipulate push URLs"}
          --help: {description: "Show the manual page"}
        args:
          exec: git remote
      get-url:
        description: Show the URL of a remote
        flags:
          --help: {description: "Show the manual page"}
        args:
          exec: git remote
      show:
        description: Show information about a remote
        flags:
          --help: {description: "Show the manual page"}
        args:
          exec: git remote
      prune:
        description: Delete stale remote-tracking branches
        flags:
          --help: {description: "Show the manual page"}
        args:
          exec: git remote
  stash:
    description: Stash the changes in a dirty working directory away
    flags:
      --help: {description: "Show the manual page"}
    commands:
      push:
        description: Save local changes to a new stash
        flags:
          -m: {value: any, description: "Stash message"}
          --message: {value: any, description: "Stash message"}
          -u: {description: "Include untracked files in stash"}
          --include-untracked: {description: "Include untracked files in stash"}
          -p: {description: "Stash in patch mode"}
          --patch: {description: "Stash in patch mode"}
          -k: {description: "Keep index"}
          --keep-index: {description: "Keep index"}
          --help: {description: "Show the manual page"}
        args: file
      pop:
        description: Apply a stash and remove it
        flags:
          --index: {description: "Attempt to recreate the index"}
          --help: {description: "Show the manual page"}
        args:
          exec: git stash list --format='%gd'
      apply:
        description: Apply a stash, keeping it
        flags:
          --index: {description: "Attempt to recreate the index"}
          --help: {description: "Show the manual page"}
        args:
          exec: git stash list --format='%gd'
      drop:
        description: Remove a stash
        flags:
          --help: {description: "Show the manual page"}
        args:
          exec: git stash list --format='%gd'
      show:
        description: Show the changes in a stash
        flags:
          -p: {description: "Show the stash as a patch"}
          --patch: {description: "Show the stash as a patch"}
          --help: {description: "Show the manual page"}
        args:
          exec: git stash list --format='%gd'
      list:
        description: List stashes
        flags:
          --help: {description: "Show the manual page"}
      clear:
        description: Remove all stashes
        flags:
          --help: {description: "Show the manual page"}
      branch:
        description: Create a branch from a stash
        flags:
          --help: {description: "Show the manual page"}
        args: any
  clone:
    description: Clone a repository into a new directory
    flags:
      --depth: {value: any, description: "Create a shallow clone of that depth"}
      -b: {value: any, description: "Checkout <branch> instead of the remote's HEAD"}
      --branch: {value: any, description: "Checkout <branch> instead of the remote's HEAD"}
      --single-branch: {description: "Clone only one branch, HEAD or --branch"}
      --recursive: {description: "Alias of --recurse-submodules"}
      --recurse-submodules: {description: "Initialize submodules in the clone"}
      --bare: {description: "Create a bare repository"}
      --mirror: {description: "Create a mirror repository (implies bare)"}
      -o: {value: any, description: "Use <name> instead of 'origin' to track upstream"}
      --origin: {value: any, description: "Use <name> instead of 'origin' to track upstream"}
      --help: {description: "Show the manual page"}
    args: dir
  init:
    description: Create an empty Git repository or reinitialize an existing one
    flags:
      --bare: {description: "Create a bare repository"}
      -b: {value: any, description: "Override the name of the initial branch"}
      --initial-branch: {value: any, description: "Override the name of the initial branch"}
      -q: {description: "Be quiet"}
      --quiet: {description: "Be quiet"}
      --help: {description: "Show the manual page"}
    args: dir
  blame:
    description: Show what revision and author last modified each line of a file
    flags:
      -L: {value: any, description: "Process only line range <start>,<end> or function :<funcname>"}
      -w: {description: "Ignore whitespace differences"}
      -C: {description: "Find line copies within and across files"}
      -M: {description: "Find line movements within and across files"}
      -e: {description: "Show author email instead of name (Default: off)"}
      --help: {description: "Show the manual page"}
    args:
      exec: git ls-files
  clean:
    description: Remove untracked files from the working tree
    flags:
      -n: {description: "Dry run"}
      --dry-run: {description: "Dry run"}
      -f: {description: Force}
      --force: {description: Force}
      -d: {description: "Remove whole directories"}
      -x: {description: "Remove ignored files, too"}
      -X: {description: "Remove only ignored files"}
      -i: {description: "Interactive cleaning"}
      --help: {description: "Show the manual page"}
    args: file
  grep:
    description: Print lines matching a pattern
    flags:
      -i: {description: "Case insensitive matching"}
      --ignore-case: {description: "Case insensitive matching"}
      -n: {description: "Show line numbers"}
      --line-number: {description: "Show line numbers"}
      -l: {description: "Show only filenames instead of matching lines"}
      -w: {description: "Match patterns only at word boundaries"}
      -e: {value: any, description: "Match <pattern>"}
      -E: {description: "Use extended POSIX regular expressions"}
      --help: {description: "Show the manual page"}
    args: any
  bisect:
    description: Use binary search to find the commit that introduced a bug
    flags:
      --help: {description: "Show the manual page"}
    commands:
      start:
        description: Start a bisect session
        flags:
          --help: {description: "Show the manual page"}
      good:
        description: Mark a commit as good
        flags:
          --help: {description: "Show the manual page"}
      bad:
        description: Mark a commit as bad
        flags:
          --help: {description: "Show the manual page"}
      skip:
        description: Skip a commit
        flags:
          --help: {description: "Show the manual page"}
      reset:
        description: End the bisect session
        flags:
          --help: {description: "Show the manual page"}
      log:
        description: Show the bisect log
        flags:
          --help: {description: "Show the manual page"}
      run:
        description: Bisect automatically with a script
        flags:
          --help: {description: "Show the manual page"}
        args: file
  worktree:
    description: Manage multiple working trees
    flags:
      --help: {description: "Show the manual page"}
    commands:
      add:
        description: Create a new worktree
        flags:
          -b: {value: any, description: "Create a new branch"}
          -f: {description: "Checkout <branch> even if already checked out in other worktree"}
          --detach: {description: "Detach HEAD at named commit"}
          --help: {description: "Show the manual page"}
        args: dir
      list:
        description: List worktrees
        flags:
          --help: {description: "Show the manual page"}
      remove:
        description: Remove a worktree
        flags:
          -f: {description: "Force removal even if worktree is dirty or locked"}
          --force: {description: "Force removal even if worktree is dirty or locked"}
          --help: {description: "Show the manual page"}
        args:
          exec: git worktree list --porcelain | sed -n 's/^worktree //p'
      prune:
        description: Prune stale worktree information
        flags:
          --help: {description: "Show the manual page"}
  submodule:
    description: Initialize, update or inspect submodules
    flags:
      --help: {description: "Show the manual page"}
    commands:
      add:
        description: Add a submodule
        flags:
          --help: {description: "Show the manual page"}
        args: any
      update:
        description: Update submodules to the recorded commit
        flags:
          --init: {description: "Initialize submodules that are not yet initialized"}
          --recursive: {description: "Update nested submodules too"}
          --remote: {description: "Update to the remote-tracking branch"}
          --help: {description: "Show the manual page"}
      status:
        description: Show submodule status
        flags:
          --help: {description: "Show the manual page"}
      init:
        description: Initialize submodules
        flags:
          --help: {description: "Show the manual page"}
      sync:
        description: Sync submodule URLs
        flags:
          --help: {description: "Show the manual page"}
      foreach:
        description: Run a command in each submodule
        flags:
          --help: {description: "Show the manual page"}
        args: any
  config:
    description: Get and set repository or global options
    flags:
      --global: {description: "Use global config file"}
      --local: {description: "Use repository config file"}
      --system: {description: "Use system config file"}
      -l: {description: "List all"}
      --list: {description: "List all"}
      --get: {description: "Get value: name [value-pattern]"}
      --unset: {description: "Remove a variable: name [value-pattern]"}
      -e: {description: "Open an editor"}
      --edit: {description: "Open an editor"}
      --help: {description: "Show the manual page"}
    args:
      exec: git config --list --name-only | sort -u
  reflog:
    description: Manage reflog information
    flags:
      --help: {description: "Show the manual page"}
  describe:
    description: Give an object a human readable name based on an available ref
    flags:
      --tags: {description: "Use any tag, even unannotated"}
      --always: {description: "Show abbreviated commit object as fallback"}
      --abbrev: {value: any, description: "Use <n> digits to display object names"}
      --help: {description: "Show the manual page"}
  help:
    description: Display help information about Git
    flags:
      --help: {description: "Show the manual page"}
    args: "@subcommands"

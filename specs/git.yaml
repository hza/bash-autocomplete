flags:
  -C: dir
  -c: any
  --git-dir: dir
  --work-tree: dir
  --no-pager:
  -p:
  --paginate:
  --bare:
  --help:
  --version:
commands:
  add:
    description: Add file contents to the index
    flags:
      -A:
      --all:
      -u:
      --update:
      -p:
      --patch:
      -n:
      --dry-run:
      -f:
      --force:
      -v:
      --verbose:
      -N:
      --intent-to-add:
    args:
      - exec: git ls-files -m -o --exclude-standard
      - file
  restore:
    description: Restore working tree files
    flags:
      -S:
      --staged:
      -W:
      --worktree:
      -s:
        exec: git for-each-ref --format='%(refname:short)' refs/heads refs/remotes refs/tags
      --source:
        exec: git for-each-ref --format='%(refname:short)' refs/heads refs/remotes refs/tags
      -p:
      --patch:
    args:
      - exec: git diff --name-only --relative
      - exec: git diff --cached --name-only --relative
  rm:
    description: Remove files from the working tree and from the index
    flags:
      -f:
      --force:
      -r:
      --cached:
      -n:
      --dry-run:
    args:
      exec: git ls-files
  mv:
    description: Move or rename a file, a directory, or a symlink
    flags:
      -f:
      --force:
      -n:
      --dry-run:
    args: file
  status:
    description: Show the working tree status
    flags:
      -s:
      --short:
      -b:
      --branch:
      --porcelain:
      -u: any
      --untracked-files: any
      --ignored:
    args: file
  diff:
    description: Show changes between commits, commit and working tree, etc
    flags:
      --cached:
      --staged:
      --stat:
      --name-only:
      --name-status:
      -w:
      --ignore-all-space:
      --word-diff:
      --color-words:
      --no-index:
      -U: any
    args:
      - exec: git for-each-ref --format='%(refname:short)' refs/heads refs/remotes refs/tags
      - exec: git diff --name-only --relative
  commit:
    description: Record changes to the repository
    flags:
      -m: any
      --message: any
      -a:
      --all:
      --amend:
      --no-edit:
      -F: file
      --file: file
      -v:
      --verbose:
      -n:
      --no-verify:
      -s:
      --signoff:
      --fixup: any
      --allow-empty:
      -p:
      --patch:
    args:
      exec: git ls-files -m
  log:
    description: Show commit logs
    flags:
      --oneline:
      --graph:
      --all:
      --decorate:
      -p:
      --patch:
      --stat:
      -n: any
      --max-count: any
      --author: any
      --since: any
      --until: any
      --grep: any
      --follow:
      --reverse:
      --pretty: any
      --format: any
    args:
      - exec: git for-each-ref --format='%(refname:short)' refs/heads refs/remotes refs/tags
      - file
  show:
    description: Show various types of objects
    flags:
      --stat:
      --name-only:
      --oneline:
      --pretty: any
      --format: any
    args:
      exec: git for-each-ref --format='%(refname:short)' refs/heads refs/remotes refs/tags
  branch:
    description: List, create, or delete branches
    flags:
      -a:
      --all:
      -r:
      --remotes:
      -d:
      --delete:
      -D:
      -m:
      --move:
      -M:
      -c:
      --copy:
      -v:
      -vv:
      -u:
        exec: git for-each-ref --format='%(refname:short)' refs/remotes
      --set-upstream-to:
        exec: git for-each-ref --format='%(refname:short)' refs/remotes
      --unset-upstream:
      --show-current:
      --merged:
      --no-merged:
    args:
      exec: git for-each-ref --format='%(refname:short)' refs/heads
  checkout:
    description: Switch branches or restore working tree files
    flags:
      -b: any
      -B: any
      --orphan: any
      -f:
      --force:
      -t:
      --track:
      --detach:
      -p:
      --patch:
    args:
      - exec: git for-each-ref --format='%(refname:short)' refs/heads refs/remotes refs/tags
      - exec: git diff --name-only --relative
  switch:
    description: Switch branches
    flags:
      -c: any
      --create: any
      -C: any
      --force-create: any
      -d:
      --detach:
      -t:
      --track:
      --orphan: any
      -f:
      --force:
      --discard-changes:
    args:
      exec: git for-each-ref --format='%(refname:short)' refs/heads refs/remotes
  merge:
    description: Join two or more development histories together
    flags:
      --no-ff:
      --ff-only:
      --squash:
      --abort:
      --continue:
      -m: any
      --no-edit:
      -s: any
      --strategy: any
    args:
      exec: git for-each-ref --format='%(refname:short)' refs/heads refs/remotes refs/tags
  rebase:
    description: Reapply commits on top of another base tip
    flags:
      -i:
      --interactive:
      --continue:
      --abort:
      --skip:
      --onto:
        exec: git for-each-ref --format='%(refname:short)' refs/heads refs/remotes refs/tags
      --autosquash:
      --autostash:
    args:
      exec: git for-each-ref --format='%(refname:short)' refs/heads refs/remotes refs/tags
  cherry-pick:
    description: Apply the changes introduced by some existing commits
    flags:
      --continue:
      --abort:
      --skip:
      -n:
      --no-commit:
      -x:
    args:
      exec: git for-each-ref --format='%(refname:short)' refs/heads refs/remotes refs/tags
  reset:
    description: Reset current HEAD to the specified state
    flags:
      --soft:
      --mixed:
      --hard:
      --keep:
      -p:
      --patch:
    args:
      - exec: git for-each-ref --format='%(refname:short)' refs/heads refs/remotes refs/tags
      - exec: git diff --cached --name-only --relative
  revert:
    description: Revert some existing commits
    flags:
      --continue:
      --abort:
      --no-edit:
      -n:
      --no-commit:
    args:
      exec: git for-each-ref --format='%(refname:short)' refs/heads refs/tags
  tag:
    description: Create, list, delete or verify a tag object signed with GPG
    flags:
      -a:
      --annotate:
      -m: any
      --message: any
      -d:
      --delete:
      -l:
      --list:
      -f:
      --force:
      -s:
      --sign:
    args:
      exec: git tag
  fetch:
    description: Download objects and refs from another repository
    flags:
      --all:
      -p:
      --prune:
      --tags:
      --depth: any
      -v:
    args:
      exec: git remote
  pull:
    description: Fetch from and integrate with another repository or a local branch
    flags:
      --rebase:
      --no-rebase:
      --ff-only:
      --all:
      --autostash:
      -v:
    args:
      - exec: git remote
      - exec: git for-each-ref --format='%(refname:short)' refs/heads
  push:
    description: Update remote refs along with associated objects
    flags:
      -u:
      --set-upstream:
      -f:
      --force:
      --force-with-lease:
      --tags:
      --all:
      -d:
      --delete:
      --dry-run:
      --no-verify:
    args:
      - exec: git remote
      - exec: git for-each-ref --format='%(refname:short)' refs/heads refs/tags
  remote:
    description: Manage set of tracked repositories
    flags:
      -v:
      --verbose:
    commands:
      add:
        description: Add a remote
        flags:
          -f:
          -t: any
        args: any
      remove:
        description: Remove a remote
        args:
          exec: git remote
      rm:
        description: Remove a remote
        args:
          exec: git remote
      rename:
        description: Rename a remote
        args:
          exec: git remote
      set-url:
        description: Change the URL of a remote
        flags:
          --add:
          --delete:
          --push:
        args:
          exec: git remote
      get-url:
        description: Show the URL of a remote
        args:
          exec: git remote
      show:
        description: Show information about a remote
        args:
          exec: git remote
      prune:
        description: Delete stale remote-tracking branches
        args:
          exec: git remote
  stash:
    description: Stash the changes in a dirty working directory away
    commands:
      push:
        description: Save local changes to a new stash
        flags:
          -m: any
          --message: any
          -u:
          --include-untracked:
          -p:
          --patch:
          -k:
          --keep-index:
        args: file
      pop:
        description: Apply a stash and remove it
        flags:
          --index:
        args:
          exec: git stash list --format='%gd'
      apply:
        description: Apply a stash, keeping it
        flags:
          --index:
        args:
          exec: git stash list --format='%gd'
      drop:
        description: Remove a stash
        args:
          exec: git stash list --format='%gd'
      show:
        description: Show the changes in a stash
        flags:
          -p:
          --patch:
        args:
          exec: git stash list --format='%gd'
      list:
        description: List stashes
      clear:
        description: Remove all stashes
      branch:
        description: Create a branch from a stash
        args: any
  clone:
    description: Clone a repository into a new directory
    flags:
      --depth: any
      -b: any
      --branch: any
      --single-branch:
      --recursive:
      --recurse-submodules:
      --bare:
      --mirror:
      -o: any
      --origin: any
    args: dir
  init:
    description: Create an empty Git repository or reinitialize an existing one
    flags:
      --bare:
      -b: any
      --initial-branch: any
      -q:
      --quiet:
    args: dir
  blame:
    description: Show what revision and author last modified each line of a file
    flags:
      -L: any
      -w:
      -C:
      -M:
      -e:
    args:
      exec: git ls-files
  clean:
    description: Remove untracked files from the working tree
    flags:
      -n:
      --dry-run:
      -f:
      --force:
      -d:
      -x:
      -X:
      -i:
    args: file
  grep:
    description: Print lines matching a pattern
    flags:
      -i:
      --ignore-case:
      -n:
      --line-number:
      -l:
      -w:
      -e: any
      -E:
    args: any
  bisect:
    description: Use binary search to find the commit that introduced a bug
    commands:
      start:
        description: Start a bisect session
      good:
        description: Mark a commit as good
      bad:
        description: Mark a commit as bad
      skip:
        description: Skip a commit
      reset:
        description: End the bisect session
      log:
        description: Show the bisect log
      run:
        description: Bisect automatically with a script
        args: file
  worktree:
    description: Manage multiple working trees
    commands:
      add:
        description: Create a new worktree
        flags:
          -b: any
          -f:
          --detach:
        args: dir
      list:
        description: List worktrees
      remove:
        description: Remove a worktree
        flags:
          -f:
          --force:
        args:
          exec: git worktree list --porcelain | sed -n 's/^worktree //p'
      prune:
        description: Prune stale worktree information
  submodule:
    description: Initialize, update or inspect submodules
    commands:
      add:
        description: Add a submodule
        args: any
      update:
        description: Update submodules to the recorded commit
        flags:
          --init:
          --recursive:
          --remote:
      status:
        description: Show submodule status
      init:
        description: Initialize submodules
      sync:
        description: Sync submodule URLs
      foreach:
        description: Run a command in each submodule
        args: any
  config:
    description: Get and set repository or global options
    flags:
      --global:
      --local:
      --system:
      -l:
      --list:
      --get:
      --unset:
      -e:
      --edit:
    args:
      exec: git config --list --name-only | sort -u
  reflog:
    description: Manage reflog information
  describe:
    description: Give an object a human readable name based on an available ref
    flags:
      --tags:
      --always:
      --abbrev: any
  help:
    description: Display help information about Git
    args: "@subcommands"

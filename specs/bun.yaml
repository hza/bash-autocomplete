flags:
  --watch: {description: restart on file change, show: always}
  --hot: {description: reload in place on file change}
  --no-clear-screen: {description: keep the screen on reload}
  --smol: {description: use less memory}
  -r: {value: file, description: module to preload, show: always}
  --preload: {value: file, description: module to preload}
  --inspect: {description: activate the debugger}
  --inspect-wait: {description: activate the debugger and wait for a connection}
  --inspect-brk: {description: activate the debugger and break on the first line}
  --env-file: {value: file, description: load environment variables from a file}
  --cwd: {value: dir, description: run in this directory, show: always}
  -c: {value: file, description: path to bunfig.toml, show: always}
  --config: {value: file, description: path to bunfig.toml, show: always}
  --install:
    value: {exec: "printf '%s\\n' auto fallback force"}
    description: auto-install mode
  --no-install: {description: disable auto-install, show: always}
  --port: {value: any, description: default port for Bun.serve}
  -e: {value: any, description: evaluate a script, show: always}
  --eval: {value: any, description: evaluate a script}
  -p: {value: any, description: evaluate a script and print the result, show: always}
  --print: {value: any, description: evaluate a script and print the result}
  -b: {description: force the Bun runtime instead of Node.js}
  --bun: {description: force the Bun runtime instead of Node.js}
  -v: {description: print the version}
  --version: {description: print the version}
  --revision: {description: print the version with the commit}
  -h: {description: print help, show: always}
  --help: {description: print help, show: always}
args:
  - exec: node -e 'let d=process.cwd(),p=require("path");for(;;){try{const j=require(p.join(d,"package.json"));console.log(Object.keys(j.scripts||{}).join("\n"));break}catch(e){const u=p.dirname(d);if(u===d)break;d=u}}'
  - file
commands:
  run:
    description: run a file or a package.json script
    flags:
      --silent: {description: do not print the script command}
      -F: {value: any, description: run in workspaces matching a pattern}
      --filter: {value: any, description: run in workspaces matching a pattern}
      --workspaces: {description: run in all workspaces}
      --parallel: {description: run several scripts concurrently}
      --sequential: {description: run several scripts in order}
      --no-exit-on-error: {description: keep running other scripts after a failure}
      --if-present: {description: no error if the entry point is missing}
      --shell:
        value: {exec: "printf '%s\\n' bun system"}
        description: shell for package.json scripts
    args:
      - exec: node -e 'let d=process.cwd(),p=require("path");for(;;){try{const j=require(p.join(d,"package.json"));console.log(Object.keys(j.scripts||{}).join("\n"));break}catch(e){const u=p.dirname(d);if(u===d)break;d=u}}'
      - file
  test:
    description: run tests
    flags:
      --timeout: {value: any, description: per-test timeout in ms}
      -u: {description: update snapshots}
      --update-snapshots: {description: update snapshots}
      -t: {value: any, description: run only tests whose name matches}
      --test-name-pattern: {value: any, description: run only tests whose name matches}
      --only: {description: run only tests marked only}
      --todo: {description: include tests marked todo}
      --bail: {value: any, description: stop after this many failures}
      --coverage: {description: collect coverage, show: always}
      --coverage-reporter:
        value: {exec: "printf '%s\\n' text lcov"}
        description: coverage format
      --coverage-dir: {value: dir, description: coverage output directory}
      --reporter:
        value: {exec: "printf '%s\\n' junit dots"}
        description: output format
      --reporter-outfile: {value: file, description: reporter output file}
      --dots: {description: dots reporter}
      --only-failures: {description: show only failures}
      --rerun-each: {value: any, description: run each file this many times}
      --retry: {value: any, description: default retry count}
      --randomize: {description: run tests in random order}
      --seed: {value: any, description: random seed}
      --concurrent: {description: run tests concurrently}
      --max-concurrency: {value: any, description: max concurrent tests}
      --parallel: {value: any, description: run files in this many worker processes}
      --isolate: {description: fresh global object per file}
      --changed:
        value: {exec: "git for-each-ref --format='%(refname:short)' refs/heads refs/tags", tree: true}
        description: only tests affected by changes since this git ref
      --shard: {value: any, description: run one shard such as 1/3}
      --pass-with-no-tests: {description: succeed when no tests are found}
      --watch: {description: rerun on file change, show: always}
    args: file
  x:
    description: run a package binary and install it if needed (bunx)
    args:
      exec: d=$PWD; while :; do [ -d "$d/node_modules/.bin" ] && ls "$d/node_modules/.bin"; [ "$d" = / ] && break; d=$(dirname "$d"); done
  repl:
    description: start a REPL
  exec:
    description: run a shell script with the Bun shell
    args: any
  install:
    aliases: [i]
    description: install dependencies from package.json
    flags:
      -p: {description: skip devDependencies}
      --production: {description: skip devDependencies}
      --no-save: {description: do not update package.json or the lockfile}
      --dry-run: {description: do not change anything}
      --frozen-lockfile: {description: fail if the lockfile would change}
      -f: {description: reinstall everything from the registry}
      --force: {description: reinstall everything from the registry}
      --no-cache: {description: ignore the manifest cache}
      --silent: {description: no output}
      --verbose: {description: very verbose output}
      --ignore-scripts: {description: skip the project lifecycle scripts}
      -g: {description: install globally}
      --global: {description: install globally}
      --backend:
        value: {exec: "printf '%s\\n' clonefile hardlink symlink copyfile"}
        description: how files are installed
      --registry: {value: any, description: registry URL}
      --omit:
        value: {exec: "printf '%s\\n' dev optional peer"}
        description: dependency type to skip
      --linker:
        value: {exec: "printf '%s\\n' isolated hoisted"}
        description: linker strategy
      --lockfile-only: {description: only write the lockfile}
      --filter: {value: any, description: install for matching workspaces}
  add:
    aliases: [a]
    description: add a dependency to package.json
    flags:
      -d: {description: add to devDependencies}
      --dev: {description: add to devDependencies}
      --optional: {description: add to optionalDependencies}
      --peer: {description: add to peerDependencies}
      -E: {description: pin the exact version}
      --exact: {description: pin the exact version}
      --trust: {description: add to trustedDependencies}
      -g: {description: install globally}
      --global: {description: install globally}
      --no-save: {description: do not update package.json or the lockfile}
      --dry-run: {description: do not change anything}
      --ignore-scripts: {description: skip the project lifecycle scripts}
      --registry: {value: any, description: registry URL}
    args: any
  remove:
    aliases: [rm]
    description: remove a dependency from package.json
    flags:
      -g: {description: remove a global package}
      --global: {description: remove a global package}
      --dry-run: {description: do not change anything}
    args:
      exec: node -e 'let d=process.cwd(),p=require("path");for(;;){try{const j=require(p.join(d,"package.json"));console.log(Object.keys(Object.assign({},j.dependencies,j.devDependencies,j.optionalDependencies,j.peerDependencies)).join("\n"));break}catch(e){const u=p.dirname(d);if(u===d)break;d=u}}'
  update:
    description: update outdated dependencies
    flags:
      -i: {description: choose updates interactively, show: always}
      --interactive: {description: choose updates interactively, show: always}
      --latest: {description: update to the latest version ignoring ranges, show: always}
      -r: {description: update in all workspaces, show: always}
      --recursive: {description: update in all workspaces, show: always}
    args:
      exec: node -e 'let d=process.cwd(),p=require("path");for(;;){try{const j=require(p.join(d,"package.json"));console.log(Object.keys(Object.assign({},j.dependencies,j.devDependencies,j.optionalDependencies,j.peerDependencies)).join("\n"));break}catch(e){const u=p.dirname(d);if(u===d)break;d=u}}'
  outdated:
    description: show outdated dependencies
    args:
      exec: node -e 'let d=process.cwd(),p=require("path");for(;;){try{const j=require(p.join(d,"package.json"));console.log(Object.keys(Object.assign({},j.dependencies,j.devDependencies,j.optionalDependencies,j.peerDependencies)).join("\n"));break}catch(e){const u=p.dirname(d);if(u===d)break;d=u}}'
  why:
    description: explain why a package is installed
    args:
      exec: node -e 'let d=process.cwd(),p=require("path");for(;;){try{const j=require(p.join(d,"package.json"));console.log(Object.keys(Object.assign({},j.dependencies,j.devDependencies,j.optionalDependencies,j.peerDependencies)).join("\n"));break}catch(e){const u=p.dirname(d);if(u===d)break;d=u}}'
  audit:
    description: check installed packages for vulnerabilities
  info:
    description: show package metadata from the registry
    args: any
  link:
    description: register or link a local package
    args: any
  unlink:
    description: unregister a local package
  publish:
    description: publish a package to the npm registry
    flags:
      --dry-run: {description: do not publish, show: always}
      --access:
        show: always
        value: {exec: "printf '%s\\n' public restricted"}
        description: package access level
      --tag: {value: any, description: dist-tag to publish under, show: always}
      --otp: {value: any, description: one-time password, show: always}
  patch:
    description: prepare a package for patching
    flags:
      --commit: {description: write the patch file, show: always}
    args:
      exec: node -e 'let d=process.cwd(),p=require("path");for(;;){try{const j=require(p.join(d,"package.json"));console.log(Object.keys(Object.assign({},j.dependencies,j.devDependencies,j.optionalDependencies,j.peerDependencies)).join("\n"));break}catch(e){const u=p.dirname(d);if(u===d)break;d=u}}'
  pm:
    description: package manager utilities
    commands:
      scan: {description: scan the lockfile for vulnerabilities}
      pack: {description: create a tarball of the workspace}
      bin: {description: print the bin folder path}
      why:
        description: explain why a package is installed
        args:
          exec: node -e 'let d=process.cwd(),p=require("path");for(;;){try{const j=require(p.join(d,"package.json"));console.log(Object.keys(Object.assign({},j.dependencies,j.devDependencies,j.optionalDependencies,j.peerDependencies)).join("\n"));break}catch(e){const u=p.dirname(d);if(u===d)break;d=u}}'
      whoami: {description: print the npm username}
      view:
        description: show package metadata from the registry
        args: any
      version:
        description: bump the version and create a git tag
        args: {exec: "printf '%s\\n' patch minor major prepatch preminor premajor prerelease from-git"}
      pkg: {description: manage data in package.json}
      hash: {description: hash the lockfile}
      hash-string: {description: print the string hashed for the lockfile}
      hash-print: {description: print the hash stored in the lockfile}
      cache:
        description: print the cache folder path
        commands:
          rm: {description: clear the cache}
      migrate: {description: migrate another lockfile without installing}
      untrusted: {description: list untrusted dependencies with scripts}
      trust:
        description: run scripts of untrusted dependencies and trust them
        flags:
          --all: {description: trust all untrusted dependencies, show: always}
        args:
          exec: node -e 'let d=process.cwd(),p=require("path");for(;;){try{const j=require(p.join(d,"package.json"));console.log(Object.keys(Object.assign({},j.dependencies,j.devDependencies,j.optionalDependencies,j.peerDependencies)).join("\n"));break}catch(e){const u=p.dirname(d);if(u===d)break;d=u}}'
      default-trusted: {description: print the default trusted list}
  build:
    description: bundle TypeScript and JavaScript
    flags:
      --production: {description: set NODE_ENV=production and minify}
      --compile: {description: build a standalone executable, show: always}
      --bytecode: {description: use a bytecode cache}
      --watch: {description: rebuild on file change, show: always}
      --target:
        show: always
        value: {exec: "printf '%s\\n' browser bun node"}
        description: runtime the bundle targets
      --outdir: {value: dir, description: output directory, show: always}
      --outfile: {value: file, description: output file, show: always}
      --sourcemap:
        show: always
        value: {exec: "printf '%s\\n' linked inline external none"}
        description: source map mode
      --format:
        value: {exec: "printf '%s\\n' esm cjs iife"}
        description: module format
      --root: {value: dir, description: root of multiple entry points}
      --splitting: {description: enable code splitting}
      -e: {value: any, description: module to keep external, show: always}
      --external: {value: any, description: module to keep external, show: always}
      --packages:
        value: {exec: "printf '%s\\n' bundle external"}
        description: bundle or externalize dependencies
      --public-path: {value: any, description: prefix for import paths}
      --minify: {description: enable all minification, show: always}
      --minify-syntax: {description: minify syntax}
      --minify-whitespace: {description: minify whitespace}
      --minify-identifiers: {description: minify identifiers}
      --keep-names: {description: keep function and class names}
      --no-bundle: {description: transpile only}
      --metafile: {value: file, description: write build metadata JSON}
      --banner: {value: any, description: text to prepend}
      --footer: {value: any, description: text to append}
    args: file
  init:
    description: start an empty project
    flags:
      -y: {description: accept all defaults, show: always}
      --yes: {description: accept all defaults, show: always}
      --react: {description: React template, show: always}
      --minimal: {description: only type definitions, show: always}
  create:
    aliases: [c]
    description: create a project from a template
    args: any
  upgrade:
    description: upgrade Bun
    flags:
      --canary: {description: upgrade to the canary build, show: always}
      --stable: {description: upgrade to the latest stable build, show: always}
  feedback:
    description: send feedback to the Bun team
    args: file

version: '20261015'
description: PostgreSQL interactive terminal
flags:
  --host: {aliases: [-h], value: "@hosts", description: "Database server host or socket directory", show: always}
  --port: {aliases: [-p], value: any, description: "Database server port", show: always}
  --username: {aliases: [-U], value: "@users", description: "Database user name", show: always}
  --dbname: {aliases: [-d], value: {exec: "psql -lqt 2>/dev/null | cut -d'|' -f1 | sed 's/ //g' | grep .", cache: 60}, description: "Database name to connect to", show: always}
  --command: {aliases: [-c], value: any, description: "Run one command (SQL or meta) and exit", show: always}
  --file: {aliases: [-f], value: {file: "*.sql"}, description: "Execute commands from file, then exit", show: always}
  --list: {aliases: [-l], description: "List available databases, then exit"}
  --set: {aliases: [-v], value: any, description: "Set psql variable NAME=VALUE", repeat: true}
  --no-psqlrc: {aliases: [-X], description: "Do not read startup file (~/.psqlrc)"}
  --single-transaction: {aliases: ['-1'], description: "Execute as a single transaction (with -f/-c)"}
  --echo-all: {aliases: [-a], description: "Echo all input from script"}
  --echo-errors: {aliases: [-b], description: "Echo failed commands"}
  --echo-queries: {aliases: [-e], description: "Echo commands sent to server"}
  --echo-hidden: {aliases: [-E], description: "Display queries that internal commands generate"}
  --log-file: {aliases: [-L], value: file, description: "Send session log to file"}
  --no-readline: {aliases: [-n], description: "Disable readline line editing"}
  --output: {aliases: [-o], value: file, description: "Send query results to file (or |pipe)"}
  --quiet: {aliases: [-q], description: "Run quietly (no messages, only query output)"}
  --single-step: {aliases: [-s], description: "Single-step mode (confirm each query)"}
  --single-line: {aliases: [-S], description: "Single-line mode (end of line terminates command)"}
  --no-align: {aliases: [-A], description: "Unaligned table output mode"}
  --csv: {description: "CSV table output mode"}
  --field-separator: {aliases: [-F], value: any, description: "Field separator for unaligned output"}
  --html: {aliases: [-H], description: "HTML table output mode"}
  --pset: {aliases: [-P], value: any, description: "Set printing option VAR=ARG (see \\pset)", repeat: true}
  --record-separator: {aliases: [-R], value: any, description: "Record separator for unaligned output"}
  --tuples-only: {aliases: [-t], description: "Print rows only (no headers/footers)", show: always}
  --table-attr: {aliases: [-T], value: any, description: "HTML table tag attributes"}
  --expanded: {aliases: [-x], description: "Expanded table output"}
  --field-separator-zero: {aliases: [-z], description: "Zero byte as field separator (unaligned)"}
  --record-separator-zero: {aliases: ['-0'], description: "Zero byte as record separator (unaligned)"}
  --no-password: {aliases: [-w], description: "Never prompt for password"}
  --password: {aliases: [-W], description: "Force password prompt"}
  --version: {aliases: [-V], description: "Print version and exit"}
  --help: {description: "Show help and exit"}
args: {exec: "psql -lqt 2>/dev/null | cut -d'|' -f1 | sed 's/ //g' | grep .", cache: 60}
snippets:
  - key: u
    mark: pin
    command: "psql postgresql://user:secret@localhost:5432/mydb"
    description: "connect with a connection URL"
  - key: f
    mark: pin
    command: "psql -d mydb -v ON_ERROR_STOP=1 -1 -f script.sql"
    description: "run a SQL file in one transaction, stop on error"
  - key: c
    mark: pin
    command: "psql -d mydb -c '\\copy (SELECT * FROM users) TO users.csv CSV HEADER'"
    description: "export a query to a local CSV file"
  - key: i
    command: "psql -d mydb -c '\\copy users FROM users.csv CSV HEADER'"
    description: "load a local CSV file into a table"
  - key: t
    mark: pin
    command: "psql -d mydb -c '\\dt+'"
    description: "list tables with sizes"
  - key: l
    command: "psql -l"
    description: "list databases"
  - key: q
    command: "psql -d mydb -At -c 'SELECT count(*) FROM users'"
    description: "bare value for shell scripts"
  - key: a
    command: "psql -d mydb -c 'SELECT pid, state, query FROM pg_stat_activity'"
    description: "show running sessions and queries"
  - key: s
    command: "psql -d mydb -c \"SELECT pg_size_pretty(pg_database_size('mydb'))\""
    description: "database size"

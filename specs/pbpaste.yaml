description: "Print the pasteboard contents"
flags:
  -help: {description: "Show usage"}
  -pboard:
    value: {exec: "printf '%s\\n' general ruler find font"}
    description: "Pasteboard to use"
  -Prefer:
    value: {exec: "printf '%s\\n' txt rtf ps"}
    description: "Data type to look for first"
examples:
  - command: "pbpaste > path/to/file"
    description: "Write the contents of the clipboard to a file"
  - command: "pbpaste | grep search_string"
    description: "Use the contents of the clipboard as input to a command"

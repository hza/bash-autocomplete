version: '20261015'
description: Run ad-hoc Ansible tasks against hosts
flags:
  --help: {aliases: [-h], description: "Show help"}
  --version: {description: "Show version"}
  --inventory: {aliases: [-i], value: [file, dir], description: "Inventory file, dir or host list", show: always}
  --module-name: {aliases: [-m], value: {enum: [ping, command, shell, raw, script, copy, fetch, file, template, lineinfile, apt, yum, dnf, package, pip, service, systemd, user, group, setup, gather_facts, debug, reboot, cron, git, get_url, unarchive, stat, uri, wait_for]}, description: "Module name (default command)", show: always}
  --args: {aliases: [-a], value: any, description: "Module arguments", show: always}
  --become: {aliases: [-b], description: "Become (sudo)", show: always}
  --become-user: {value: any, description: "User to become (default root)"}
  --become-method: {value: {enum: [sudo, su, doas, pbrun, pfexec, runas, machinectl]}, description: "Privilege escalation method"}
  --ask-become-pass: {aliases: [-K], description: "Ask for the become password"}
  --user: {aliases: [-u], value: any, description: "Remote user"}
  --ask-pass: {aliases: [-k], description: "Ask for the SSH password"}
  --private-key: {value: file, description: "SSH private key"}
  --key-file: {value: file, description: "SSH private key"}
  --connection: {aliases: [-c], value: {enum: [ssh, paramiko, local, docker, winrm, psrp]}, description: "Connection type"}
  --timeout: {aliases: [-T], value: any, description: "Connection timeout in seconds"}
  --limit: {aliases: [-l], value: any, description: "Limit to a host pattern"}
  --forks: {aliases: [-f], value: any, description: "Parallel processes (default 5)"}
  --extra-vars: {aliases: [-e], value: any, description: "Extra variables key=value, JSON or @file"}
  --one-line: {aliases: [-o], description: "One-line output"}
  --tree: {aliases: [-t], value: dir, description: "Write output per host into a directory"}
  --check: {aliases: [-C], description: "Dry run, report what would change"}
  --diff: {aliases: [-D], description: "Show diffs of changed files"}
  --background: {aliases: [-B], value: any, description: "Run asynchronously, fail after N seconds"}
  --poll: {aliases: [-P], value: any, description: "Async poll interval"}
  --list-hosts: {description: "List matching hosts and exit"}
  --vault-id: {value: any, description: "Vault identity label@source"}
  --ask-vault-pass: {aliases: [-J], description: "Ask for the vault password"}
  --vault-password-file: {value: file, description: "Vault password file"}
  --playbook-dir: {value: dir, description: "Pretend playbook directory (roles, group_vars)"}
  --module-path: {aliases: [-M], value: dir, description: "Extra module path"}
  -v: {description: "Verbose (-vvv for more)", repeat: true}
  --verbose: {description: "Verbose", repeat: true}
args: {exec: "echo all; { ansible-inventory --graph 2>/dev/null | sed -n 's/^[ |-]*@\\([^:]*\\):$/\\1/p'; ansible all --list-hosts 2>/dev/null | sed -n 's/^ *//; /^hosts (/d; p'; } | sort -u", cache: 60}
snippets:
  - key: p
    mark: pin
    command: "ansible all -m ping"
    description: "can we reach everyone?"
  - key: s
    mark: pin
    command: "ansible web -b -m shell -a 'uptime'"
    description: "shell command on a group"
  - key: f
    mark: pin
    command: "ansible myhost -m setup -a 'filter=ansible_distribution*'"
    description: "peek at host facts"
  - key: l
    command: "ansible all -i inventory.ini --list-hosts"
    description: "which hosts the inventory yields"
  - key: c
    command: "ansible web -b -m copy -a 'src=./file dest=/tmp/file'"
    description: "push a file to hosts"
  - key: r
    command: "ansible web -b -m service -a 'name=nginx state=restarted'"
    description: "restart a service"
  - key: b
    command: "ansible web -b -m reboot"
    description: "reboot and wait"
  - key: i
    command: "ansible localhost -c local -m debug -a 'var=hostvars'"
    description: "inspect vars without ssh"

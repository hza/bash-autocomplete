version: '20261013'
description: Run Ansible playbooks
flags:
  -h: {description: "Show help"}
  --help: {description: "Show help"}
  --version: {description: "Show version"}
  -i: {value: [file, dir], description: "Inventory file, dir or host list", show: always}
  --inventory: {value: [file, dir], description: "Inventory file, dir or host list"}
  -l: {value: {exec: "{ ansible-inventory --graph 2>/dev/null | sed -n 's/^[ |-]*@\\([^:]*\\):$/\\1/p'; ansible all --list-hosts 2>/dev/null | sed -n 's/^ *//; /^hosts (/d; p'; } | sort -u", cache: 60}, description: "Limit to a host pattern", show: always}
  --limit: {value: {exec: "{ ansible-inventory --graph 2>/dev/null | sed -n 's/^[ |-]*@\\([^:]*\\):$/\\1/p'; ansible all --list-hosts 2>/dev/null | sed -n 's/^ *//; /^hosts (/d; p'; } | sort -u", cache: 60}, description: "Limit to a host pattern"}
  -t: {value: any, description: "Run only tasks with these tags"}
  --tags: {value: any, description: "Run only tasks with these tags"}
  --skip-tags: {value: any, description: "Skip tasks with these tags"}
  -e: {value: any, description: "Extra variables key=value, JSON or @file", show: always}
  --extra-vars: {value: any, description: "Extra variables key=value, JSON or @file"}
  -C: {description: "Dry run, report what would change", show: always}
  --check: {description: "Dry run, report what would change"}
  -D: {description: "Show diffs of changed files"}
  --diff: {description: "Show diffs of changed files"}
  -b: {description: "Become (sudo)"}
  --become: {description: "Become (sudo)"}
  --become-user: {value: any, description: "User to become (default root)"}
  --become-method: {value: {exec: "printf '%s\\n' sudo su doas pbrun pfexec runas machinectl"}, description: "Privilege escalation method"}
  -K: {description: "Ask for the become password"}
  --ask-become-pass: {description: "Ask for the become password"}
  -u: {value: any, description: "Remote user"}
  --user: {value: any, description: "Remote user"}
  -k: {description: "Ask for the SSH password"}
  --ask-pass: {description: "Ask for the SSH password"}
  --private-key: {value: file, description: "SSH private key"}
  --key-file: {value: file, description: "SSH private key"}
  -c: {value: {exec: "printf '%s\\n' ssh paramiko local docker winrm psrp"}, description: "Connection type"}
  --connection: {value: {exec: "printf '%s\\n' ssh paramiko local docker winrm psrp"}, description: "Connection type"}
  -T: {value: any, description: "Connection timeout in seconds"}
  --timeout: {value: any, description: "Connection timeout in seconds"}
  -f: {value: any, description: "Parallel processes (default 5)"}
  --forks: {value: any, description: "Parallel processes (default 5)"}
  --list-hosts: {description: "List matching hosts and exit"}
  --list-tasks: {description: "List tasks and exit"}
  --list-tags: {description: "List tags and exit"}
  --syntax-check: {description: "Check playbook syntax and exit"}
  --start-at-task: {value: any, description: "Start at the task with this name"}
  --step: {description: "Confirm each task"}
  --flush-cache: {description: "Clear the fact cache"}
  --force-handlers: {description: "Run handlers even if a task fails"}
  --vault-id: {value: any, description: "Vault identity label@source"}
  -J: {description: "Ask for the vault password"}
  --ask-vault-pass: {description: "Ask for the vault password"}
  --vault-password-file: {value: file, description: "Vault password file"}
  -M: {value: dir, description: "Extra module path"}
  --module-path: {value: dir, description: "Extra module path"}
  -v: {description: "Verbose (-vvv for more)", repeat: true}
  --verbose: {description: "Verbose", repeat: true}
args: {file: "*.yml *.yaml"}
snippets:
  - key: r
    mark: pin
    command: "ansible-playbook -i inventory.ini site.yml"
    description: "plain run"
  - key: c
    mark: pin
    command: "ansible-playbook -i inventory.ini site.yml --check --diff"
    description: "preview changes"
  - key: l
    mark: pin
    command: "ansible-playbook -i inventory.ini site.yml -l web01"
    description: "only one host"
  - key: t
    command: "ansible-playbook site.yml --tags deploy"
    description: "only tagged tasks"
  - key: s
    command: "ansible-playbook site.yml --syntax-check"
    description: "validate YAML and structure"
  - key: k
    command: "ansible-playbook site.yml --list-tasks"
    description: "what would run, in order"
  - key: b
    command: "ansible-playbook site.yml -b -K"
    description: "sudo with password prompt"
  - key: v
    command: "ansible-playbook site.yml -e @vars.yml --ask-vault-pass"
    description: "vars file plus vault password"
  - key: a
    command: "ansible-playbook site.yml --start-at-task 'Install packages'"
    description: "resume from a task"

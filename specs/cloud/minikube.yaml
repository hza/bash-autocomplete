version: '20261015'
description: Run a local Kubernetes cluster
flags:
  --help: {aliases: [-h], description: "Show help"}
  --profile: {aliases: [-p], value: {exec: "minikube profile list -o json 2>/dev/null | tr '{,' '\\n\\n' | sed -n 's/^\"Name\":\"\\([^\"]*\\)\".*/\\1/p' | sort -u", cache: 60}, description: "Profile (cluster) name", show: always}
  --alsologtostderr: {description: "Log to stderr as well as files"}
  --v: {aliases: [-v], value: any, description: "Log verbosity level"}
  --log_dir: {value: dir, description: "Log directory"}
  --user: {value: any, description: "User name for auditing"}
commands:
  start:
    description: Start a cluster
    flags:
      --driver: {value: {enum: [docker, podman, qemu2, vfkit, hyperkit, virtualbox, vmware, parallels, kvm2, hyperv, ssh, none]}, description: "Driver to use", show: always}
      --cpus: {value: any, description: "Number of CPUs or 'max'", show: always}
      --memory: {value: any, description: "Memory, e.g. 4g or 'max'", show: always}
      --disk-size: {value: any, description: "Disk size, e.g. 20g"}
      --kubernetes-version: {value: {enum: [stable, latest]}, description: "Kubernetes version (e.g. v1.30.0)"}
      --container-runtime: {value: {enum: [docker, containerd, cri-o]}, description: "Container runtime"}
      --nodes: {aliases: [-n], value: any, description: "Number of nodes"}
      --addons: {value: any, description: "Addons to enable"}
      --extra-config: {value: any, description: "Component option component.key=value"}
      --mount: {description: "Mount a host directory"}
      --mount-string: {value: any, description: "host:vm mount pair"}
      --ports: {value: any, description: "Ports to expose (docker/podman)"}
      --insecure-registry: {value: any, description: "Insecure registries"}
      --network: {value: any, description: "Network to use"}
      --force: {description: "Force start ignoring checks"}
      --wait: {value: {enum: [all, none, apiserver, system_pods, default_sa, apps_running, node_ready, kubelet]}, description: "Components to wait for"}
  stop: {description: "Stop a cluster", flags: {--all: {description: "Stop all profiles"}, --keep-context-active: {description: "Keep the kubectl context"}}}
  delete: {description: "Delete a cluster", flags: {--all: {description: "Delete all profiles", show: always}, --purge: {description: "Also delete ~/.minikube"}}}
  pause: {description: "Pause Kubernetes", flags: {--all-namespaces: {aliases: [-A], description: "All namespaces"}}}
  unpause: {description: "Unpause Kubernetes"}
  status: {description: "Show cluster status", flags: {--output: {aliases: [-o], value: {enum: [text, json]}, description: "Output format"}, -l: {description: "Show layout"}}}
  profile:
    description: Show or switch the current profile
    commands:
      list: {description: "List profiles", flags: {--output: {aliases: [-o], value: {enum: [table, json]}, description: "Output format"}}}
    args: {exec: "minikube profile list -o json 2>/dev/null | tr '{,' '\\n\\n' | sed -n 's/^\"Name\":\"\\([^\"]*\\)\".*/\\1/p' | sort -u", cache: 60}
  addons:
    description: Manage addons
    commands:
      list: {description: "List addons and status", flags: {-o: {value: {enum: [list, json]}, description: "Output format"}}}
      enable: {description: "Enable an addon", args: {exec: "minikube addons list -o json 2>/dev/null | tr '{,' '\\n\\n' | sed -n 's/^ *\"\\([a-z0-9-]*\\)\": *$/\\1/p'", cache: 3600}}
      disable: {description: "Disable an addon", args: {exec: "minikube addons list -o json 2>/dev/null | tr '{,' '\\n\\n' | sed -n 's/^ *\"\\([a-z0-9-]*\\)\": *$/\\1/p'", cache: 3600}}
      configure: {description: "Configure an addon", args: any}
      open: {description: "Open an addon in the browser", args: any}
      images: {description: "List images of an addon", args: any}
  dashboard: {description: "Open the Kubernetes dashboard", flags: {--url: {description: "Print the URL instead of opening a browser", show: always}, --port: {value: any, description: "Proxy port"}}}
  service:
    description: Expose a service URL
    flags:
      --url: {description: "Print the URL only", show: always}
      --namespace: {aliases: [-n], value: {exec: "kubectl get ns -o name 2>/dev/null | sed 's|namespace/||'", cache: 30}, description: "Namespace"}
      --https: {description: "Use https"}
      --all: {description: "Forward all services"}
    commands:
      list: {description: "List services and URLs", flags: {-n: {value: any, description: "Namespace"}}}
    args: {exec: "kubectl get svc -o name 2>/dev/null | sed 's|service/||'"}
  tunnel: {description: "Route LoadBalancer services to the host", flags: {--cleanup: {aliases: [-c], description: "Clean up orphaned routes"}, --bind-address: {value: any, description: "Bind address"}}}
  mount: {description: "Mount a host directory into the cluster (host:vm)", args: any}
  ssh: {description: "SSH into the node", flags: {--node: {aliases: [-n], value: any, description: "Node name"}, --native-ssh: {value: {enum: ['true', 'false']}, description: "Use the Go SSH client"}}, args: any}
  ssh-key: {description: "Print the SSH key path"}
  ip: {description: "Print the node IP", flags: {-n: {value: any, description: "Node name"}}}
  kubectl: {description: "Run the matching kubectl version", args: any}
  docker-env: {description: "Print env to use the cluster's Docker", flags: {--unset: {aliases: [-u], description: "Print unset commands"}, --shell: {value: {enum: [bash, zsh, fish, powershell, cmd]}, description: "Shell syntax"}}}
  podman-env: {description: "Print env to use the cluster's Podman", flags: {-u: {description: "Print unset commands"}}}
  image:
    description: Manage images in the cluster
    commands:
      load: {description: "Load a local image into the cluster", args: any}
      build: {description: "Build an image inside the cluster", flags: {--tag: {aliases: [-t], value: any, description: "Image tag"}, -f: {value: file, description: "Dockerfile"}}, args: dir}
      ls: {description: "List images", aliases: [list]}
      rm: {description: "Remove images", aliases: [remove, unload], args: any}
      pull: {description: "Pull images", args: any}
      push: {description: "Push images", args: any}
      tag: {description: "Tag an image", args: any}
  cp: {description: "Copy a file into the node", args: file}
  node: {description: "Manage nodes", commands: {add: {description: "Add a node", flags: {--control-plane: {description: "Add a control-plane node"}, --worker: {value: {enum: ['true', 'false']}, description: "Worker node"}}}, list: {description: "List nodes"}, start: {description: "Start a node", args: any}, stop: {description: "Stop a node", args: any}, delete: {description: "Delete a node", args: any}}}
  config: {description: "Manage persistent config", commands: {set: {description: "Set a value", positional: [{enum: [driver, cpus, memory, disk-size, kubernetes-version, container-runtime, profile, WantUpdateNotification]}, any]}, get: {description: "Get a value", args: {enum: [driver, cpus, memory, disk-size, kubernetes-version, container-runtime, profile]}}, unset: {description: "Unset a value", args: {enum: [driver, cpus, memory, disk-size, kubernetes-version, container-runtime, profile]}}, view: {description: "Show config"}, defaults: {description: "List default values", args: any}}}
  logs: {description: "Show cluster logs", flags: {--follow: {aliases: [-f], description: "Follow"}, --length: {aliases: [-n], value: any, description: "Number of lines"}, --file: {value: file, description: "Write logs to a file"}, --problems: {description: "Show only problems"}}}
  update-context: {description: "Fix the kubeconfig context after an IP change"}
  update-check: {description: "Check for a newer version"}
  cache: {description: "Manage cached images", commands: {add: {description: "Cache an image", args: any}, delete: {description: "Remove a cached image", args: any}, list: {description: "List cached images"}, reload: {description: "Reload cached images"}}}
  version: {description: "Show version", flags: {--short: {description: "Version only"}, -o: {value: {enum: [json, yaml]}, description: "Output format"}}}
  options: {description: "Show global options"}
  completion: {description: "Generate shell completion", args: {enum: [bash, zsh, fish, powershell]}}
snippets:
  - key: s
    mark: pin
    command: "minikube start --driver=docker --cpus=4 --memory=8g"
    description: "roomier docker-backed cluster"
  - key: d
    mark: pin
    command: "minikube dashboard --url"
    description: "dashboard link, no browser"
  - key: e
    mark: pin
    command: "eval \"$(minikube docker-env)\""
    description: "build straight into the cluster"
  - key: u
    command: "minikube service my-svc --url"
    description: "reachable URL of a service"
  - key: l
    command: "minikube image load my-app:dev"
    description: "push a local image into the node"
  - key: t
    command: "minikube tunnel"
    description: "external IPs for LoadBalancers"
  - key: a
    command: "minikube addons enable ingress"
    description: "turn on the ingress controller"
  - key: x
    mark: pin
    command: "minikube delete --all"
    description: "wipe every profile"

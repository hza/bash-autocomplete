description: "Control Kubernetes clusters"
flags:
  -n: {value: {exec: "kubectl get namespaces -o name | sed 's|^namespace/||'"}, description: "Namespace scope for this request", show: always}
  --namespace: {value: {exec: "kubectl get namespaces -o name | sed 's|^namespace/||'"}, description: "Namespace scope for this request", show: always}
  -A: {description: "List the requested objects across all namespaces", show: always}
  --all-namespaces: {description: "List the requested objects across all namespaces", show: always}
  --context: {value: {exec: "kubectl config get-contexts -o name"}, description: "The name of the kubeconfig context to use", show: always}
  --cluster: {value: {exec: "kubectl config get-clusters | tail -n +2"}, description: "The name of the kubeconfig cluster to use"}
  --user: {value: {exec: "kubectl config get-users | tail -n +2"}, description: "The name of the kubeconfig user to use"}
  --kubeconfig: {value: file, description: "Path to the kubeconfig file to use for CLI requests", show: always}
  -s: {value: any, description: "The address and port of the Kubernetes API server"}
  --server: {value: any, description: "The address and port of the Kubernetes API server"}
  -v: {value: any, description: "Number for the log level verbosity"}
  --request-timeout: {value: any, description: "The length of time to wait before giving up on a single server request"}
  --insecure-skip-tls-verify: {description: "Skip TLS certificate verification"}
  -h: {description: "Help for kubectl", show: always}
  --help: {description: "Help for kubectl", show: always}
commands:
  get:
    description: Display one or many resources
    flags:
      -o: {value: {exec: "printf '%s\\n' json yaml wide name custom-columns= jsonpath= go-template="}, description: "Output format", show: always}
      --output: {value: {exec: "printf '%s\\n' json yaml wide name custom-columns= jsonpath= go-template="}, description: "Output format", show: always}
      -l: {value: any, description: "Selector (label query) to filter on"}
      --selector: {value: any, description: "Selector (label query) to filter on"}
      --field-selector: {value: any, description: "Selector (field query) to filter on"}
      -w: {description: "Watch for changes after listing"}
      --watch: {description: "Watch for changes after listing"}
      --show-labels: {description: "Show all labels as the last column"}
      -f: {value: file, description: "File identifying the resource to get", show: always}
      --filename: {value: file, description: "File identifying the resource to get", show: always}
    args:
      exec: kubectl api-resources --cached -o name
  describe:
    description: Show details of a specific resource or group of resources
    flags:
      -l: {value: any, description: "Selector (label query) to filter on"}
      --selector: {value: any, description: "Selector (label query) to filter on"}
      -f: {value: file, description: "File identifying the resource to describe", show: always}
      --filename: {value: file, description: "File identifying the resource to describe", show: always}
    args:
      exec: kubectl api-resources --cached -o name
  delete:
    description: Delete resources by file names, stdin, resources and names, or by resources and label selector
    flags:
      -f: {value: file, description: "File containing the resource to delete", show: always}
      --filename: {value: file, description: "File containing the resource to delete", show: always}
      -l: {value: any, description: "Selector (label query) to filter on"}
      --selector: {value: any, description: "Selector (label query) to filter on"}
      --all: {description: "Delete all resources in the namespace of the specified resource types", show: always}
      --force: {description: "Immediately remove resources from API and bypass graceful deletion"}
      --grace-period: {value: any, description: "Seconds given to the resource to terminate gracefully"}
      --wait: {description: "Wait for resources to be gone before returning"}
    args:
      exec: kubectl api-resources --cached -o name
  apply:
    description: Apply a configuration to a resource by file name or stdin
    flags:
      -f: {value: file, description: "The files that contain the configurations to apply", show: always}
      --filename: {value: file, description: "The files that contain the configurations to apply", show: always}
      -k: {value: dir, description: "Process a kustomization directory", show: always}
      --kustomize: {value: dir, description: "Process a kustomization directory", show: always}
      -R: {description: "Process the directory used in -f recursively"}
      --recursive: {description: "Process the directory used in -f recursively"}
      --dry-run: {value: {exec: "printf '%s\\n' none client server"}, description: "Only print the object that would be sent"}
      --server-side: {description: "Run apply on the server instead of the client"}
      --prune: {description: "Automatically delete resource objects that do not appear in the configs"}
  create:
    description: Create a resource from a file or from stdin
    flags:
      -f: {value: file, description: "File that contains the configuration to create", show: always}
      --filename: {value: file, description: "File that contains the configuration to create", show: always}
      --dry-run: {value: {exec: "printf '%s\\n' none client server"}, description: "Only print the object that would be sent"}
    args:
      exec: printf '%s\n' deployment namespace secret configmap service serviceaccount job cronjob role rolebinding clusterrole clusterrolebinding ingress quota priorityclass poddisruptionbudget
  edit:
    description: Edit a resource on the server
    flags:
      -f: {value: file, description: "File identifying the resource to edit"}
      --filename: {value: file, description: "File identifying the resource to edit"}
    args:
      exec: kubectl api-resources --cached -o name
  logs:
    description: Print the logs for a container in a pod
    flags:
      -f: {description: "Stream the logs", show: always}
      --follow: {description: "Stream the logs", show: always}
      -c: {value: any, description: "Print the logs of this container", show: always}
      --container: {value: any, description: "Print the logs of this container", show: always}
      --all-containers: {description: "Get all containers' logs in the pod(s)", show: always}
      -p: {description: "Print the logs for the previous instance of the container"}
      --previous: {description: "Print the logs for the previous instance of the container"}
      --tail: {value: any, description: "Lines of recent log file to display", show: always}
      --since: {value: any, description: "Only return logs newer than a relative duration like 5s, 2m, or 3h", show: always}
      --timestamps: {description: "Include timestamps on each line"}
      -l: {value: any, description: "Selector (label query) to filter on"}
      --selector: {value: any, description: "Selector (label query) to filter on"}
    args:
      exec: kubectl get pods -o name | sed 's|^pod/||'
  exec:
    description: Execute a command in a container
    flags:
      -i: {description: "Pass stdin to the container"}
      --stdin: {description: "Pass stdin to the container"}
      -t: {description: "Stdin is a TTY"}
      --tty: {description: "Stdin is a TTY"}
      -c: {value: any, description: "Container name"}
      --container: {value: any, description: "Container name"}
    args:
      exec: kubectl get pods -o name | sed 's|^pod/||'
  port-forward:
    description: Forward one or more local ports to a pod
    flags:
      --address: {value: any, description: "Addresses to listen on", show: always}
    args:
      exec: kubectl get pods,services -o name
      tree: true
  scale:
    description: Set a new size for a deployment, replica set, or stateful set
    flags:
      --replicas: {value: any, description: "The new desired number of replicas", show: always}
    args:
      exec: kubectl get deployments,statefulsets,replicasets -o name
      tree: true
  rollout:
    description: Manage the rollout of a resource
    commands:
      status: {description: "Show the status of the rollout", args: {exec: "kubectl get deployments,daemonsets,statefulsets -o name", tree: true}}
      restart: {description: "Restart a resource", args: {exec: "kubectl get deployments,daemonsets,statefulsets -o name", tree: true}}
      undo: {description: "Undo a previous rollout", args: {exec: "kubectl get deployments,daemonsets,statefulsets -o name", tree: true}}
      history: {description: "View rollout history", args: {exec: "kubectl get deployments,daemonsets,statefulsets -o name", tree: true}}
      pause: {description: "Mark the provided resource as paused", args: {exec: "kubectl get deployments -o name", tree: true}}
      resume: {description: "Resume a paused resource", args: {exec: "kubectl get deployments -o name"}}
  top:
    description: Display resource (CPU/memory) usage
    commands:
      pod: {description: "Display resource usage of pods", args: {exec: "kubectl get pods -o name | sed 's|^pod/||'"}}
      node: {description: "Display resource usage of nodes", args: {exec: "kubectl get nodes -o name | sed 's|^node/||'"}}
  label:
    description: Update the labels on a resource
    flags:
      --overwrite: {description: "Allow labels to be overwritten", show: always}
    args:
      exec: kubectl api-resources --cached -o name
  annotate:
    description: Update the annotations on a resource
    flags:
      --overwrite: {description: "Allow annotations to be overwritten", show: always}
    args:
      exec: kubectl api-resources --cached -o name
  cp:
    description: Copy files and directories to and from containers
    flags:
      -c: {value: any, description: "Container name", show: always}
      --container: {value: any, description: "Container name", show: always}
    args: file
  run:
    description: Run a particular image on the cluster
    flags:
      --image: {value: any, description: "The image for the container to run", show: always}
      --rm: {description: "Delete the pod after it exits", show: always}
      -i: {description: "Keep stdin open on the container"}
      --stdin: {description: "Keep stdin open on the container"}
      -t: {description: "Allocate a TTY"}
      --tty: {description: "Allocate a TTY"}
      --restart: {value: {exec: "printf '%s\\n' Always OnFailure Never"}, description: "The restart policy for this Pod", show: always}
      --env: {value: any, description: "Environment variables to set in the container", show: always}
      --port: {value: any, description: "The port that this container exposes", show: always}
  expose:
    description: Take a replication controller, service, deployment or pod and expose it as a new service
    flags:
      --port: {value: any, description: "The port that the service should serve on", show: always}
      --target-port: {value: any, description: "Port on the container that the service should direct traffic to", show: always}
      --type: {value: {exec: "printf '%s\\n' ClusterIP NodePort LoadBalancer ExternalName"}, description: "Type for this service"}
      --name: {value: any, description: "The name for the newly created object", show: always}
    args:
      exec: kubectl get deployments,pods,services,replicasets -o name
      tree: true
  cordon:
    description: Mark node as unschedulable
    args: {exec: "kubectl get nodes -o name | sed 's|^node/||'"}
  uncordon:
    description: Mark node as schedulable
    args: {exec: "kubectl get nodes -o name | sed 's|^node/||'"}
  drain:
    description: Drain node in preparation for maintenance
    flags:
      --ignore-daemonsets: {description: "Ignore DaemonSet-managed pods", show: always}
      --delete-emptydir-data: {description: "Continue even if there are pods using emptyDir", show: always}
      --force: {description: "Continue even if there are pods not managed by a controller", show: always}
    args: {exec: "kubectl get nodes -o name | sed 's|^node/||'"}
  config:
    description: Modify kubeconfig files
    commands:
      current-context: {description: "Display the current-context"}
      get-contexts: {description: "Describe one or many contexts"}
      use-context: {description: "Set the current-context in a kubeconfig file", args: {exec: "kubectl config get-contexts -o name"}}
      set-context: {description: "Set a context entry in kubeconfig", args: {exec: "kubectl config get-contexts -o name"}, flags: {--current: {description: "Modify the current context"}, --namespace: {value: {exec: "kubectl get namespaces -o name | sed 's|^namespace/||'"}, description: "Namespace for the context"}}}
      delete-context: {description: "Delete the specified context from the kubeconfig", args: {exec: "kubectl config get-contexts -o name"}}
      rename-context: {description: "Rename a context from the kubeconfig file", args: {exec: "kubectl config get-contexts -o name"}}
      get-clusters: {description: "Display clusters defined in the kubeconfig"}
      get-users: {description: "Display users defined in the kubeconfig"}
      view: {description: "Display merged kubeconfig settings", flags: {--minify: {description: "Remove all information not used by current-context"}, --raw: {description: "Display raw byte data and sensitive data"}}}
  explain:
    description: Get documentation for a resource
    flags:
      --recursive: {description: "Print the fields of fields", show: always}
    args:
      exec: kubectl api-resources --cached -o name
  api-resources:
    description: Print the supported API resources on the server
  api-versions:
    description: Print the supported API versions on the server
  cluster-info:
    description: Display cluster information
  version:
    description: Print the client and server version information
    flags:
      --client: {description: "If true, shows client version only", show: always}
  help:
    description: Help about any command
    args: "@subcommands"
snippets:
  - key: p
    mark: pin
    command: "kubectl get pods -A -o wide"
    description: "pods in every namespace with node and IP"
  - key: r
    mark: pin
    command: "kubectl rollout restart deployment/my-app"
    description: "restart all pods of a deployment"
  - key: f
    mark: pin
    command: "kubectl port-forward svc/my-service 8080:80"
    description: "localhost:8080 reaches the service's port 80"
  - key: l
    mark: pin
    command: "kubectl logs -f deployment/my-app --since=10m"
    description: "follow logs of a deployment"
  - key: e
    command: "kubectl get events --sort-by=.lastTimestamp"
    description: "recent events, newest last"
  - key: s
    command: "kubectl get secret my-secret -o jsonpath='{.data.password}' | base64 -d"
    description: "decode one key of a secret"
  - key: x
    command: "kubectl exec -it deploy/my-app -- sh"
    description: "shell inside a running pod"
  - key: n
    command: "kubectl config set-context --current --namespace=my-ns"
    description: "change the default namespace"
  - key: c
    command: "kubectl config get-contexts"
    description: "clusters you can switch to"
  - key: t
    command: "kubectl top pods --sort-by=memory"
    description: "pods by memory use"
  - key: d
    command: "kubectl run debug --rm -it --image=busybox -- sh"
    description: "throwaway pod for network debugging"

version: '20261015'
description: Kubernetes package manager
flags:
  --help: {aliases: [-h], description: "Show help"}
  --kube-context: {value: {exec: "kubectl config get-contexts -o name 2>/dev/null"}, description: "Name of the kubeconfig context to use"}
  --kubeconfig: {value: file, description: "Path to the kubeconfig file"}
  --kube-apiserver: {value: any, description: "The address and the port for the Kubernetes API server"}
  --debug: {description: "Enable verbose output"}
  --namespace: {aliases: [-n], value: {exec: "kubectl get namespaces -o name 2>/dev/null | cut -d/ -f2"}, description: "Namespace scope for this request"}
commands:
  install:
    description: Install a chart
    flags:
      --namespace: {aliases: [-n], value: any, description: "Namespace scope for this request"}
      --values: {aliases: [-f], value: file, description: "Specify values in a YAML file or a URL", show: always}
      --set: {value: any, description: "Set values on the command line", show: always}
      --set-string: {value: any, description: "Set STRING values on the command line"}
      --set-file: {value: any, description: "Set values from respective files specified via the command line"}
      --set-json: {value: any, description: "Set JSON values on the command line"}
      --atomic: {description: "If set, the installation process deletes the installation on failure"}
      --wait: {description: "If set, will wait until all Pods, PVCs, Services, and minimum number of Pods of a Deployment are in a ready state before marking the release as successful"}
      --wait-for-jobs: {description: "If set and --wait enabled, will wait until all Jobs have been completed before marking the release as successful"}
      --timeout: {value: any, description: "Time to wait for any individual Kubernetes operation"}
      --create-namespace: {description: "Create the release namespace if not present"}
      --dry-run: {value: any, description: "Simulate an install", show: always}
      --debug: {description: "Enable verbose output"}
      --generate-name: {aliases: [-g], description: "Generate the name (and omit the NAME parameter)", show: always}
      --render-subchart-notes: {description: "If set, render subchart notes along with the parent"}
      --dependency-update: {description: "Update dependencies if they are missing before installing the chart"}
      --version: {value: any, description: "Specify a version constraint for the chart version to use"}
      --repo: {value: any, description: "Chart repository url where to locate the requested chart"}
      --username: {value: any, description: "Chart repository username where to locate the requested chart"}
      --password: {value: any, description: "Chart repository password where to locate the requested chart"}
      --cert-file: {value: file, description: "Identify HTTPS client using this SSL certificate file"}
      --key-file: {value: file, description: "Identify HTTPS client using this SSL key file"}
      --ca-file: {value: file, description: "Verify certificates of HTTPS-enabled servers using this CA bundle"}
      --insecure-skip-tls-verify: {description: "Skip tls certificate checks for the chart download"}
      --pass-credentials: {description: "Pass credentials to all domains"}
      --devel: {description: "Use development versions, too"}
      --replace: {description: "Re-use the given name, even if that name is already used"}
    args: [{exec: "helm search repo 2>/dev/null | tail -n +2 | awk -F'\\t' '{gsub(/ +$/,\"\",$1); gsub(/ +$/,\"\",$4); print $1\"\\t\"$4}'", tree: true}, file]
  uninstall:
    description: Uninstall a release
    aliases: [delete]
    flags:
      --namespace: {aliases: [-n], value: any, description: "Namespace scope for this request"}
      --dry-run: {value: any, description: "Simulate an uninstall"}
      --keep-history: {description: "Remove all associated resources and mark the release as deleted, but retain the release history"}
      --no-hooks: {description: "Prevent hooks from running during uninstallation"}
      --timeout: {value: any, description: "Time to wait for any individual Kubernetes operation"}
      --wait: {description: "If set, will wait until all the resources are deleted before returning"}
      --debug: {description: "Enable verbose output"}
    args:
      exec: "helm list --short 2>/dev/null"
  upgrade:
    description: Upgrade a release
    flags:
      --namespace: {aliases: [-n], value: any, description: "Namespace scope for this request"}
      --values: {aliases: [-f], value: file, description: "Specify values in a YAML file or a URL"}
      --set: {value: any, description: "Set values on the command line"}
      --set-string: {value: any, description: "Set STRING values on the command line"}
      --set-file: {value: any, description: "Set values from respective files specified via the command line"}
      --set-json: {value: any, description: "Set JSON values on the command line"}
      --atomic: {description: "If set, upgrade process rolls back changes made in case of failed upgrade"}
      --wait: {description: "If set, will wait until all Pods, PVCs, Services, and minimum number of Pods of a Deployment are in a ready state before marking the release as successful"}
      --wait-for-jobs: {description: "If set and --wait enabled, will wait until all Jobs have been completed before marking the release as successful"}
      --timeout: {value: any, description: "Time to wait for any individual Kubernetes operation"}
      --create-namespace: {description: "If --install is set, create the release namespace if not present"}
      --dry-run: {value: any, description: "Simulate an upgrade"}
      --debug: {description: "Enable verbose output"}
      --install: {aliases: [-i], description: "If a release by this name doesn't already exist, run an install"}
      --render-subchart-notes: {description: "If set, render subchart notes along with the parent"}
      --dependency-update: {description: "Update dependencies if they are missing before installing the chart"}
      --version: {value: any, description: "Specify a version constraint for the chart version to use"}
      --repo: {value: any, description: "Chart repository url where to locate the requested chart"}
      --username: {value: any, description: "Chart repository username where to locate the requested chart"}
      --password: {value: any, description: "Chart repository password where to locate the requested chart"}
      --cert-file: {value: file, description: "Identify HTTPS client using this SSL certificate file"}
      --key-file: {value: file, description: "Identify HTTPS client using this SSL key file"}
      --ca-file: {value: file, description: "Verify certificates of HTTPS-enabled servers using this CA bundle"}
      --insecure-skip-tls-verify: {description: "Skip tls certificate checks for the chart download"}
      --pass-credentials: {description: "Pass credentials to all domains"}
      --devel: {description: "Use development versions, too"}
      --force: {description: "Force resource updates through a replacement strategy"}
      --cleanup-on-fail: {description: "Allow deletion of new resources created in this upgrade when upgrade fails"}
      --history-max: {value: any, description: "Limit the maximum number of revisions saved per release"}
      --no-hooks: {description: "Disable pre/post upgrade hooks"}
      --reset-values: {description: "When upgrading, reset the values to the ones built into the chart"}
      --reuse-values: {description: "When upgrading, reuse the last release's values and merge in any overrides from the command line via --set and -f"}
    args: [{exec: "helm list --short 2>/dev/null"}, {exec: "helm search repo 2>/dev/null | tail -n +2 | awk -F'\\t' '{gsub(/ +$/,\"\",$1); gsub(/ +$/,\"\",$4); print $1\"\\t\"$4}'", tree: true}, file]
  rollback:
    description: Roll back a release to a previous revision
    flags:
      --namespace: {aliases: [-n], value: any, description: "Namespace scope for this request"}
      --cleanup-on-fail: {description: "Allow deletion of new resources created in this rollback when rollback fails"}
      --dry-run: {value: any, description: "Simulate a rollback"}
      --force: {description: "Force resource update through delete/recreate if needed"}
      --no-hooks: {description: "Prevent hooks from running during rollback"}
      --recreate-pods: {description: "Performs pods restart for the resource if applicable"}
      --timeout: {value: any, description: "Time to wait for any individual Kubernetes operation"}
      --wait: {description: "If set, will wait until all Pods, PVCs, Services are in a ready state before marking the release as successful"}
      --wait-for-jobs: {description: "If set and --wait enabled, will wait until all Jobs have been completed before marking the release as successful"}
      --debug: {description: "Enable verbose output"}
    args:
      exec: "helm list --short 2>/dev/null"
  list:
    description: List releases
    aliases: [ls]
    flags:
      --namespace: {aliases: [-n], value: any, description: "Namespace scope for this request"}
      --all-namespaces: {aliases: [-A], description: "List releases across all namespaces"}
      --all: {aliases: [-a], description: "Show all releases without any filter applied"}
      --failed: {description: "Show failed releases"}
      --pending: {description: "Show pending releases"}
      --deployed: {description: "Show deployed releases"}
      --uninstalled: {description: "Show uninstalled releases"}
      --superseded: {description: "Show superseded releases"}
      --output: {aliases: [-o], value: any, description: "Prints the output in the specified format (table, json, yaml)"}
      --short: {aliases: [-q], description: "Only show release names"}
      --max: {aliases: [-m], value: any, description: "Maximum number of releases to fetch"}
      --offset: {value: any, description: "Next release name in the list, used to offset from start value"}
      --reverse: {aliases: [-r], description: "Reverse the sort order"}
      --time-format: {value: any, description: "Format time using golang time formatter"}
      --date: {aliases: [-d], description: "Sort by release date"}
      --filter: {value: any, description: "A regular expression used to filter which releases are included in the results"}
      --selector: {value: any, description: "Selector (label query) to filter on"}
      --debug: {description: "Enable verbose output"}
  get:
    description: Download extended information of a named release
    commands:
      all:
        description: Download all information for a named release
        flags:
          --namespace: {aliases: [-n], value: any, description: "Namespace scope for this request"}
          --revision: {value: any, description: "Get the named release with revision"}
          --template: {value: any, description: "Go template for formatting the output"}
        args:
          exec: "helm list --short 2>/dev/null"
      hooks:
        description: Download all hooks for a named release
        flags:
          --namespace: {aliases: [-n], value: any, description: "Namespace scope for this request"}
          --revision: {value: any, description: "Get the named release with revision"}
        args:
          exec: "helm list --short 2>/dev/null"
      manifest:
        description: Download the manifest for a named release
        flags:
          --namespace: {aliases: [-n], value: any, description: "Namespace scope for this request"}
          --revision: {value: any, description: "Get the named release with revision"}
        args:
          exec: "helm list --short 2>/dev/null"
      notes:
        description: Download the notes for a named release
        flags:
          --namespace: {aliases: [-n], value: any, description: "Namespace scope for this request"}
          --revision: {value: any, description: "Get the named release with revision"}
        args:
          exec: "helm list --short 2>/dev/null"
      values:
        description: Download the values file for a named release
        flags:
          --namespace: {aliases: [-n], value: any, description: "Namespace scope for this request"}
          --revision: {value: any, description: "Get the named release with revision"}
          --output: {aliases: [-o], value: any, description: "Prints the output in the specified format"}
          --all: {aliases: [-a], description: "Dump all (computed) values"}
        args:
          exec: "helm list --short 2>/dev/null"
  history:
    description: Fetch release history
    flags:
      --namespace: {aliases: [-n], value: any, description: "Namespace scope for this request"}
      --max: {value: any, description: "Maximum number of revision to include in history"}
      --output: {aliases: [-o], value: any, description: "Prints the output in the specified format (table, json, yaml)"}
      --debug: {description: "Enable verbose output"}
    args:
      exec: "helm list --short 2>/dev/null"
  status:
    description: Display the status of the named release
    flags:
      --namespace: {aliases: [-n], value: any, description: "Namespace scope for this request"}
      --revision: {value: any, description: "If set, display the status of the named release with revision"}
      --output: {aliases: [-o], value: any, description: "Prints the output in the specified format (table, json, yaml)"}
      --debug: {description: "Enable verbose output"}
    args:
      exec: "helm list --short 2>/dev/null"
  template:
    description: Locally render templates
    flags:
      --namespace: {aliases: [-n], value: any, description: "Namespace scope for this request"}
      --values: {aliases: [-f], value: file, description: "Specify values in a YAML file or a URL"}
      --set: {value: any, description: "Set values on the command line"}
      --set-string: {value: any, description: "Set STRING values on the command line"}
      --set-file: {value: any, description: "Set values from respective files specified via the command line"}
      --set-json: {value: any, description: "Set JSON values on the command line"}
      --version: {value: any, description: "Specify a version constraint for the chart version to use"}
      --api-versions: {value: any, description: "Kubernetes api versions used for Capabilities.APIVersions"}
      --include-crds: {description: "Include CRDs in the templated output"}
      --is-upgrade: {description: "Set .Release.IsUpgrade instead of .Release.IsInstall"}
      --no-hooks: {description: "Prevent hooks from running in the manifest output"}
      --release-name: {description: "Use release name in the output"}
      --show-only: {value: any, description: "Only show manifests rendered from the given templates"}
      --validate: {description: "Validate your manifests against the Kubernetes cluster you are currently pointing at"}
      --debug: {description: "Enable verbose output"}
    args: [{exec: "helm search repo 2>/dev/null | tail -n +2 | awk -F'\\t' '{gsub(/ +$/,\"\",$1); gsub(/ +$/,\"\",$4); print $1\"\\t\"$4}'", tree: true}, file]
  package:
    description: Package a chart directory into a chart archive
    flags:
      --app-version: {value: any, description: "Set the appVersion on the chart to this version"}
      --dependency-update: {aliases: [-u], description: "Update dependencies from Chart.yaml to dir before packaging if they are missing"}
      --destination: {aliases: [-d], value: dir, description: "Location to write the chart"}
      --key: {value: any, description: "Name of the key to use when signing"}
      --keyring: {value: file, description: "Location of a public keyring"}
      --passphrase-file: {value: file, description: "Location of a file which contains the passphrase for the signing key"}
      --sign: {description: "Use a PGP private key to sign this package"}
      --version: {value: any, description: "Set the version on the chart to this semver version"}
  push:
    description: Push a chart to a remote
    flags:
      --ca-file: {value: file, description: "Verify certificates of HTTPS-enabled servers using this CA bundle"}
      --cert-file: {value: file, description: "Identify HTTPS client using this SSL certificate file"}
      --key-file: {value: file, description: "Identify HTTPS client using this SSL key file"}
      --insecure-skip-tls-verify: {description: "Skip tls certificate checks for the chart upload"}
      --plain-http: {description: "Use insecure HTTP connections for the chart upload"}
      --debug: {description: "Enable verbose output"}
  pull:
    description: Download a chart from a repository and (optionally) unpack it in local directory
    aliases: [fetch]
    flags:
      --ca-file: {value: file, description: "Verify certificates of HTTPS-enabled servers using this CA bundle"}
      --cert-file: {value: file, description: "Identify HTTPS client using this SSL certificate file"}
      --key-file: {value: file, description: "Identify HTTPS client using this SSL key file"}
      --insecure-skip-tls-verify: {description: "Skip tls certificate checks for the chart download"}
      --username: {value: any, description: "Chart repository username"}
      --password: {value: any, description: "Chart repository password"}
      --pass-credentials: {description: "Pass credentials to all domains"}
      --destination: {aliases: [-d], value: dir, description: "Location to write the chart"}
      --devel: {description: "Use development versions, too"}
      --prov: {description: "Fetch the provenance file, but don't perform verification"}
      --repo: {value: any, description: "Chart repository url where to locate the requested chart"}
      --untar: {description: "If set to true, will untar the chart after downloading it"}
      --untardir: {value: dir, description: "If untar is specified, this flag specifies where to untar the chart"}
      --verify: {description: "Verify the package before using it"}
      --version: {value: any, description: "Specify a version constraint for the chart version to use"}
      --debug: {description: "Enable verbose output"}
    args: [{exec: "helm search repo 2>/dev/null | tail -n +2 | awk -F'\\t' '{gsub(/ +$/,\"\",$1); gsub(/ +$/,\"\",$4); print $1\"\\t\"$4}'", tree: true}, file]
  repo:
    description: Add, list, remove, update, and index chart repositories
    commands:
      add:
        description: Add a chart repository
        flags:
          --ca-file: {value: file, description: "Verify certificates of HTTPS-enabled servers using this CA bundle"}
          --cert-file: {value: file, description: "Identify HTTPS client using this SSL certificate file"}
          --key-file: {value: file, description: "Identify HTTPS client using this SSL key file"}
          --insecure-skip-tls-verify: {description: "Skip tls certificate checks for the repository download"}
          --username: {value: any, description: "Chart repository username"}
          --password: {value: any, description: "Chart repository password"}
          --pass-credentials: {description: "Pass credentials to all domains"}
          --no-update: {description: "Raise error if repo is already registered"}
          --force-update: {description: "Replace (overwrite) the repo if it already exists"}
        args: any
      list:
        description: List chart repositories
        flags:
          --output: {aliases: [-o], value: any, description: "Prints the output in the specified format (table, json, yaml)"}
      index:
        description: Generate an index file given a directory containing packaged charts
        flags:
          --merge: {value: file, description: "Merge the generated index into the given index"}
          --url: {value: any, description: "Url of chart repository"}
      update:
        description: Update information of available charts locally from chart repositories
        flags:
          --fail-on-repo-update-fail: {description: "Update fails if any of the repository updates fail"}
        args: {exec: "helm repo list 2>/dev/null | tail -n +2 | awk '{print $1}'"}
      remove:
        description: Remove one or more chart repositories
        args: {exec: "helm repo list 2>/dev/null | tail -n +2 | awk '{print $1}'"}
  search:
    description: Search for a keyword in charts
    commands:
      repo:
        description: Search repositories for a keyword in charts
        flags:
          --devel: {description: "Use development versions (alpha, beta, and release candidate releases), too"}
          --max-col-width: {value: any, description: "Maximum column width for output table"}
          --output: {aliases: [-o], value: any, description: "Prints the output in the specified format (table, json, yaml)"}
          --regexp: {aliases: [-r], description: "Use regular expressions for searching repositories you have added"}
          --version: {value: any, description: "Search using semantic versioning constraints on repositories you have added"}
          --versions: {description: "Show the long listing, with each version of each chart on its own line"}
      hub:
        description: Search for charts in the Artifact Hub or your own hub instance
        flags:
          --endpoint: {value: any, description: "Hub instance to query for charts"}
          --max-col-width: {value: any, description: "Maximum column width for output table"}
          --output: {aliases: [-o], value: any, description: "Prints the output in the specified format (table, json, yaml)"}
          --list-repo-url: {description: "Print charts repository URL"}
  show:
    description: Show information of a chart
    commands:
      all:
        description: Show all information of the chart
        flags:
          --version: {value: any, description: "Specify a version constraint for the chart version to use"}
          --devel: {description: "Use development versions, too"}
        args: [{exec: "helm search repo 2>/dev/null | tail -n +2 | awk -F'\\t' '{gsub(/ +$/,\"\",$1); gsub(/ +$/,\"\",$4); print $1\"\\t\"$4}'", tree: true}, file]
      chart:
        description: Show the chart's definition
        flags:
          --version: {value: any, description: "Specify a version constraint for the chart version to use"}
          --devel: {description: "Use development versions, too"}
        args: [{exec: "helm search repo 2>/dev/null | tail -n +2 | awk -F'\\t' '{gsub(/ +$/,\"\",$1); gsub(/ +$/,\"\",$4); print $1\"\\t\"$4}'", tree: true}, file]
      crds:
        description: Show the chart's CRDs
        flags:
          --version: {value: any, description: "Specify a version constraint for the chart version to use"}
          --devel: {description: "Use development versions, too"}
      readme:
        description: Show the chart's README
        flags:
          --version: {value: any, description: "Specify a version constraint for the chart version to use"}
          --devel: {description: "Use development versions, too"}
        args: [{exec: "helm search repo 2>/dev/null | tail -n +2 | awk -F'\\t' '{gsub(/ +$/,\"\",$1); gsub(/ +$/,\"\",$4); print $1\"\\t\"$4}'", tree: true}, file]
      values:
        description: Show the chart's values
        flags:
          --version: {value: any, description: "Specify a version constraint for the chart version to use"}
          --devel: {description: "Use development versions, too"}
          --jsonpath: {value: any, description: "Supply a JSONPath expression to filter the output"}
        args: [{exec: "helm search repo 2>/dev/null | tail -n +2 | awk -F'\\t' '{gsub(/ +$/,\"\",$1); gsub(/ +$/,\"\",$4); print $1\"\\t\"$4}'", tree: true}, file]
  create:
    description: Create a new chart with the given name
    flags:
      --starter: {aliases: [-p], value: dir, description: "The named Helm starter scaffold"}
  dependency:
    description: Manage a chart's dependencies
    commands:
      build:
        description: Rebuild the charts/ directory based on the Chart.lock file
        flags:
          --keyring: {value: file, description: "Keyring containing public keys"}
          --skip-refresh: {description: "Do not refresh the local repository cache"}
          --verify: {description: "Verify the packages against signatures"}
      list:
        description: List the dependencies for the given chart
        flags:
          --max-col-width: {value: any, description: "Maximum column width for output table"}
          --output: {aliases: [-o], value: any, description: "Prints the output in the specified format (table, json, yaml)"}
      update:
        description: Update charts/ based on the contents of Chart.yaml
        flags:
          --keyring: {value: file, description: "Keyring containing public keys"}
          --skip-refresh: {description: "Do not refresh the local repository cache"}
          --verify: {description: "Verify the packages against signatures"}
  plugin:
    description: Install, list, or uninstall Helm plugins
    commands:
      install:
        description: Install one or more Helm plugins
        flags:
          --version: {value: any, description: "Specify a version constraint"}
      list:
        description: List installed Helm plugins
      uninstall:
        description: Uninstall one or more Helm plugins
      update:
        description: Update one or more Helm plugins
  registry:
    description: Login to or logout from a registry
    commands:
      login:
        description: Login to a registry
        flags:
          --username: {aliases: [-u], value: any, description: "Registry username"}
          --password: {aliases: [-p], value: any, description: "Registry password"}
          --password-stdin: {description: "Read password or identity token from stdin"}
          --ca-file: {value: file, description: "Verify certificates of HTTPS-enabled servers using this CA bundle"}
          --cert-file: {value: file, description: "Identify HTTPS client using this SSL certificate file"}
          --key-file: {value: file, description: "Identify HTTPS client using this SSL key file"}
          --insecure: {description: "Allow connections to TLS registry without certs"}
      logout:
        description: Logout from a registry
  test:
    description: Run tests for a release
    flags:
      --namespace: {aliases: [-n], value: any, description: "Namespace scope for this request"}
      --filter: {value: any, description: "Specify tests by attribute (currently \"name\") using attribute=value syntax"}
      --logs: {description: "Dump the logs from test pods (this runs after all tests are complete, but before any cleanup)"}
      --timeout: {value: any, description: "Time to wait for any individual Kubernetes operation"}
      --debug: {description: "Enable verbose output"}
    args:
      exec: "helm list --short 2>/dev/null"
  lint:
    description: Examine a chart for possible issues
    flags:
      --values: {aliases: [-f], value: file, description: "Specify values in a YAML file or a URL"}
      --set: {value: any, description: "Set values on the command line"}
      --set-string: {value: any, description: "Set STRING values on the command line"}
      --set-file: {value: any, description: "Set values from respective files specified via the command line"}
      --set-json: {value: any, description: "Set JSON values on the command line"}
      --namespace: {value: any, description: "Namespace to lint for"}
      --strict: {description: "Fail on lint warnings"}
      --with-subcharts: {description: "Lint dependent charts"}
      --quiet: {description: "Print only warnings and errors"}
      --debug: {description: "Enable verbose output"}
    args: file
  verify:
    description: Verify that a chart at the given path has been signed and is valid
    flags:
      --keyring: {value: file, description: "Keyring containing public keys"}
  version:
    description: Print the client version information
    flags:
      --short: {description: "Print just the version number"}
      --template: {value: any, description: "Template for version string format"}
      --output: {aliases: [-o], value: any, description: "Prints the output in the specified format (json, yaml)"}
  completion:
    description: Generate autocompletion scripts for the specified shell
  env:
    description: Helm client environment information
    flags:
      --output: {aliases: [-o], value: any, description: "Prints the output in the specified format (json, yaml)"}
snippets:
  - key: u
    mark: pin
    command: "helm upgrade --install my-release ./chart -n my-ns --create-namespace -f values.yaml"
    description: "install or upgrade in one step"
  - key: t
    mark: pin
    command: "helm template my-release ./chart -f values.yaml | less"
    description: "render manifests without touching the cluster"
  - key: l
    mark: pin
    command: "helm list -A"
    description: "releases in every namespace"
  - key: v
    command: "helm get values my-release -n my-ns"
    description: "values a release was deployed with"
  - key: h
    command: "helm history my-release -n my-ns"
    description: "revisions of a release"
  - key: r
    command: "helm rollback my-release 1 -n my-ns"
    description: "go back to revision 1"
  - key: s
    command: "helm search repo nginx --versions"
    description: "chart versions in added repos"
  - key: d
    command: "helm upgrade --install my-release ./chart --dry-run --debug"
    description: "show what would change, with the rendered output"
  - key: p
    command: "helm repo update"

version: '20261015'
description: Switch the kubectl namespace
flags:
  --help: {aliases: [-h], description: "Show help"}
  --current: {aliases: [-c], description: "Show the current namespace"}
  --force: {aliases: [-f], description: "Switch even if the namespace doesn't exist"}
  --unset: {aliases: [-u], description: "Unset the namespace (back to default)"}
  --version: {aliases: [-V], description: "Show version"}
args: {exec: "kubectl get ns -o name 2>/dev/null | sed 's|namespace/||'; echo -", cache: 30}
snippets:
  - key: s
    mark: pin
    command: "kubens -"
    description: "back to the previous namespace"
  - key: c
    mark: pin
    command: "kubens -c"
    description: "print the active namespace"
  - key: k
    command: "kubens kube-system"
    description: "jump to kube-system"
  - key: u
    command: "kubens -u"
    description: "reset to default"

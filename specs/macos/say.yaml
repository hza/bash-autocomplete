version: '20261015'
description: "Convert text to audible speech"
flags:
  --voice:
    aliases: [-v]
    show: always
    value: {exec: "say -v '?' | sed -E 's/^(.*[^ ]) +([a-z]{2,3}_[A-Za-z0-9]+) +# (.*)$/\\1\t\\2  \\3/'"}
    description: "Voice to use"
  --rate: {aliases: [-r], value: any, description: "Speech rate in words per minute", show: always}
  --input-file: {aliases: [-f], value: file, description: "Read text from file ('-' for stdin)", show: always}
  --output-file: {aliases: [-o], value: file, description: "Write audio to file instead of speaking", show: always}
  --network-send: {aliases: [-n], value: any, description: "Send audio to a network service (name:port)"}
  --audio-device:
    aliases: [-a]
    value: {exec: "say -a '?' | sed -E 's/^ *([0-9]+) +(.*)$/\\1\t\\2/'"}
    description: "Audio device to use"
  --interactive: {aliases: [-i], description: "Highlight words as they are spoken"}
  --progress: {description: "Show a progress meter"}
  --file-format:
    value: {exec: "say --file-format=? 2>&1 | sed -E 's/^([^ ]+) +(.*)$/\\1\t\\2/'"}
    description: "Audio file format"
  --data-format: {value: any, description: "Audio data format"}
  --channels: {value: any, description: "Number of channels"}
  --bit-rate: {value: any, description: "Bit rate for compressed formats"}
  --quality: {value: any, description: "Converter quality level (0-127)"}
args: any
snippets:
  - key: p
    mark: pin
    command: "say 'build finished'"
    description: "speak a phrase"
  - key: d
    command: "make; say done"
    description: "announce when a command ends"
  - key: v
    mark: pin
    command: "say -v '?'"
    description: "list voices"
  - key: r
    command: "say -v Samantha -r 200 'faster please'"
    description: "pick voice and speed"
  - key: f
    command: "say -f notes.txt -o notes.aiff"
    description: "read a file into an audio file"

version: '20261013'
description: "Copy standard input to the pasteboard"
flags:
  -help: {description: "Show usage"}
  -pboard:
    value: {exec: "printf '%s\\n' general ruler find font"}
    description: "Pasteboard to use"
snippets:
  - key: f
    mark: pin
    command: "pbcopy < ~/.ssh/id_ed25519.pub"
    description: "copy a file's contents"
  - key: o
    mark: pin
    command: "git rev-parse HEAD | pbcopy"
    description: "copy a command's output"
  - key: n
    command: "pwd | tr -d '\\n' | pbcopy"
    description: "copy without trailing newline"

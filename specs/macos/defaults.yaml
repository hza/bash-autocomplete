description: macOS user defaults management
flags:
  --help: {description: "Show help"}
  -app: {value: any, description: "Application name"}
  -host: {value: any, description: "Hostname"}
  -currentHost: {description: "Use current host"}
  -g: {description: "Use global domain"}
  -globalDomain: {description: "Use global domain"}
  -container: {value: any, description: "Container identifier"}
commands:
  read:
    description: Read the specified default(s) from the defaults system
    flags:
      -app: {value: any, description: "Application name", show: always}
      -globalDomain: {description: "Use global domain"}
      -g: {description: "Use global domain"}
      -host: {value: any, description: "Hostname"}
      -currentHost: {description: "Use current host"}
      -container: {value: any, description: "Container identifier"}
    args:
      exec: "defaults domains 2>/dev/null | tr ',' '\\n' | tr -d ' '"
  write:
    description: Write the specified default to the defaults system
    flags:
      -app: {value: any, description: "Application name"}
      -globalDomain: {description: "Use global domain"}
      -g: {description: "Use global domain"}
      -host: {value: any, description: "Hostname"}
      -currentHost: {description: "Use current host"}
      -container: {value: any, description: "Container identifier"}
      -string: {description: "Write a string value"}
      -data: {description: "Write a data value"}
      -int: {description: "Write an integer value"}
      -integer: {description: "Write an integer value"}
      -float: {description: "Write a float value", show: always}
      -bool: {description: "Write a boolean value"}
      -boolean: {description: "Write a boolean value"}
      -date: {description: "Write a date value"}
      -array: {description: "Write an array value"}
      -array-add: {description: "Append to an existing array value"}
      -dict: {description: "Write a dictionary value"}
      -dict-add: {description: "Append to an existing dictionary value"}
    args:
      exec: "defaults domains 2>/dev/null | tr ',' '\\n' | tr -d ' '"
  delete:
    description: Delete the specified default(s) from the defaults system
    flags:
      -app: {value: any, description: "Application name"}
      -globalDomain: {description: "Use global domain"}
      -g: {description: "Use global domain"}
      -host: {value: any, description: "Hostname"}
      -currentHost: {description: "Use current host"}
      -container: {value: any, description: "Container identifier"}
    args:
      exec: "defaults domains 2>/dev/null | tr ',' '\\n' | tr -d ' '"
  domains:
    description: List all domains in the user's defaults system
  find:
    description: Search for default name, key, and value
  help:
    description: Print a list of possible commands and a synopsis of each
  read-type:
    description: Read the type of the specified default
    flags:
      -app: {value: any, description: "Application name"}
      -globalDomain: {description: "Use global domain"}
      -g: {description: "Use global domain"}
      -host: {value: any, description: "Hostname"}
      -currentHost: {description: "Use current host"}
      -container: {value: any, description: "Container identifier"}
    args:
      exec: "defaults domains 2>/dev/null | tr ',' '\\n' | tr -d ' '"
  rename:
    description: Rename the specified default
    flags:
      -app: {value: any, description: "Application name"}
      -globalDomain: {description: "Use global domain"}
      -g: {description: "Use global domain"}
      -host: {value: any, description: "Hostname"}
      -currentHost: {description: "Use current host"}
      -container: {value: any, description: "Container identifier"}
    args:
      exec: "defaults domains 2>/dev/null | tr ',' '\\n' | tr -d ' '"
  export:
    description: Export the defaults for a specified domain
    flags:
      -app: {value: any, description: "Application name"}
      -globalDomain: {description: "Use global domain"}
      -g: {description: "Use global domain"}
      -host: {value: any, description: "Hostname"}
      -currentHost: {description: "Use current host"}
      -container: {value: any, description: "Container identifier"}
    args:
      exec: "defaults domains 2>/dev/null | tr ',' '\\n' | tr -d ' '"
  import:
    description: Import the defaults for a specified domain
    flags:
      -app: {value: any, description: "Application name"}
      -globalDomain: {description: "Use global domain"}
      -g: {description: "Use global domain"}
      -host: {value: any, description: "Hostname"}
      -currentHost: {description: "Use current host"}
      -container: {value: any, description: "Container identifier"}
    args:
      exec: "defaults domains 2>/dev/null | tr ',' '\\n' | tr -d ' '"
snippets:
  - key: h
    mark: pin
    command: "defaults write com.apple.finder AppleShowAllFiles -bool true && killall Finder"
    description: "show hidden files in Finder (Cmd-Shift-. toggles too)"
  - key: e
    command: "defaults write NSGlobalDomain AppleShowAllExtensions -bool true && killall Finder"
    description: "show all file extensions"
  - key: p
    command: "defaults write com.apple.finder ShowPathbar -bool true && killall Finder"
    description: "path bar at the bottom of Finder windows"
  - key: d
    mark: pin
    command: "defaults write com.apple.dock autohide-delay -float 0 && killall Dock"
    description: "Dock appears instantly when auto-hidden"
  - key: s
    mark: pin
    command: "defaults write com.apple.screencapture location ~/Desktop/Screenshots && killall SystemUIServer"
    description: "screenshot folder (create it first)"
  - key: f
    command: "defaults write com.apple.screencapture type jpg"
    description: "screenshot format: png jpg pdf heic"
  - key: n
    command: "defaults write com.apple.screencapture disable-shadow -bool true"
    description: "window screenshots without shadow"
  - key: k
    command: "defaults write NSGlobalDomain ApplePressAndHoldEnabled -bool false"
    description: "key repeat instead of the accent popup (relaunch apps)"
  - key: r
    command: "defaults write NSGlobalDomain KeyRepeat -int 2"
    description: "faster key repeat (log out to apply)"
  - key: x
    command: "defaults write com.apple.desktopservices DSDontWriteNetworkStores -bool true"
    description: "no .DS_Store files on network shares"
  - key: u
    command: "defaults delete com.apple.dock autohide-delay && killall Dock"
    description: "undo a tweak: delete the key to restore the default"
  - key: g
    mark: pin
    command: "defaults read com.apple.dock | grep -i autohide"
    description: "inspect a domain's current values"

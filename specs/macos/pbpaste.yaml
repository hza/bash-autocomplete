description: "Print the pasteboard contents"
flags:
  -help: {description: "Show usage"}
  -pboard:
    value: {exec: "printf '%s\\n' general ruler find font"}
    description: "Pasteboard to use"
  -Prefer:
    value: {exec: "printf '%s\\n' txt rtf ps public.html"}
    description: "Data type to look for first"
snippets:
  - key: f
    pin: true
    command: "pbpaste > notes.txt"
    description: "save the clipboard to a file"
  - key: j
    pin: true
    command: "pbpaste | jq ."
    description: "pretty-print copied JSON"
  - key: d
    command: "pbpaste | sort -u | pbcopy"
    description: "dedupe clipboard lines in place"
  - key: h
    command: "pbpaste -Prefer public.html > page.html"
    description: "paste copied rich text as HTML"

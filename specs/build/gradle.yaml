version: '20261015'
description: Build automation tool
flags:
  --help: {aliases: [-h], description: "Show help"}
  --project-dir: {aliases: [-p], value: dir, description: "Specifies the start directory for Gradle"}
  --build-file: {aliases: [-b], value: file, description: "Specifies the build file"}
  --gradle-user-home: {aliases: [-g], value: dir, description: "Specifies the Gradle user home directory"}
  --settings-file: {aliases: [-c], value: file, description: "Specifies the settings file"}
  --init-script: {aliases: [-I], value: file, description: "Specifies an initialization script"}
  --system-prop: {aliases: [-D], value: any, description: "Set system property"}
  --project-prop: {aliases: [-P], value: any, description: "Set project property"}
  --dry-run: {aliases: [-m], description: "Run the builds with all task actions disabled"}
  --quiet: {aliases: [-q], description: "Log errors only"}
  --warn: {aliases: [-w], description: "Set log level to warn"}
  --info: {aliases: [-i], description: "Set log level to info", show: always}
  --debug: {aliases: [-d], description: "Log in debug mode"}
  --stacktrace: {aliases: [-s], description: "Print out the stacktrace for all exceptions"}
  --full-stacktrace: {aliases: [-S], description: "Print out the full (very verbose) stacktrace for all exceptions"}
  --exclude-task: {aliases: [-x], value: {exec: "{ ./gradlew -q tasks --all 2>/dev/null || gradle -q tasks --all 2>/dev/null; } | awk '/^[a-zA-Z][a-zA-Z0-9:]* - /{t=$1; sub(/^[^ ]* - /,\"\"); print t\"\\t\"$0; next} /^[a-zA-Z][a-zA-Z0-9:]*$/{print $1}'"}, description: "Specify a task to be excluded from execution", show: always}
  --rerun-tasks: {description: "Ignore previously cached task results"}
  --continue: {description: "Continue task execution after a task failure"}
  --parallel: {description: "Build projects in parallel"}
  --no-parallel: {description: "Disable parallel project execution"}
  --max-workers: {value: any, description: "Configure the number of concurrent workers Gradle is allowed to use"}
  --configure-on-demand: {description: "Configure necessary projects only"}
  --no-configure-on-demand: {description: "Disable configuration on demand"}
  --build-cache: {description: "Enable the Gradle build cache"}
  --no-build-cache: {description: "Disable the Gradle build cache"}
  --configuration-cache: {description: "Enable the configuration cache"}
  --no-configuration-cache: {description: "Disable the configuration cache"}
  --daemon: {description: "Use the Gradle daemon to run the build"}
  --no-daemon: {description: "Do not use the Gradle daemon to run the build"}
  --status: {description: "Shows status of running and recently stopped Gradle daemon(s)"}
  --stop: {description: "Stops the Gradle daemon if it is running"}
  --continuous: {aliases: [-t], description: "Enables continuous build"}
  --scan: {description: "Create a build scan"}
  --no-scan: {description: "Do not create a build scan"}
  --refresh-dependencies: {description: "Refresh the state of dependencies"}
  --write-locks: {description: "Persists dependency resolution for locking, ignoring existing locking information if it exists"}
  --update-locks: {value: any, description: "Perform a partial update of the dependency lock"}
  --offline: {description: "Execute the build without accessing network resources", show: always}
  --console: {value: any, description: "Specifies which type of console output to generate"}
  --warning-mode: {value: any, description: "Specifies which mode of warnings to generate"}
  --version: {aliases: [-v], description: "Print version info"}
args: {exec: "{ ./gradlew -q tasks --all 2>/dev/null || gradle -q tasks --all 2>/dev/null; } | awk '/^[a-zA-Z][a-zA-Z0-9:]* - /{t=$1; sub(/^[^ ]* - /,\"\"); print t\"\\t\"$0; next} /^[a-zA-Z][a-zA-Z0-9:]*$/{print $1}'"}
version: '20261015'
description: "Build targets from a makefile"
flags:
  --file: {aliases: [-f], value: file, description: "Read FILE as a makefile", show: always}
  --makefile: {value: file, description: "Read FILE as a makefile"}
  --directory: {aliases: [-C], value: dir, description: "Change to DIRECTORY before doing anything", show: always}
  --jobs: {aliases: [-j], value: any, description: "Allow N jobs at once; infinite jobs with no arg", show: always}
  --keep-going: {aliases: [-k], description: "Keep going when some targets can't be made"}
  --dry-run: {aliases: [-n], description: "Don't actually run any commands; just print them"}
  --always-make: {aliases: [-B], description: "Unconditionally make all targets", show: always}
  --silent: {aliases: [-s], description: "Don't echo commands"}
  --ignore-errors: {aliases: [-i], description: "Ignore errors from commands"}
  --environment-overrides: {aliases: [-e], description: "Environment variables override makefiles", show: always}
  --print-data-base: {aliases: [-p], description: "Print make's internal database"}
  --question: {aliases: [-q], description: "Run no commands; exit status says if up to date"}
  --include-dir: {aliases: [-I], value: dir, description: "Search DIRECTORY for included makefiles"}
  -d: {description: "Print lots of debugging information"}
  --debug: {description: "Print various types of debugging information"}
  --version: {aliases: [-v], description: "Print the version number of make and exit"}
  --help: {aliases: [-h], description: "Print this message and exit"}
args: ["@make-targets", "@make-variables"]
